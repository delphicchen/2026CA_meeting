式確認 3\" A514S 可接單生產**：\n  * **外方同行人員 (44:12)**：向中鋼業務與技術代表說明：`\"Because he buys quite a lot of 3 inch... 514 Grade S... And you put it as...\"`\n  * **中鋼女業務 & 陳博士 (44:25)**：確認生產紀錄後一起用英文向客戶澄清：\n    * **中鋼女業務 (44:31)**：`\"Do you remember we have ever booked the A514 for some 3 inch?\"`（你記得我們曾經接過一些 3 吋的 A514 訂單嗎？）\n    * **陳博士 (44:35)**：`\"Yeah, we shipped it out! We did!\"`（對，我們已經出貨了！我們有做出來！）\n    * **外方同行人員 (44:42)**：`\"Well, he'd like to buy more!\"`（太好了，他想要買更多！）\n    * **中鋼女業務 (44:47)**：`\"Then you can place! No problem! But because the standard cannot show...\"`（那你可以下單！沒問題！只是因為標準規範上不能顯示…）\n    * **陳博士 (44:54)**：`\"Yeah, because the standard only covers up to 2.5 (inches)...\"`（對，因為 ASTM 標準規範 A514S 只涵蓋到 2.5 吋，所以在簡報標準表上才只寫到 65mm / 2.5 吋，但實際上 3 吋是可以生產供貨的。）\n\n---\n\n### 片段 09：`chunk_09.mp3` (45:00 - 50:00)\n**主題：A514S Modified 命名、厚度極限推升至 90mm（270mm 扁鋼胚與 3:1 壓延比）、S690QL/S890QL 簡報**\n\n* **[45:00 - 45:26] A514S Modified 規格命名與超厚詢問**\n  * **外籍代理商 & CSC 業務代表（女）**：延續前段討論 A514 規格命名與厚度。代理商指出，有些供應商直接稱之為 `514S`，而中鋼稱之為 `514S Modified`（業務補充：`Modified M, plus M`），代理商表示只要符合機械性質（meets the properties），稱為 Modified 完全沒問題（It's okay）。\n  * **外籍代理商**：詢問 `\"Can you go thicker than 3 inch?\"`（你們能做到比 3 吋更厚嗎？）\n  * **CSC 業務代表（女）**：半開玩笑回答 `\"I cannot tell you lah!\"`\n* **[45:26 - 46:35] 探討 A514 厚度上限需求**\n  * **外籍代理商**：只要鋼材符合性質（meets the properties），就算經過成分微調（modified），若客戶在化學成分（chemistry）上同意，你們合理能供應到多厚？（`\"I mean off the record... Because we discussed this many times for the last 8 years.\"`）\n  * **外籍代理商**：解釋市場需求差異——對於耐磨鋼板（wear resistant，如 `PA400`、`450`、`500`），客戶買的是薄板（thinner）；但對於 `514`（A514），客戶買的是厚板（thick），因為大量應用於需要高強度的結構件、拖車與卡車零件（high strength structure, trailer parts, truck parts）。\n* **[46:35 - 47:30] 90mm 厚度極限與 270mm 扁鋼胚（3:1 壓延比）**\n  * **CSC 技術代表（Delphic）**：`\"I think we can push it to 90 millimeter.\"`（我想我們可以推到 90mm。）解釋原因在於鋼廠扁鋼胚（slab）厚度為 **270mm**（the slab in our mill is 270）。\n  * **外籍代理商 & 客戶**：詢問是否有 **3:1 壓延比（3 to 1 reduction ratio）** 的要求？（`\"Is that a 3 to 1? For 514 also? Because 516... does it also apply to 514?\"`）\n  * **CSC 技術代表**：表示 3:1 是為了內部品質（internal quality），至於 A514 規範本身是否有強制規定 3:1，需再查核規範。\n* **[47:30 - 49:10] 雙軌討論（外方確認無強制 3:1 vs. 中鋼內部中文討論 75mm/80mm 實績）**\n  * **外籍客戶（Terra Nova）**：`\"There's not a 3 to 1 reduction ratio... No, I'm sure there's not.\"`\n  * **CSC 內部團隊討論（中文）**：\n    * 討論先前出貨紀錄：「出過兩塊⋯⋯三十六噸的樣子？」「十幾噸而已。」「是因為碰到出口限制（TRQ）嗎？」「對，有可能，因為後來⋯⋯但現在又可以了，現在就沒有在管額度了。」「但也不知道那時候用得狀況怎麼樣，他們應該沒有反應⋯⋯沒反應就是好事。」\n    * 討論技術限制（75mm ~ 90mm）：技術人員提到「這是 TQ 板（調質板）的上限了，就是你合金加這些⋯⋯但其實它冷卻（淬火冷卻能力）對於加上去做的效果⋯⋯但是我們說超過（某厚度）就一定會掉（硬度/強度無法淬透），這都沒提這樣子，都 OK。」\n    * 討論過去實際做過的厚度：「那口就越做越寬了⋯⋯之前最後做到多少？75（mm）？」「**80（mm）啊，有幫一個客人做。**」\n* **[49:10 - 50:00] 進入 S690QL 與 S890QL 簡報**\n  * **CSC 技術代表（Delphic）**：`\"Okay, let's move on. The final one is the S690QL and S890QL structural grades. This number means the yield strength level...\"`\n\n---\n\n### 片段 10：`chunk_10.mp3` (50:00 - 55:00)\n**主題：客戶主力採購厚度（1\" 與 1.25\"）、PA450 (6mm) 對標 Hardox 450、客戶擴廠兩倍大計畫與硬度鑽孔斷刀客訴**\n\n* **[50:00 - 51:43] 檢視生產實績數據與近期採購動態**\n  * **外籍客戶（Terra Nova）**：看著簡報數據唸出 `\"806... 730... Charpy over 30...\"`，表示：`\"We've bought some of that from you, but only in 1 inch (25mm).\"`\n  * **外籍客戶**：透露近期採購動態：`\"We just recently placed an order with Algoma and with a Chinese mill from 3/4\" up to 2\"... Algoma will only make inch and a half (1.5\"). 1 inch (25mm) is the biggest user, inch and a quarter (1.25\") is also...\"`\n  * **CSC 技術代表（Delphic）**：發現簡報圖表用了舊資料未更新：`\"Oh, I think I made a mistake here, because we can produce from 1 inch to 2 inch.\"`\n  * **外籍客戶**：說明 **2 inch** 是他們該項目採購上限，也買少量 **20mm (3/4\")**，但 **1\" (1 inch) 與 1-1/4\" (1.25 inch)** 是用量最大的兩個主力規格（the two mains we use）。因近期已重複下單（double purchased），庫存可撐到 **6 月或 7 月（good till June or July）**。\n* **[51:43 - 52:15] 514S 用量分佈**\n  * **外籍客戶**：看著簡報另一行：`\"514S is 6.35mm to 90mm... to 3 inch (76.2mm). Yeah, that's good. 85% of what we use is in that thickness range up to 3 inch.\"`（我們 85% 的用量都在 3 吋以下的這個厚度範圍內。）\n* **[52:15 - 54:12] 薄規格 PA450 (6mm) 開發與對標 Hardox 450**\n  * **CSC 技術代表（Delphic）**：介紹薄規格 **PA450 wear plate of thin gauge**：為填補國內市場在 `PA400` 與 `PA500` 之間的空缺，並將耐磨板往更薄推進（多年前只能做 ≥ 10mm，現已做到 **6mm**，更薄規格正克服平坦度問題）。展示盤對盤磨耗試驗（ball-on-disk wear loss test），顯示中鋼 `PA450` 磨耗損失低於競爭對手 **Hardox 450**。\n  * **外籍客戶**：詢問競爭對手是誰，得知是 **Hardox 450** 後驚訝確認 `\"Really? So yours is better than Hardox? From a wear perspective.\"` 隨後分析 Hardox 擁有**極低的碳當量（very low carbon equivalent, Ceq）**，成形性（formability）與銲接性（weldability）極佳；而中鋼 450 的 Ceq max 列為 **0.6**。\n* **[54:12 - 55:00] Terra Nova 購地擴廠計畫（2 倍大）與終端客戶對硬度的敏感度**\n  * **外籍客戶（Terra Nova）**：\n    * 目前廠內僅備 **400** 與 **500**，不備 450。\n    * **擴廠計畫**：正著手購地興建新廠（purchasing land to build a new plant），新倉庫與廠房面積將**至少是現在的兩倍大（at least twice as big a warehouse, twice as big a property）**，因為現有廠房過去 15–20 年來一直太小，沒空間同時存放三種級別（400/450/500）。\n    * **硬度與鑽孔斷刀索賠**：有些大客戶明確不要 450。他曾出貨一批硬度 **425 HBW** 的鋼板，結果客戶鑽孔時弄斷大量刀具（breaking a lot of tooling），遭客戶扣款索賠（got a backcharge for drilling）。\n    * **對中鋼 AR400F 的好評**：客戶最喜歡的硬度區間落在 **395 到 410、420 HBW** 左右。**從中鋼收到的貨表現很好（stuff we've received from you has been good），硬度都穩定落在 400 左右**；一旦硬度達到 **430 HBW**，客戶就會開始抱怨（whining）。\n\n---\n\n### 片段 11：`chunk_11.mp3` (55:00 - 60:00)\n**主題：北美耐磨板市場競品動態（Hardox 停產 400、Russel、JFE）、PA450 薄脫碳層配方與 6mm R15 (2.5t) 折彎測試**\n\n* **[55:00 - 56:15] 北美耐磨板市場競品動態**\n  * **外籍客戶（Terra Nova）**：\n    * 只做耐磨襯條（wear strips）的客戶喜歡更硬材質，他們就直接提供 **500** 級別。\n    * **競爭對手策略**：**Hardox** 已全面轉向 **450**（不再庫存 400，只做 **450、500、550、600**）；北美大盤商 **Russel Metals** 三個等級（400/450/500）都備貨（客戶認為簡直瘋了 madness）；**Samuel**（關閉前）及 **Structural Wear** 則從 400 改為只備 450。\n    * **日本 JFE**：同時提供 **400、450 與 500**，且 400 與 450 價差極小；但因長期問題（long-term issues，如交期/供應），上一次跟 JFE 下單已是**兩年前（60 噸）**的事。\n* **[56:15 - 60:00] PA450 薄脫碳層「神秘配方」與 6mm 折彎半徑 R15 (2.5t)**\n  * **CSC 技術代表（Delphic）**：解釋中鋼 `PA450` 耐磨性優於 Hardox 450 的原因在於**較薄的表面脫碳層（thin decarburized layer）**，源自合金設計中的「神秘配方（magic recipe to the alloy design）」。\n  * **折彎測試**：展示 **6mm** 的 `PA450` 可使用 **R15（內半徑 15mm，即 15/6 = **2.5t**）** 進行折彎成形；且客戶購買的 **AR400F 折彎性能又比 PA450 再好一點點**。\n  * **外籍客戶評價**：通常針對 400 級耐磨板，他們建議客戶採用 **4t**（6mm 板需 R24mm）；即便是結構鋼 `514`（A514），也建議至少 **2t 到 3t**。因此能做到 **2.5t（R15）** 非常優秀（`\"That's pretty good\"`）。\n  * **CSC 技術代表**：說明此薄板折彎測試主要鎖定**運輸車輛市場（transportation market）**，且高成形性與薄脫碳層是 `PA450` 從產品設計初期就設定的目標性質。\n\n---\n\n### 片段 12：`chunk_12.mp3` (01:00:00 - 01:05:00)\n**主題：脫碳層數據（0.1–0.2mm）、雷射切割平坦度（<2mm）、客戶加工應用回饋（拖車與挖斗配件）與美國關稅災難**\n\n* **[01:00:00 - 01:00:58] 脫碳層（Decarburized Layer）測試與雷射切割平坦度（Laser Cutting & Flatness）**\n  * **中鋼技術代表**：一般脫碳層厚度約為 **0.4 mm**，但在中鋼產品中僅約 **0.1 至 0.2 mm**（因表面形成氧化阻障層 oxidation barrier），重複測試 **3 次**確認。使用雷射切割後平坦度 **小於 2 mm（less than 2 mm）**，且無熱變形（no thermal distortions）。\n* **[01:00:58 - 01:02:18] 討論議題（Topics for Discussion）與厚度尺寸擴展**\n  * **中鋼技術代表**：提出三項討論議題：(1) 中鋼 **AR400F** 與 **A514 Grade S** 在客戶領域的具體應用；(2) 加工或使用問題；(3) 未來需要的鋼種或尺寸。並展示中鋼正將 AR400F 與 A514 往更薄與更厚擴展（包含已試做出 **3 inch A514**）。\n* **[01:02:18 - 01:03:45] Terra Nova 產品應用回饋：拖車製造（Trailers）、挖斗配件（Attachments）與尺寸需求**\n  * **Terra Nova 代表（Doug）**：\n    * 裁切零件供應最大的兩個產業是：**拖車製造商（trailer manufacturers）** 以及 **重機具配件（attachments，如挖斗 buckets、夾具 thumbs 等）**。\n    * 配件類兩者（AR400 與 A514）都會使用；而 **拖車（trailers）則全部使用 A514（just 514）**。\n    * **拖車用 A514 厚度**：主要集中在 **6 mm 到 12.7 mm（即 1/4\" 到 1/2\"）**，用於裝載貨櫃的底盤車架（chassis just for mounting containers），客戶一次做約 10 台拖車，全部用 **1/4\"、3/8\"、1/2\"**，外加少量 **5/16\"（8 mm）**。\n    * **3/16\" 規格與 SSAB 捲板（Strip Mill Coil）**：也用一點 **3/16\"**，甚至向 **SSAB** 買過 **Strenx**（strip mill 產品，**60 inch 寬**的鋼捲切板），因為從鋼捲切下來比中厚板廠調質板便宜。\n    * **礦業溜槽（Mining chutes）與 BC 省管線計畫**：也做礦業溜槽；隨著穿越 BC 省的管線工程（pipeline coming through BC）推進，本地對拖車與重機具設備需求將增加。\n* **[01:03:45 - 01:05:00] 美國關稅（US Tariffs）對客戶與跨境出貨的衝擊**\n  * **Terra Nova 代表**：\n    * 一家幾年前改向 Russel Metals 購買的舊客戶有 **85% 拖車銷往美國**，目前因關稅與繁瑣申報程序而陷入困境。\n    * **Terra Nova 停止銷美與 $9,000 美元關稅慘痛案例**：Terra Nova 過去 6 個月本身生意很好，但現在**完全不做任何銷往美國的出貨（We don't do any shipping into the US now）**。去年僅 **2 筆小訂單**銷美，兩筆都是災難（disaster），其中一筆被課了 **$9,000 美元額外關稅（extra tariff）**！因為試圖把關稅加進售價，結果美國海關又在含稅總價上再課一次關稅。現在一律不做完稅交貨（DDP），如銷往阿拉斯加（Alaska）的貨由客戶自己運到西雅圖（Seattle）轉駁船（barge）。\n    * 以前經過成型（formed）、鑽孔與皿頭孔加工（drilling and countersinking）後會被視為「完全加拿大製造（made in Canada completely）」，但現在美國海關會嚴審原產地鋼材成分（looking for content）。\n\n---\n\n### 片段 13：`chunk_13.mp3` (01:05:00 - 01:10:00)\n**主題：JFE T21 遭課 50% 關稅案例、加拿大管線計畫、中鋼品質完勝 Algoma、AR400F 各厚度需求分析**\n\n* **[01:05:00 - 01:06:10] JFE T21 產品被課徵 50% 關稅案例與美國設廠討論**\n  * **Terra Nova 代表**：那批銷美貨物使用的是 **JFE** 專屬產品 **T21**，結果被直接課了 **50% 關稅**。那批鋼材只有 **3,300 磅（3,300 lbs of steel）**，卻被課了 **$9,800 美元（$9,800 USD）** 的關稅！因為發票金額包含了運費（freight）、機械加工（machining）、鑽孔（drilling），美國海關在總金額上再課 50% 關稅，等於關稅又被墊高了 25%。\n  * 提到有個客戶跨過邊境到美國花了天價買 **11 英畝（11 acres）** 的地跟大廠房設廠，結果發現困難重重；Terra Nova 表示在加拿大就有足夠客戶，不需要賣到美國。\n* **[01:06:10 - 01:07:22] 加拿大油氣管線計畫（Trans Mountain / Pacific Rim Pipeline）對重機具鋼材的帶動**\n  * **貿易商代表 & Terra Nova 代表**：討論加拿大管線計畫（聯邦政府與 Alberta 省推動的第二條管線/擴建案，預計約 **2028 年** 投入服務 in-service，屬 fast-track 快速通道計畫）。\n  * **Terra Nova 代表**：任何與地面開挖接觸（ground-engaging）的設備都是大好機會——包括 **拖車（trailers）、重機具設備（equipment）、土方工程（earthworks）、鋪路鋼板（road plates）** 等。\n* **[01:07:22 - 01:09:50] 產品品質評價（CSC vs. Algoma）與關鍵厚度需求（3/16\", 1/4\"~2\", 1-1/4\", 3\"）**\n  * **Terra Nova 代表**：\n    * **平坦度與品質極佳**：`\"Not with your product... Your product has been nice and flat, that's been good. It's better quality than we get from Algoma for sure.\"`（你們的產品完全沒問題，非常平坦漂亮，品質絕對比我們從 Algoma 買到的好太多了。）\n    * **各厚度規格需求分析**：\n      1. **3/16\"**：很希望能買到 **3/16\"**，目前這個厚度**只有中國（China）**在供應。\n      2. **A514 擴展至 3\"**：把 **A514** 厚度拉高到 **3 inch** 是件好事。\n      3. **AR400F 的 1/4\" 至 2\"（特別是 2\" 與 3\"）**：**從 1/4 inch 到 2 inch 佔了 AR400 市場的 90%（90% of the 400 market）**。其中 **2 inch 用量非常大（2-inch we use a lot, one of our biggest usages）**；此外若 **AR400 也能拉高到 3 inch** 會很棒。\n      4. **1-1/4 inch (31.75 mm) 過去缺貨之謎**：幾年前不知道為什麼，**1-1/4 inch (31.75 mm)** 在 AR400 與 A514 都常缺貨。中鋼代表們以中文低聲確認廠內生產 31.75 mm 完全沒問題；客戶表示若現在沒問題就好。\n* **[01:09:50 - 01:10:00] 噴砂與底漆處理（Blasted and Primed）提問**\n  * **貿易商代表**：詢問購買鋼板時是否通常要求噴砂與塗底漆（blasted and primed）？\n\n---\n\n### 片段 14：`chunk_14.mp3` (01:10:00 - 01:15:00)\n**主題：噴砂底漆需求、Algoma $1.30 高價、鏽皮與表面夾層瑕疵、起重機（SSAB）與橋樑結構市場（350AT / Rapid-Span）**\n\n* **[01:10:00 - 01:11:25] 噴砂與底漆（Blasted & Primed）需求與供應來源比較**\n  * **Terra Nova 代表**：通常會買噴砂加底漆，但**並不是絕對必要的（not vital）**。有一家最大客戶要求買噴砂底漆鋼板，主要是從**中國（China）**購買 **30 呎長（30-foot plates）** 的噴砂底漆鋼板。\n  * **貿易商代表**：中鋼廠內沒有內部噴砂設備（no possibility for internal shot blasting），委外處理非常昂貴。\n  * **Terra Nova 代表**：沒關係（It's not a big deal），可以有一部分庫存不帶底漆（甚至有少數客戶要求不要底漆），目前在 **Richmond（列治文廠區）** 庫存多數有噴砂底漆。順帶一提，**Algoma** 的 **514（100Q）** 連噴砂底漆都不做，且價格高達 **$1.30/lb**（`\"they're up to 1.30\"`），現在幾乎沒跟他們買了（buying next to nothing）。\n* **[01:11:25 - 01:12:48] A516 / 100Q 鏽皮（Scale）與表面夾層瑕疵（Surface Laminations）經驗分享**\n  * **貿易商代表 & Terra Nova 代表**：A516 有正常化處理氧化皮（normalizing scale），若放室外剝落不均勻會有表面高低紋理。過去曾幫客戶將鋼板滾圓（rolled it），結果鏽皮剝落後發現軋入氧化皮（rolled-in scale）或底面表面夾層（surface laminations），導致整批被退貨賠了幾千塊（a few grand）。\n* **[01:12:48 - 01:14:55] 吊車起重機市場（Crane Work）與橋樑結構市場（Structural / Bridges - 350AT & Rapid-Span）**\n  * **Terra Nova 代表（關於 Crane Work 起重機市場）**：不做任何起重機工程。該市場基本上被 **SSAB（Weldox / Strenx / Hardox）** 壟斷（owns that market），因為他們有更薄的 **3 mm 與 4 mm** 規格，且平坦度與公差極佳，適合做伸縮吊臂（telescopic booms）。\n  * **Terra Nova 代表（關於橋樑結構市場）**：加拿大沒有工程師在建築或橋樑結構設計中使用 A514（日本會用來造橋，但加拿大沒有）。\n  * **關於 350AT 耐候橋樑鋼與 Rapid-Span 案例**：\n    * **Terra Nova 代表**：不做 **350AT**，那主要是 **Varsteel** 在做；當地約三家廠商在用，最大的是 **Rapid-Span**（直接向鋼廠採購）。\n    * **貿易商代表**：補充過去曾透過 **Samuel（Samuel, Son & Co.，當時 Phil 在職）** 賣過 **300 到 400 噸** 給 **Rapid-Span** 做行人天橋（pedestrian bridges），結果貨已運到、信用狀（LC）已開，他們卻因專案範圍變更突然拒收，非常難應付。\n\n---\n\n### 片段 15：`chunk_15.mp3` (01:15:00 - 01:20:00)\n**主題：Terra Nova 全年 20,000 噸採購結構明細、A516-70 轉單韓國原因、台/德 AD「抗酸用途（Sour Service）」豁免與海關稽核風險**\n\n* **[01:15:00 - 01:16:08] 閒聊：美加西北地區橋樑工程商與 A588 供應**\n  * **Doug (Terra Nova)**：提到 **Warsteel** 接手了溫哥華島（on the Island）原本由 **Surespan** 做的業務；另有 **Rapid-Span**、Prince George 的幾家廠商，以及 **Majestic Bridge**。Warsteel 也與 **Seaport** 合作，Seaport 在西雅圖（Seattle）備有 **A588** 庫存。\n* **[01:16:08 - 01:17:25] Terra Nova 年度各鋼種採購量（全年 20,000 噸）與空間限制**\n  * **CSC 代表**：詢問在 **AR400F** 與 **A514**（及整體）每個月大約有多少消耗量？\n  * **Doug**：澄清為**每年（Per year）**數據，**全年總採購量為 20,000 噸（Total 20,000 per year）**：\n    * **44W**：約 **8,000 到 9,000 噸 / 年**\n    * **A514**：約 **4,000 噸 / 年**\n    * **AR400**：約 **1,200 到 1,400 噸 / 年**\n  * **Doug**：場地空間有限，但新廠房/倉庫擴建計畫距離完工可能還要 **4 年（four years away from having a building）**。\n* **[01:17:25 - 01:18:18] 進口比例（95%）與過往向中鋼採購 1,000 噸/月的歷史**\n  * **Doug**：目前 **95% 是進口（95% import）**。幾年前曾向中鋼承諾每個月採購 **1,000 噸（1,000 tons a month）**，當時採購品項包含：**44W / A36、A572-50 Cat 4、A514、AR400、A516-70**。但後來加拿大政府設定的 **A516-70 Normal values（正常價值）** 發生劇烈變化，之後就轉向**韓國（Korea）**購買 A516-70。\n* **[01:18:18 - 01:20:00] A516-70 反傾銷豁免條件比較（韓國 vs. 台灣/德國）與海關稽核風險**\n  * **貿易商**：解釋韓國沒有 Normal value——**現代（Hyundai）**當時無反傾銷稅（no AD）；而 **東國（Dongkuk）** 的 **A516** 針對「正常化處理且真空脫氣（Normalized and Vacuum Degassed）」有**豁免條款（Exclusion）**。\n  * **貿易商**：但在**台灣與德國（Taiwan and German AD）**的反傾銷案中，這項豁免（Exclusion）除 Normalized、Vacuum Degassed 及限制磷與硫（Phosphorus & Sulfur）化學成分外，還必須聲明**「專門用於抗酸環境（used exclusively in sour service）」**（雖不強制做 HIC 測試，但須聲明用途）。\n  * **CSC 代表**：補充中鋼 A516-70 的 Normal value 非常高，大約在 **1,300** 左右。\n  * **貿易商 & Doug**：若以 Sour Service 名義下單引進再當作一般市場規格（regular market）賣掉（如部分廠商從德國 **Dillinger** 引進的作法），屬於**規避反傾銷稅（Circumvention）**，若遇到**海關稽核（Customs audit）**順著書面紀錄追查，將面臨被重罰（getting whacked on it）的風險。\n\n---\n\n### 片段 16：`chunk_16.mp3` (01:20:00 - 01:25:00)\n**主題：韓國東國製鋼 vs. 中鋼 A516-70 價格與海運費完整拆解對比、台加無 FTA 與非 FTA 配額連砍兩次剩 20%**\n\n* **[01:20:00 - 01:21:00] Sour Service 海關稽核罰則與客戶詢單量**\n  * **貿易商代表（英國口音）**：若遭加拿大海關（CBSA）稽核認定不符 Sour Service，罰款/補稅金額為 **Normal Value（正常價值）與 Export Price（出口價格）之間的差額**。\n  * **外方代表（德國口音）**：只要確保僅賣給在 **PO（採購單）** 上明確註明 `\"needs to fulfill sour service requirements\"` 的客戶即可。\n  * **Doug (Terra Nova)**：我們一年大概只收到 **3 次（three inquiries a year）** 這類詢問。\n* **[01:21:00 - 01:22:36] 韓國（東國製鋼 Dongkuk）與中鋼（CSC）A516-70 / 44W 價格與加價（Extras）、海運費完整拆解對比**\n  * **貿易商代表（英國口音）& 中鋼代表 (CSC)**：\n    * **韓國東國製鋼（Dongkuk）**：近期剛買的價格為 **$1,050 USD per metric ton, FOB Korea**。加上韓國至加拿大海運費 **$110 - $120 USD/MT**。\n    * **中鋼（CSC）價格拆解**：\n      * **44W 鋼板基價（Base price）**：**$985 USD/MT FOB Taiwan**（貿易商原以為是 $910，中鋼代表確認為 **$985**）。\n      * **A516 Gr.70 三項額外加價（Three extras for 516）**：\n        1. **Grade extra（鋼種加價）**：**$60**\n        2. **Normalizing extra（正火處理加價）**：**$30**\n        3. **Charpy testing extra（夏比衝擊試驗加價，針對 -45°C / -45°F）**：**$28**\n      * **加價合計**：$60 + $30 + $28 = **$118**（約 **$120 USD/MT**）。\n      * **中鋼 A516 FOB 總價**：$985 + $118 = **$1,103 USD/MT FOB**（已超過 $1,100 FOB，比韓國 $1,050 FOB 貴上逾 $50/MT）。\n      * **台灣鋼板海運費（Ocean freight）**：**$120 - $125 USD/MT**（比韓國貴約 $10/MT；中鋼內部女性成員低聲以中文補充：「鋼板的比較貴」）。\n* **[01:22:36 - 01:23:55] A516 採購佔比與歷史採購回顧（2020 COVID 低谷 vs. 2022 高峰）**\n  * **Doug (Terra Nova)**：A516 只佔我們庫存約 **10%**，每年約 **2,000 噸（2,000 tons a year）**。幾年前買齊所有產品時很容易達到每月 **1,000 噸**；**2020 年 6 月（COVID 期間）** 是十年來最差的一個月，但 **2022 年** 則是表現極佳的一年（tremendous year）。\n* **[01:23:55 - 01:25:00] 台加無 FTA 之政治因素、加拿大 TRQ 兩度砍減至 20% 與美加談判連動**\n  * **Doug & 貿易商代表**：因為中國政治因素，加拿大與台灣只有**關務協定（Customs Agreement）**，沒有**自由貿易協定（Free Trade Agreement, FTA）**；而加拿大與**馬來西亞（Malaysia）**、**韓國（Korea）**則簽有 FTA。\n  * **貿易商代表**：自從 **2025 年中（middle of 2025）** 以 **2024 年進口量（2024 volumes）** 為基準實施 TRQ 後，**非 FTA 國家的關稅配額（non-free trade TRQs）已被連砍兩次（cut twice），目前僅剩原始基準量的 20%（now 20% of the original volume）**。這 **100% 與加拿大對美國政府的談判掛鉤（100% linked to the discussions with the US government）**。\n\n---\n\n### 片段 17：`chunk_17a.mp3` & `chunk_17b.mp3` (01:25:00 - 01:30:00)\n**主題：預測加拿大取消 TRQ 全面課 50% 關稅、中/美厚板價差與品質對比、Nucor 40 億美元新廠與 12\" A514、美國缺料兩大驅動力（資料中心與邊境牆 1 億噸鋼材）**\n\n* **[01:25:00 - 01:25:55] 預測美國期中選舉後加拿大取消 TRQ 改課 50% 關稅**\n  * **貿易商代表 A（英國口音）**：在美國期中選舉（midterm elections in the US）之前，加拿大政府不會採取任何動作。但他個人認為（personal opinion），最終很可能會看到加拿大政府**完全取消非自由貿易國家的關稅配額（cancel the non-free trade TRQ completely），直接全面適用 50% 關稅（just apply 50% tariff）**；甚至**也有可能連自由貿易協定國家的配額（free trade TRQs）也一併取消**，或者就算不取消，也**肯定會進一步大幅削減（further reduced）**。\n* **[01:25:55 - 01:27:30] 中國 vs. 美國賓州老廠厚板價格與品質對比、加拿大加工商輸美套利與美國保護主義**\n  * **Doug (Terra Nova)**：\n    * 加拿大這些關稅的目的，是為了向美國交代、保護加拿大中部（Central Canada，如安大略省）與美國連動的製造業工作機會。\n    * **中、美厚板價格與品質強烈對比**：過去從**中國（China）**進口的厚板（heavy plate），運抵溫哥華或多倫多（Toronto）的到岸價僅約 **每磅 60 多美分加幣（mid-60s cents a pound Canadian）**；而同樣的厚板若從美國賓州 **Coatesville, Pennsylvania**（120 年歷史老廠）採購，價格高達 **$1.20/lb**（幾乎是兩倍價格），而且**中國鋼板的品質遠比美國那座 120 年老廠好太多了（Chinese plate is far superior, that old mill is 120 years old and expensive）**。\n    * **加拿大大型同業輸美套利**：因為美國過度保護本土鋼鐵業，美國鋼廠賺大錢卻不需與任何人競爭，讓加拿大業者過去享有極大優勢。例如安大略省的 **Carver Steel（規模約為 Terra Nova 的 5~6 倍大，年採購量達 100,000 噸，多數為厚板 heavy plate）**，買進低價進口厚板，裁切零件（cutting parts）後直接銷往美國中西部（Midwest），享有巨大優勢。Doug 坦言：`\"From that perspective, Trump was right, which I don't say very often.\"`（從這個角度來看，川普說的其實沒錯——我們確實享有巨大優勢，但那也是因為美國在 2018 年 232 條款 Section 232 時把自己的市場價格哄抬得太高了。）\n  * **貿易商代表 B（德國口音）& Doug**：\n    * **貿易商 B**：美國的保護主義從 **2001 年的 201 條款（Section 201 in 2001）** 就開始了，長達數十年的保護主義正是美國鋼鐵業如此老舊落後（so outdated）的原因，因為沒人覺得需要投資與現代化。\n    * **Doug**：唯一的例外是 **Nucor（紐柯鋼鐵）**，因為賺了太多錢，花了 **40 億美元（$4 billion）** 蓋了一座新鋼板廠（位於肯塔基州 Kentucky，已運轉約 3~4 年）。\n* **[01:27:30 - 01:29:05] Nucor 肯塔基州新廠現況、德州 12\" 厚 A514 奇聞與 SSAB 配額控管（Allocation）**\n  * **Doug & 貿易商代表**：Nucor 肯塔基州新廠雖已運轉 3~4 年，但仍未順利生產出原先宣稱的規格（號稱可做 **14 inch 厚** 的鋼板）。\n  * **Doug**：分享今天早上剛收到來自美國德州 **American Heavy Plate** 的庫存清單，上面竟然有一塊 **12 吋厚（12-inch）的 A514（514）** 鋼板（尺寸約 **60\" x 96\"**，重達 **21,000 磅 / 21,000-pound plate**），另有 A36、4140 等怪異規格，並標註「在美國熔煉與製造（made and melted in the US）」。Doug 覺得很新奇，因為在此之前他從未見過超過 **9 吋厚** 的 A514（Terra Nova 自己庫存最厚備有 **8 吋 / 8-inch**），他想不出美國除了 Nucor 新廠外還有誰能做（貿易商開玩笑說搞不好那只是一塊扁鋼胚 slab 隨便軋了一下，或是試軋失敗留在德州地板上的試驗品）。\n  * **Doug**：一兩週前向美國 **SSAB** 發了詢價單，結果對方直接回覆「目前完全沒有任何產能可供應（nothing's available at this time）」，美國所有鋼廠目前都處於**配額控管狀態（on allocation with the US mills）**。\n  * *(台下中鋼女性代表們低聲用中文討論剛剛韓國與中鋼 A516 的價差：「1,050… 我們現在因為他們就漲了… 對啊，那我們原本 985 加 120 就 1,105 了… 鋼板海運費比較貴…」)*\n* **[01:29:05 - 01:30:00] 美國鋼鐵市場極度緊俏的兩大驅動力：資料中心（Data Centers）與美墨邊境牆（Border Wall, 1 億噸鋼材）**\n  * **貿易商代表 B（德國口音）**：分享過去兩週剛參加兩場美國大型會議——上週四、五的 **NASPD（National Association of Steel Pipe Distributors，全美鋼管經銷商協會）**，以及前一週的 **Argus 預測高峰會（Forecast Summit）**。所有會議的共識完全一致：**美國鋼鐵市場極度緊俏，甚至長期都供不應求**。背後有**兩大主要驅動力（two major drivers）**：\n    1. **第一是資料中心（Number one: Data Centers）**\n    2. **第二是「那座愚蠢的美墨邊境牆（Number two: that stupid border wall）」**——據稱總共需要高達 **1 億噸鋼材（100 million tons of steel）**！\n  * **貿易商代表 A**：驚訝問 `\"Are they still talking about that?\"`\n  * **貿易商代表 B**：`\"They ordered it! Yeah, it's for years, hundred million tons, that's the entire steel consumption of the US for an entire year!\"`（他們已經下單了！那是好幾年的量，但 1 億噸相當於全美國整整一年的鋼鐵總消耗量！）\n  * **Doug**：幽默調侃：`\"But it's being paid for by the Mexicans!\"`（不過反正墨西哥會付錢嘛！）引發全場哄堂大笑。\n\n---\n\n### 片段 18：`chunk_18.mp3` (01:30:00 - 01:35:00)\n**主題：紐約 Skanska 營造案與打樁管短缺、進口來源國盤點、澳洲 BlueScope 200 噸 44W 與 5,400 噸保稅清關事件、各國 Normal Value 盤點**\n\n* **[01:30:00 - 01:32:05] 美國基礎建設與 Skanska 鋼材短缺案例（貿易商 B & Doug）**\n  * **貿易商 B（德國口音）**：提到紐約大型營造公司 **Skanska**（全美最大的打樁與營造公司之一，負責重建半個紐約 `\"rebuilding half of New York\"`；Doug 開玩笑問是不是因為捐款給川普宴會廳 `\"making donations to the ballroom?\"`）。\n  * **貿易商 B**：Skanska 營收成長了 **300%（300% revenue growth）**，且在手訂單（backlog）已經排滿未來 **3 年**（公司歷史上從未見過）。他們聲稱現在根本找不到**打樁管（piling pipe）**，甚至連 **6x4 英吋空心結構型鋼（6x4 inch structurals / hollow structurals）** 都買不到。\n* **[01:32:05 - 01:32:45] 進口來源國家盤點（CSC 代表、Doug、貿易商 A）**\n  * **CSC 女代表**提醒時間：`\"We need to get going in like 10 minutes.\"`\n  * **CSC 男代表**詢問 Doug 目前除了中國與韓國外，還從哪些國家進口鋼板？\n  * **Doug**：**中國（China）、韓國（Korea）、台灣（Taiwan）、馬來西亞（Malaysia）**，以及一點點**澳洲（Australia）**（貿易商 **Worth** 透過 **BlueScope** 引進，BlueScope 偶爾會有現貨噸數釋出）。\n* **[01:32:45 - 01:33:50] 200 噸 44W 交易與 5,000 噸（5,400 噸）配額清關烏龍（Doug & 貿易商 A）**\n  * **Doug**：上週才剛買了大約 **200 噸（200 tons）** 來自超額庫存清單（excess list）的 **44W** 鋼板。原本被告知是一批 1,000 噸的船運，結果發現是 5,000 噸的貨。\n  * **貿易商 A**：解釋那是由 **3 艘船（three shipments，其中一艘為 KSL）** 組成的，配額監控網站上跳出的 **5,400 噸（5,400 tons）** 其實是 Worth 先前放在**保稅倉（sitting in bond）**裡的 3 批不同船運**跨兩個配額週期（cleared over two quota periods）**一起清關的結果。\n* **[01:33:50 - 01:35:00] 澳洲 BlueScope 狀況、反傾銷（AD）與各國正常價值（Normal Value）**\n  * **貿易商 A**：以前在 **BlueScope（前身為 BHP）** 工作多年，澳洲國內市場目前很忙，且澳洲對**韓國**課徵了較高的反傾銷稅（中鋼在澳洲稅率則很低）。\n  * **CSC 男代表 & 貿易商 A**（盤點加拿大市場的 Normal Value 與 AD）：\n    * 目前在加拿大有 **Normal Value（正常價值）** 的只有 **CSC（中鋼）** 和 **德國（Germany，即 Dillinger）**。\n    * **韓國（Korea）** 沒有：**Dongkuk（東國製鋼）** 沒有 Normal Value；**Hyundai（現代製鐵）** 現已被課反傾銷稅（now have AD）；**POSCO（浦項鋼鐵）** 也沒有 Normal Value。\n\n---\n\n### 片段 19：`chunk_19.mp3` (01:35:00 - 01:40:00)\n**主題：馬來西亞濟鋼（Jigang）、中國 50% 關稅與 AD 界線、盛讚中鋼品質與單頁式 MTC、婉拒本次 500 噸報價（$1.14/lb）與在途訂單 $2,700 萬部位管控**\n\n* **[01:35:00 - 01:36:25] 馬來西亞「濟鋼（Jigang）」、中國 50% 關稅與反傾銷產品界線**\n  * **貿易商 A & Doug**：馬來西亞那家鋼廠叫 **Jigang（濟鋼馬來西亞廠）**。\n  * **Doug & 貿易商 A**：說明中國鋼板進口規定：\n    * **關稅（Tariff）**：兩年半至三年前加拿大先對中國課 **25% 關稅**，後加碼至 **50%（topped it up to 50%）**。\n    * **反傾銷（AD）**：中國的 AD 涵蓋 **1/4\" 到 4\"（含 4\"）** 的碳鋼板（**44W、A36、A572**），這 30 年來完全不能從中國進口。\n    * **從中國進口的品項（全為合金調質板與超厚板）**：Terra Nova 付 50% 關稅從中國進口 **A514（514）、AR400、AR500**，以及 **厚度超過 3 英吋（或 3.5 英吋）的 A516-70**。\n    * **A516-70（≤ 4\"）來源**：從**日本（Japan）**進口；以前曾向**中鋼（CSC）**買 3\" 以下的 516，但因加拿大政府設定的 Normal Value 導致價格不具競爭力而中斷。\n* **[01:36:25 - 01:37:45] Doug 對中鋼品質與單頁式材質證明書（MTC）的高度評價、對抗關稅的立場**\n  * **Doug**：`\"So it was not by our choice, because I like the product, the product is excellent. And I like your test reports, all on one page...\"`（不買中鋼絕非我們自己願意的，我很喜歡中鋼的產品，品質非常好；而且我非常喜歡**中鋼的材質證明書/測試報告，全部濃縮在同一頁**，非常清楚，不像中國某鋼廠一張質保書有 4 頁。）\n  * **Doug**：幾週前韓國廠商來訪暗示「付關稅已是新常態（new norm）」，但他告訴對方：`\"We're going to avoid it as long as we can and fight as hard as we can to get stuff without the tariff. Because if we have the tariff and our competitors don't, we're dead.\"`（我們會盡一切努力避開關稅，因為如果我們付了關稅而競爭對手沒付，我們就死定了。）\n* **[01:37:45 - 01:38:35] 採購模式：100% 透過貿易商進口**\n  * **Doug**：所有海外（offshore）採購 **100% 透過貿易商（trading companies）**（以前約 20% 美國、15% 加拿大國內採購才自己處理）。並提到中鋼下一家要拜訪的客戶 **Jim** 因會說韓文（speaks Korean）才自己直接進口，但為了每百磅省 **30 美分（save 30 cents a hundred [cwt]）** 承擔龐大進口風險並不值得。\n* **[01:38:35 - 01:40:00] 現有 500 噸中鋼報價討論（$1.14/lb）、在途訂單暴增至 $2,700 萬與暫緩採購決定**\n  * **貿易商 A**：提到手上還可提供給 Terra Nova 的 **500 噸（500 tons）** 額度，先前報的淨價（net number）約為 **$1.14/lb（$114/cwt）**，裡面已包含約 **32 cents（$0.32/lb）的關稅分攤**，且仍有機會擠進免稅配額（sneak it in）。\n  * **Doug**：坦言目前手上的在途訂單原本以為約 **2,000 萬（$20 million）**，但意識到加上潛在關稅後可能會變成 **2,700 萬（$27 million）**，超過目前願意承擔的風險部位，現在必須採取防禦姿態暫停買貨（`\"circle the wagons and not buy right now\"`），因此**這次 500 噸只能先放棄（`\"I know it's only 500 tons, but I think I gotta pass this time\"`）**。\n\n---\n\n### 片段 20：`chunk_20.mp3` (01:40:00 - 01:44:49)\n**主題：Terra Nova 股東買斷（Doug 80% / Chris 20%）、期盼全面 50% 關稅後重建中鋼合作、Soft TRQ 弊病與道別**\n\n* **[01:40:00 - 01:41:00] Terra Nova 公司股權結構變動與對中鋼規格的肯定**\n  * **Doug**：解釋對資金部位謹慎的原因——公司最近剛完成股東買斷，現在由他和銷售經理 **Chris** 共同持有：**Chris 持股 20%，Doug 持股 80%**（剛買斷另外兩位股東，包含原本持股 **40%** 的前董事長 Chairman），因此不想讓財務過度擴張（too heavily extended）。\n  * **Doug**：非常希望能回到以前與中鋼的合作狀態，因為中鋼的鋼種與厚度範圍非常理想——**一般鋼板厚度可達 5 英吋（up to 5 inch），100 ksi 等級調質鋼（A514 / AR400）可達 3 英吋（up to 3 inch in the 100）**，極具吸引力。\n* **[01:41:00 - 01:42:35] 加拿大可能取消所有 TRQ（全面改課 50% 關稅）與美加談判時程預測**\n  * **貿易商 A**：重申加拿大政府接下來若要與美國達成協議（確保加拿大製造商不會買廉價進口鋼材加工後銷美），很可能會在**美國 11 月期中選舉後（預計明年 1 月，現行配額階段至 12 月底結束）宣布取消所有 TRQ 配額，全面改課 50% 關稅（`\"cancel all TRQs, 50%\"`）**。\n  * **貿易商 A & Doug**：如果真的變成**對所有國家、所有產品一律課徵 50% 關稅（`\"50% on everybody and everything\"`）**，立足點反而公平了，就能**重新建立（re-establish）與中鋼過去良好的採購合作**！\n* **[01:42:35 - 01:44:00] 軟性配額（Soft TRQ）對商業活動的扼殺與美國通膨後果**\n  * **貿易商 B**：指出目前的**軟性配額（Soft TRQ，超額可付 50% 關稅進口）** 反而阻礙了生意進行（preventing business from happening），因為買家深怕自己沒搶到配額要付 50% 關稅、而對手卻搶到免稅配額，如同 **2022–2024 年** 歐洲輸美 Soft TRQ（超額付 25% 關稅）時扼殺交易的情況。\n  * **Doug & 貿易商 B**：批評美國實施 50% 關稅是為自己製造**通貨膨脹（inflation）**，導致美國製造失去國際競爭力、一般民眾受苦。\n* **[01:44:00 - 01:44:49] 會議結束、道別與離場**\n  * 雙方互道感謝，**Doug** 幽默道別：`\"I'll come out and play table tennis in Taipei one day.\"`（等哪天我有空去台北打桌球時再去找你們！）眾人起身離開會議室，錄音於 01:44:49 結束。\n", "docx_b64": "UEsDBBQAAAAIAPhQVV0xpqS4/gAAADoCAAATAAAAW0NvbnRlb 應鏈，能聽說韓語但偏好英語溝通，常於媒體與加拿大國際貿易法庭 CITT 公開批判加東保護主義鋼廠）\n  - **Mark**（採購與營運主管，評估塗油鍍鋅車庫門應用，代表出席會後午餐）\n  - **Amy**（採購與業務代表，代表出席會後午餐）\n  - **Philip**（船運與物流主管，確認台灣海運費率）\n  - *提及未在場人員*：**Danny**（Cascadia 美國廠採購負責人，急需鍍鋅 GI）\n- **陪同貿易商**：\n  - **Jock 及資深貿易商夥伴（含 Cellmark 代表）**（熟悉美加反傾銷稅率 AD Duty、塗油鍍鋅豁免條款、外資鋼廠股權結構與北美新電爐廠動態）\n- **我方代表（CSC / CSGT）**：\n  - **Jim**（主談代表，簡報中鋼集團概況與高雄總部大樓、探討熱軋/冷軋與台灣下游盛餘/裕鐵/燁輝供料生態系）\n  - **Vincent**（冷軋 Cold Rolled 業務負責人，負責 Cascadia 冷軋主力業務）\n  - **Mr. Parker**（駐墨西哥城辦事處技術代表，於會議當天早晨專程自墨西哥飛抵溫哥華支援技術交流）\n  - **中鋼業務/企劃女性同仁**（詢問庫存週期、下游客戶結構、AI 資料中心預測與 GI 規格稅率；會中另提及中鋼鍍鋅 GI 團隊負責人 **Roland**）\n\n---\n\n## 二、客戶營運規模與關鍵量化數據總表 (Customer Profile & Key Metrics)\n\n| 類別 | 項目 | 數據 / 規格 | 備註說明 |\n| :--- | :--- | :--- | :--- |\n| **Cascadia 規模** | 美加總鋼材月用量 | **40,000 公噸 / 月**（約 **48 萬噸 / 年**） | 加西最大鋼捲加工中心（Coil Processor）與最大進口商 |\n| **Cascadia 規模** | 加拿大月用量 | **30,000 公噸 / 月** | 溫哥華廠約 10,000 噸/月、Brandon 廠近 10,000 噸/月、其餘廠區約 10,000 噸/月 |\n| **Cascadia 規模** | 美國月用量 | **10,000 公噸 / 月** | 由 Danny 負責採購；預計明年美國本土 GI 供貨嚴重不足 |\n| **Cascadia 規模** | 常態庫存水位 | **4 ~ 5 個月** | Cascadia 的「秘密武器（Secret Weapon）」，遠高於上市同業（如 Russel Metals） |\n| **急迫採購需求** | **10 Gauge 厚板 GI / GA** | **厚度 0.13\"（約 3.3~3.4 mm），寬度 48\" 或 60\"** | **不論價格多少都買（\"Doesn't matter what the price is, we'll just buy it\"）**；加國僅 ArcelorMittal 生產且嚴格配額 |\n| **市場重大缺口** | **Stelco 停產 GI & CR 缺口** | **30,000 ~ 35,000 公噸 / 月** | Stelco 停止在加拿大生產鍍鋅與冷軋，原本全供加國內銷，現須全靠進口填補 |\n| **中鋼優勢規格** | 冷軋（CR）特殊薄寬尺寸 | **1660（16 ga x 60\"）、1272（12 ga x 72\"）** | 最看重中鋼「全尺寸供應（Make every size）」；POSCO 忙時只肯做 10 ga x 48\" |\n| **採購量體** | 韓國 KG Dongbu 採購量 | **70,000 公噸 / 年**（塗鍍/烤漆鋼品） | Cascadia 為 KG Dongbu（原東部製鋼）**全球最大客戶** |\n| **採購量體** | 加拿大本土熱軋（HR）配額 | **Stelco 3,000 噸/月**、**Algoma 500 噸/月** | 遭加東本土鋼廠嚴格配額限制（Allocation）與價格報復 |\n| **海運費用** | 台灣出貨運費（G2 Ocean） | **$80 美元 / 噸**（Effective rate，含燃油附加費） | 台灣航線受 **Saga** 強勢壟斷控制 |\n| **海運費用** | 韓國出貨運費優勢（Swire） | **比台灣便宜 $15 ~ $18 美元 / 噸**（長期目標 $20/噸優勢） | Swire 運紙漿赴日韓，回程每兩週一班定期船，Cascadia 保證包下 1~2 個船艙換取極低運價 |\n| **內陸運費** | 加東（Hamilton）至加西陸運 | **> $100 美元 / 噸** | 加東鋼廠陸運至加西成本極高，太平洋海運具天然優勢 |\n| **關稅與反傾銷** | 加拿大對台灣 GI 反傾銷稅 | **中鋼（All Others）33%~34%**；**裕鐵（YP）3.2%**；**燁輝（PT, GL）10%** | **塗油鍍鋅（Oiled GI/GL）** 則豁免排除於加拿大 AD 之外 |\n| **關稅與反傾銷** | 美國近期塗鍍反傾銷初裁 | **Dongbu 20%、Dongkuk 28%、盛餘（SYSCO）20%** | 公佈後一週內美國市場價格直接上漲 20% 轉嫁給消費者 |\n| **關稅與反傾銷** | Cascadia 今年額外關稅支出 | **> $2,500 萬美元（$25M）** | 僅計入今年「原本非預期」的額外關稅支出 |\n| **下游終端需求** | **Johnson Controls**（資料中心冷卻機房） | **> 3,000 公噸 / 月**（由 Cascadia 供應鋼板與鋁板） | 於 Edmonton 設 13 座廠、2,000 名員工；與 Varsteel 共分訂單 |\n| **下游終端需求** | **IEM**（資料中心巨型配電開關箱） | **中鋼冷軋（CR）主力終端去向** | 為 Amazon 製造「大如房屋（as big as a house）」的巨型 Switchboxes |\n\n---\n\n## 三、核心產品採購現況與對中鋼（CSC）之高度評價\n\n### 1. 冷軋（Cold Rolled, CR）：全尺寸供應能力完勝 POSCO\n- **加拿大最大冷軋客戶**：Cascadia 為中鋼在加拿大最大的冷軋客戶，採取策略性集中採購以成為供應商之核心夥伴。\n- **核心價值——「全尺寸供應（Make Every Size）」**：\n  - 身為裁剪服務中心（Service Center），Cascadia 必須備齊全尺寸，特別依賴中鋼生產**薄規格寬幅產品（Light, wide gauges，如 `1660` [16 ga x 60\"] 與 `1272` [12 ga x 72\"]）**。\n  - 客戶直言 **POSCO 內部高度政治化（very political）且 POSCO International 難以溝通**，只要訂單一忙就拒接特殊薄寬尺寸（只肯做 10 ga x 48\"）；反觀中鋼重視長期夥伴關係、好溝通且願意生產全尺寸，這對 Cascadia 最具價值。\n- **終端流向（Amazon AI 資料中心供應鏈）**：中鋼冷軋有極大比例銷往 **IEM（Industrial Electric Mfg）**，用於製造 Amazon 資料中心所需、體積大如房屋的超大型配電開關箱（electrical switchboxes / switching gear）。\n\n### 2. 熱浸鍍鋅（GI）與合金化鍍鋅（GA）：10 Gauge 急迫缺口與反傾銷突圍構想\n- **最急迫需求（不計代價採購）**：\n  - 急需 **10 Gauge（0.13 吋 / 約 3.3~3.4 mm，48\" 或 60\" 寬）的 Galvanneal (GA) 與 Galvanized (GI)**。\n  - 因加拿大本土僅 ArcelorMittal Dofasco 能生產且對 Cascadia 嚴格配額管制，Jim Ritchie 當場表明：「**只要有任何貨源，不管價格多少我們都買（It doesn't matter what the price is, we'll just buy it）！**」（中鋼團隊現場確認 3.3~3.4 mm 屬中鋼可生產之正常厚板規格）。\n- **Stelco 停產造成每月 3~3.5 萬噸供給大缺口**：\n  - Stelco 已停止在加拿大生產鍍鋅與冷軋（GI & CR），導致加拿大內銷市場每月減少 **30,000 ~ 35,000 公噸** 供給，迫使加東買家（如 Optima）大舉轉向越南採購。\n- **台灣供應鏈反傾銷稅（AD Duty）障礙與「塗油鍍鋅」豁免方案**：\n  - 台灣下游 **裕鐵（YP，AD 僅 3.2%）** 目前無產能/缺料，**燁輝（PT，鍍鋁鋅 AD 約 10%）** 也已售罄；而 **中鋼（CSC）** 本身受限於「All Others」高達 **33% ~ 34%** 的反傾銷稅。\n  - **突圍方案**：貿易商指出 **「塗油（不鈍化）鍍鋅（Oiled GI/GL）」在加拿大反傾銷稅中屬於排除豁免項目（Excluded from AD）**（安大略省已有銷售予泳池牆板廠後續塗裝之實績），現場評估推廣予車庫門大廠（如 Flexi-Force、Assa Abloy）進行後續脫脂加工之可行性。\n- **美國廠 GI 缺口**：Cascadia 美國採購負責人 Danny 已收到中鋼冷軋報價，但明年美國廠最急缺的是 **鍍鋅（GI）**。\n\n### 3. 其他金屬品項採購現況\n- **烤漆鋼板（Pre-painted Steel）**：Cascadia 為韓國 **KG Dongbu（原東部製鋼）全球最大客戶**（年採購 **70,000 公噸** 塗鍍鋼品），此品項維持向韓國採購。\n- **不鏽鋼（Stainless Steel）**：向台灣 **燁聯（YUSCO）**、唐榮（Tang Eng）、華新麗華（Walsin）等採購。\n- **平軋鋁捲（Flat-rolled Aluminum）**：因加拿大無本土平軋鋁廠，仍從中國進口並享有特定關稅豁免（Company-specific remissions）。會中並分享 6~8 個月前將中國次級鋁材（原擬售 $2.60/lb）以 **$2.95/lb** 高價全數賣給美國廢五金商，以「廢鋁（Scrap）」名義免關稅運往美國波特蘭重熔變身為「Made in the USA」之套利實例。\n\n---\n\n## 四、台韓海運費結構差異與北美市場深度情報\n\n### 1. 台韓海運費（Freight）關鍵差異（$15~$18/MT 價差）\n- **韓國航線秘密武器（Swire 太古船務定期船）**：Swire 載運加拿大紙漿與紙張赴日韓，回程提供每兩週一班（bi-weekly liner service）定期船。Cascadia 透過**保證每船包下 1~2 個船艙（guarantee holds）**，取得遠低於現貨市場的極低運價。\n- **台灣航線劣勢（Saga 壟斷）**：台灣航線由 **Saga** 強勢主導，目前台灣（G2 Ocean）運費約 **$80/噸**（含燃油附加費），導致從韓國出貨每噸比台灣便宜 **$15 ~ $18 美元**（長期平均甚至享有 $20/噸運費優勢）。Cascadia 強烈期盼未來能改善台灣航線運費結構。\n\n### 2. 下游 AI 資料中心（Data Centers）熱潮與免關稅輸美通道\n- **最大終端成長動能**：目前 AI 資料中心為 Cascadia 最大且最強勁的客戶群（主要由 **Amazon** 驅動）：\n  1. **Johnson Controls（江森自控）**：於艾德蒙頓（Edmonton）設有 13 座工廠、約 2,000 名員工，製造大型資料中心冷卻風扇機房模組，**Cascadia 每月供貨超過 3,000 公噸**（外殼鋼板與地板鋁材）。\n  2. **IEM**：製造巨型配電開關箱，大量消耗中鋼冷軋（CR）。\n- **免稅輸美通道**：美國企業在加拿大設廠，進口全球鋼材與銅線製成資料中心設備模組後運往美國，**進入美國時完全免關稅（Zero Duty）**。\n- **供應鏈瓶頸**：受限於**缺工（Labor shortage）**與**冷卻風扇/電子零件短缺**，導致許多完工鐵殼堆置戶外等待零件，Amazon 因此將訂單分散予 3~4 家代工廠（均為 Cascadia 客戶）。\n\n### 3. 與加東外資鋼廠之對立、北美鋼廠漲價與 Alberta 新電爐廠情報\n- **盛讚中鋼生態系 vs. 批判加拿大外資鋼廠**：\n  - Jim Ritchie 高度讚賞中鋼具備世界級競爭力，並全力扶植盛餘、裕鐵、燁輝等下游，讓**整個台灣鋼鐵生態系具備全球競爭力**。\n  - 反觀加拿大三大鋼廠全為外資持有（**Stelco 屬美國 Cleveland-Cliffs、Algoma 屬美國私募/對沖基金、Dofasco 屬英印 ArcelorMittal**），設備老舊且將獲利全數匯出海外。因 Cascadia 大量進口且公開於 CITT 反對保護主義，遭 Stelco 與 ArcelorMittal 報復（大砍配額，甚至以低於賣給 Cascadia **$100/噸** 的價格直接傾銷給 Cascadia 的下游小客戶，導致 Cascadia 向客戶回購反而比向鋼廠直購便宜）。\n- **北美鋼廠強硬漲價與霸王條款**：\n  - **Nucor 與 Big River Steel** 明年度合約**全面取消折扣（由原本 CRU -5.5% 改為 0 折扣）且取消數量緩衝（no buffer）**，幾乎每週一調漲。\n  - 會議當天（10月19日）**Dofasco** 亦宣布漲價：**熱軋（HR）漲 $5/噸、冷軋（CR）與鍍鋅（GI）漲 $10/噸**。\n- **「4~5 個月高庫存」經營哲學與市場隱憂**：\n  - 不同於上市同業（Russel Metals）受制於短期 ROI 不敢備貨，私人控股的 Cascadia 常態維持 **4~5 個月高庫存**，在充滿關稅（今年已額外支付逾 **$2,500 萬美元** 關稅）與斷鏈恐慌的市場中提供「確定性（Certainty / Comfort food）」。\n  - 但 Jim Ritchie 對市場過熱深感憂慮：認為目前美加鋼價（全球第 1、第 2 高）**高估約 30%**，擔憂若油價觸及 **$140/桶** 或 AI 晶片算力突破將引發黑天鵝反轉，期盼好景氣能維持至 **2027 年**。\n- **Alberta 新建 50 萬噸電爐廠情報**：貿易商透露 Big River Steel 創辦人 **Dave Stickler**（近期剛建 Hybar 鋼筋廠）正認真評估於**亞伯達省（Alberta）興建一座年產 50 萬噸之電弧爐（EAF）鋼廠**。\n\n---\n\n## 五、後續行動項目 (Action Items)\n1. **中鋼鍍鋅（GI/GA）團隊（Roland 團隊）**：針對 Cascadia 最急迫需求之 **10 Gauge（0.13\" / 約 3.3~3.4 mm，48\" 及 60\" 寬）GI 與 GA**，評估產能、33%~34% AD 稅率下之報價可行性（客戶表示不計價格皆願意採購），以及「塗油鍍鋅（Oiled GI）」豁免反傾銷稅之供貨可能。\n2. **中鋼冷軋（CR）與美國市場團隊（Vincent）**：持續鞏固 Cascadia 加拿大冷軋全尺寸（含 `1660`、`1272` 薄寬規格）穩定供應，並與 Cascadia 美國採購負責人 **Danny** 對接冷軋與鍍鋅需求。\n3. **海運物流評估**：探討台灣航線（目前 G2 Ocean / Saga 約 $80/MT）是否有合船、包艙或改善運費結構之空間，以縮小與韓國 Swire 定期船（便宜 $15~$18/MT）之運價差距。\n", "docx_b64": "UEsDBBQAAAAIAPhQVV0xpqS4/gAAADoCAAATAAAAW0NvbnRlbnRfVHlwZXNdLnhtbK2RzU7DMBCE730Ky9cqceCAEIrTAz9H4FAeYGVvEgv/yeuW5u1xGigSoogDR2vmmxmt283BWbbHRCZ4yS/qhjP0KmjjB8lftg/VNWeUwWuwwaPkExLfdKt2O0UkVmBPko85xxshSI3ogOoQ0RelD8lBLs80iAjqFQYUl01zJVTwGX2u8pzBuxVj7R32sLOZ3R+KsmxJaImz28U710kOMVqjIBdd7L3+VlR9lNSFPHpoNJHWxcDFuZJZPN/xhT6VEyWjkT1Dyo/gilG8haSFDmrnClz/nvTD2tD3RuGJn9NiCgqJyu2drU+KA+PXf5hCebJI/z9kyf1c0Irj13fvUEsDBBQAAAAIAPhQVV0gG4bqsgAAAC4BAAALAAAAX3JlbHMvLnJlbHONz7sOgjAUBuCdp2jOLgUHYwyFxZiwGnyApj2URnpJWy+8vR0cxDg4ntt38jfd08zkjiFqZxnUZQUErXBSW8XgMpw2eyAxcSv57CwyWDBC1xbNGWee8k2ctI8kIzYymFLyB0qjmNDwWDqPNk9GFwxPuQyKei6uXCHdVtWOhk8D2oKQFUt6ySD0sgYyLB7/4d04aoFHJ24Gbfrx5WsjyzwoTAweLkgq3+0ys0BzSrqK2b4AUEsDBBQAAAAIAPhQVV2DSVCfsAAAAB8BAAAcAAAAd29yZC9fcmVscy9kb2N1bWVudC54bWwucmVsc42PzQrCMBCE732KZe82rQcRadqLCL1KfYCQbn8wTUI2in17A14sePA4DPMNX9W8FgNPCjw7K7HMCwSy2vWzHSXeusvuiMBR2V4ZZ0niSoxNnVVXMiqmDU+zZ0gQyxKnGP1JCNYTLYpz58mmZnBhUTHFMAqv9F2NJPZFcRDhm4F1BrDBQttLDG1fInSrp3/wbhhmTWenHwvZ+ONFcFxNUoBOhZGixE/OEwdF0hIbr/oNUEsDBBQAAAAIAPhQVV2bXfPrBwEAAN8BAAAPAAAAd29yZC9zdHlsZXMueG1sdZ 、海運與加東/美國鋼廠動態之資深貿易商夥伴 |\n\n---\n\n## 二、 核心商情與關鍵數據摘要\n\n> [!IMPORTANT]\n> **Cascadia 鋼材採購量體與急迫需求**\n> - **總使用量**：美加合計每月約 **40,000 公噸**（年用量約 **48 萬噸**），其中加拿大約 **30,000 噸/月**（溫哥華廠約 10,000 噸/月、Brandon 廠近 10,000 噸/月等）、美國約 **10,000 噸/月**。\n> - **最急迫缺口（不計代價採購）**：**10 Gauge（0.13 吋 / 約 3.3~3.4 mm，48\" 或 60\" 寬）的 Galvanneal（GA，合金化鍍鋅）與 Galvanized（GI，熱浸鍍鋅）**。因加拿大僅 ArcelorMittal Dofasco 生產且嚴格配額，Jim Ritchie 明確表示：「**只要有任何貨源，不管價格多少我們都買（It doesn't matter what the price is, we'll just buy it）！**」\n> - **Stelco 停產鍍鋅與冷軋帶來的進口大缺口**：Stelco 已停止在加拿大生產鍍鋅與冷軋（GI & CR），導致加拿大內銷市場每月憑空少掉 **30,000 ~ 35,000 公噸** 供給，進口需求將進一步大增。\n\n### 1. 各項產品採購現況與對中鋼（CSC）的評價\n- **冷軋（Cold Rolled, CR）**：\n  - Cascadia 是中鋼在加拿大最大的冷軋客戶。\n  - **Cascadia 最看重中鋼的核心價值：「全尺寸供應能力（Make Every Size）」**，特別是**薄規格寬幅產品（如 1660 [16 gauge 60\" 寬]、1272 [12 gauge 72\" 寬]）**。POSCO 只要訂單一忙就拒接特殊薄寬尺寸，而中鋼高度客製化且重視長期關係，這對身為裁剪服務中心（Service Center）的 Cascadia 至關重要。\n  - **主要終端去向**：大量供應給 **IEM（Industrial Electric Mfg）** 製造 **Amazon 資料中心**所需、體積「大如一棟房子（as big as a house）」的超大型配電開關箱（electrical switchboxes / switching gear）。\n- **熱浸鍍鋅（GI）與合金化鍍鋅（GA）**：\n  - **反傾銷稅（AD Duty）障礙**：中鋼（CSC）本身在加拿大反傾銷稅被歸於「All Others」，稅率高達 **33% ~ 34%**；反觀台灣下游 **YP（裕鐵）僅 3.2%**、**PT（燁輝）鍍鋁鋅約 10%**，但目前裕鐵無產能（缺料）、燁輝也已售罄（sold out）。\n  - **「塗油鍍鋅（Oiled GI/GL）」豁免構想**：貿易商提出「塗油（不鈍化）鍍鋅」在加拿大反傾銷稅屬於**豁免排除項目（excluded from AD）**，在安大略省已有賣給游泳池牆板廠後續塗裝的案例，建議評估 Cascadia 下游門業客戶（如 Flexi-Force、Assa Abloy）能否使用。\n  - **目前 GI 進口來源**：越南（Vietnam）、韓國（Korea）、澳洲（BlueScope Australia）及部分泰國（POSCO Thailand）。\n- **烤漆鋼板（Pre-painted Steel）**：\n  - Cascadia 是韓國 **KG Dongbu（原東部製鋼）全球最大客戶**，年採購約 **70,000 公噸**塗鍍/烤漆鋼品，此品項將繼續維持向韓國採購。\n- **其他金屬品項**：\n  - **平軋鋁捲（Flat-rolled Aluminum）**：因加拿大無本土平軋鋁廠，仍從中國進口（享有特定關稅豁免）。\n  - **不鏽鋼（Stainless Steel）**：部分自台灣進口（如 **YUSCO 燁聯**、唐榮、華新麗華等）。\n\n### 2. 台韓海運費（Freight）關鍵差異\n- **韓國航線秘密武器（Swire 太古船務）**：Swire 載運加拿大紙漿與紙張赴日韓，回程提供每兩週一班（bi-weekly liner service）定期船。Cascadia 透過**保證每船包下 1~2 個船艙（guarantee tons / holds）**，拿到遠低於現貨市場的極低運價。\n- **台灣航線劣勢（Saga 壟斷）**：台灣航線由 **Saga** 強勢主導，目前台灣（如 G2 Ocean）運費約 **$80/噸**（含燃油附加費），而 Cascadia 從韓國出貨每噸可便宜 **$15 ~ $18 美元**（長期平均甚至享有 $20/噸的運費優勢）。Cascadia 非常希望能改善台灣航線的運費結構。\n\n### 3. 下游 AI 資料中心（Data Centers）熱潮與關稅奇象\n- **最大下游客戶群**：目前資料中心是 Cascadia 最大的終端應用市場，主要由 **Amazon** 驅動：\n  1. **Johnson Controls（江森自控）**：於艾德蒙頓（Edmonton）設有 13 座工廠、約 2,000 名員工，製造大型資料中心冷卻風扇機房模組。Cascadia 與 Varsteel 共同供應該客戶，**Cascadia 每月供貨超過 3,000 公噸**（鋼板與地板鋁材）。\n  2. **IEM**：製造資料中心巨型配電開關箱，消耗大量中鋼冷軋（CR）。\n- **免關稅輸美通道**：美國企業在加拿大設廠，進口全球鋼材與銅線製成資料中心設備模組後運往美國，**進入美國時完全免關稅（Zero Duty）**。\n- **供應鏈瓶頸**：客戶雖曾喊出業務翻四倍（quadruple），但受限於**缺工（labor shortage）**及**缺風扇/電子零件**，導致許多做好的鐵殼堆在田裡等零件；Amazon 也因此將訂單分散給 3~4 家代工廠（均為 Cascadia 客戶）。\n\n---\n\n## 三、 完整 17 段音訊逐段時間軸紀錄（00:00 - 50:32）\n\n### Chunk 00 (00:00 - 03:00)：開場寒暄、越南市場與中鋼團隊介紹\n- **越南與馬來西亞市場討論**：中鋼 Jim 剛結束簡報，Cascadia 總裁 Jim Ritchie 表示非常喜歡越南市場。貿易商夥伴補充越南為非自由貿易協定國（馬來西亞則是自由貿易國），並指出 Cascadia 在越南人脈深厚。Jim 開玩笑說他們向中鋼越南廠（CSVC）買料，算是中鋼的下游間接客戶。\n- **中鋼集團總部展示**：Jim 展示中鋼集團概況（涵蓋鋼鐵、工業材料、工程等）與高雄總部大樓照片，與會者稱讚大樓非常現代化。\n- **行程寒暄與介紹 Mr. Parker**：Cascadia 表示很喜歡跟台灣做生意（好溝通、容易合作）。中鋼團隊昨日剛抵達加拿大；負責技術的 **Mr. Parker** 則於當天早上剛從墨西哥城（中鋼駐墨辦事處）飛抵支援。Jim Ritchie 回憶多年前曾參訪中鋼一貫化煉鋼廠並用餐，早年也與燁輝（PT）做過很多直接生意。\n\n### Chunk 01 (03:00 - 06:00)：韓國 KG Dongbu 採購量與 Cascadia 北美產銷規模\n- **烤漆鋼板與 KG Dongbu**：Cascadia 表示競爭總在韓國與台灣之間。他們是韓國 **KG Dongbu（原 Dongbu 東部製鋼）全球最大客戶**，每年向其採購約 **70,000 噸**塗鍍鋼材，但笑稱韓國人還是很難控制。\n- **Cascadia 鋼材月使用量**：\n  - 現址廠區（溫哥華）約 **10,000 噸/月**，Brandon 廠約 **10,000 噸/月**，**全加拿大合計約 30,000 噸/月**；\n  - **美國廠區另約 10,000 噸/月**，**美加總計約 40,000 噸/月**。\n  - 身為加西最大鋼捲加工中心與最大進口商，他們持續擴張市佔率；但坦言加東（Eastern Canada）因法語文化差異、本土鋼廠林立與激烈競爭而較難切入。\n\n### Chunk 02 (06:00 - 09:00)：加東老舊鋼廠對比、冷軋合作與對 POSCO 的抱怨\n- **加東鋼廠設備老舊**：加東的 Dofasco、Stelco、Algoma 設備全都有百年歷史（笑稱因為加拿大沒經歷過本土戰爭被炸毀重建，不像德國或韓國 POSCO 從零開始，也不像 1971 年創立的中鋼擁有最先進設備）。\n- **冷軋（CR）業務交流**：介紹中鋼冷軋負責人 **Vincent**。Vincent 感謝 Cascadia 作為中鋼在加拿大最大的冷軋客戶。Jim Ritchie 表示加拿大市場不大，他們採取策略性集中採購以成為供應商的重要客戶，並盛讚中鋼在台灣每月與盛餘（SYSCO）、裕鐵（YP）等下游開會協作的產業共榮模式。\n- **POSCO 政治化問題**：Jim Ritchie 直言中鋼比 POSCO 好合作太多了，POSCO 內部充滿政治角力（very political），加上 POSCO International 更是令人頭痛（即便他自己會說韓文也無濟於事）。\n\n### Chunk 03 (09:00 - 12:00)：報價默契、全尺寸供應價值與韓國海運優勢\n- **價格與全尺寸供應（Full Size Range）**：中鋼與 POSCO 在加拿大的報價通常非常接近。Jim Ritchie 強調他們不追求過低價格，而是需要穩定具競爭力的價格，但**最核心價值是中鋼願意生產所有尺寸（特別是 1660、1272 等薄規格寬幅產品）**，不會像 POSCO 忙起來就拒接特殊規格。\n- **海運費差距（Swire 定期船）**：Cascadia 點出最希望改善的是台灣海運費。他們在韓國與 **Swire（太古船務）** 合作（去程載紙漿赴日韓，回程每兩週一班定期船），Cascadia 靠**保證每月包下 1~2 個船艙（holds）**取得遠低於現貨市場的特別運價。\n\n### Chunk 04 (12:00 - 15:00)：台韓運費價差精算與對市場過熱的深層憂慮\n- **台灣運費行情**：台灣航線受 **Saga** 控制，目前透過 G2 Ocean 運費約 **$80/噸**（含燃油附加費），而 Cascadia 從韓國出貨每噸便宜 **$15 ~ $18 美元**（長期靠每噸省 $20 美元運費作為競爭秘密武器）。\n- **「生意極好，但我不開心（Business is really good, but I'm not happy）」**：\n  - Jim Ritchie 坦言對當前市場結構感到高度緊張：到處都是關稅、加拿大消費者不堪負荷、通膨累積、油價與鋼價過高（他認為**目前鋼價約高估了 30%**）。\n  - 他不喜歡客戶只因為「別處買不到」而被迫向 Cascadia 買，這會導致客戶對單一供應商產生怨懟。\n\n### Chunk 05 (15:00 - 18:00)：北美製造業競爭力危機、黑天鵝風險與全球鋼價排名\n- **製造業外銷困境與資料中心泡沫隱憂**：美國鋼價高昂導致製造商（如 Caterpillar）根本無法與中國同業競爭外銷；目前全靠 **AI 資料中心（Data Centers）** 與風電基建支撐，他質疑這種行情如何持續多年？\n- **黑天鵝指標**：歷史經驗只要**油價衝上每桶 $140 美元**或發生金融危機，市場就會反轉；與會夥伴也笑稱若 Nvidia 今晚發表算力 10 倍、耗電減半的新晶片，資料中心熱潮就會結束。Jim Ritchie 表示若好景氣能維持到 **2027 年**他就很滿意了。\n- **全球鋼價排名**：**美國全球第一高、加拿大全球第二高**，高於歐洲與亞洲。\n\n### Chunk 06 (18:00 - 21:00)：Stelco 停產鍍鋅大缺口、台灣反傾銷稅率與塗油鍍鋅豁免\n- **Stelco 停產 GI/CR 衝擊**：Stelco 停止在加拿大生產鍍鋅與冷軋，造成每月 **30,000 ~ 35,000 噸** 的內銷缺口，迫使安大略省買家（如 Optima）大舉向越南下單。\n- **台灣 GI 產能與稅率討論**：裕鐵（YP，稅率 3.2%）沒產能、燁輝（PT，GL 稅率 10%）已滿載，而中鋼（CSC）本身受限於「All Others」高達 **33%~34%** 的反傾銷稅。\n- **塗油鍍鋅（Oiled GI）豁免探討**：貿易商提出「塗油鍍鋅」可豁免加拿大反傾銷稅，詢問 Mark 能否推給車庫門大廠 Flexi-Force 或 Assa Abloy（目前加西暫無此製程需求，加東則有用於泳池牆板烤漆）。\n\n### Chunk 07 (21:00 - 24:00)：10 Gauge 厚板 GI/GA 急迫需求、採購國偏好與鋁/不鏽鋼\n- **10 Gauge GI/GA 不計價收購**：Cascadia 急需 **10 Gauge（0.13 吋 / 約 3.4 mm，48\"/60\" 寬）的 Galvanneal 與 Galvanized**，強調「**只要有貨，不論價格多少都買**」（中鋼團隊現場以中文確認 0.13 吋即約 3.3~3.4 mm 正常厚板規格）。\n- **最喜愛採購國**：第一、二名為**台灣與韓國**，第三名為**越南**（FHS 台塑河靜、Hoa Phat 和發；越南品質雖不如中鋼與 POSCO，但尚可接受）。\n- **鋁材與不鏽鋼**：平軋鋁捲從中國進口（加拿大無生產商，享特定豁免）。\n\n### Chunk 08 (24:00 - 27:00)：本土配額縮減與加東本土鋼廠的惡意報復\n- **不鏽鋼採購**：向台灣燁聯（YUSCO）、唐榮、華新麗華等採購。\n- **本土熱軋配額**：目前每月僅從 Stelco 拿到 **3,000 噸**、從 Algoma 拿到 **500 噸**。\n- **與加東鋼廠公開交鋒**：因為 Cascadia 大量進口，加上 Jim Ritchie 敢在媒體與加拿大國際貿易法庭（CITT）公開批評本土鋼廠受保護又老舊，**Stelco 與 ArcelorMittal Dofasco** 處處報復 Cascadia：不僅大砍 Cascadia 配額，甚至以**比賣給 Cascadia 低 $100/噸的價格**直接賣給 Cascadia 的下游小客戶（唯獨 Algoma 未參與報復）。\n\n### Chunk 09 (27:00 - 30:00)：向客戶回購竟比鋼廠便宜、亞伯達公投與 2,500 萬美元關稅\n- **荒謬的價格倒掛**：Cascadia 向自己的下游客戶回購 ArcelorMittal 的鋼材，價格竟然比直接向 ArcelorMittal 買還便宜！Jim Ritchie 當面嗆 ArcelorMittal 是最爛供應商。\n- **東西部分裂與亞伯達公投**：政府拿加西稅金補貼加東外資鋼廠，從漢密爾頓（Hamilton）運往加西的**內陸運費超過 $100 美元/噸**，這也是為何會議當天（10月19日）亞伯達省（Alberta）正在舉行公投。\n- **龐大關稅負擔**：Cascadia 今年光是「預期之外」額外支付的關稅就超過 **2,500 萬美元（$25 million）**。Jim Ritchie 笑稱中鋼乾脆去把 Stelco 買下來，他一定當客戶。\n\n### Chunk 10 (30:00 - 33:00)：中鋼生態系典範 vs. 加拿大外資鋼廠、反傾銷可能性評估\n- **中鋼模式獲得極高評價**：Jim Ritchie 盛讚中鋼雖然在台灣地位特殊，但具備世界級競爭力，且全力扶植盛餘、裕鐵、燁輝等下游，讓**整個台灣鋼鐵生態系具備全球競爭力**；反觀加拿大三大鋼廠全為外資持有（**Stelco 屬美國 Cleveland-Cliffs、Algoma 屬美國私募/對沖基金、Dofasco 屬英印 ArcelorMittal**），只顧把獲利匯出海外給外國股東，毫不投資本土。\n- **反傾銷風險評估**：太平洋是最便宜的高速公路，進口永遠具優勢。針對熱軋（HR）是否會被提反傾銷？與會者一致認為**目前本土鋼廠暴賺且市場嚴重缺貨，完全無法證明產業受損（no injury）**；況且全面課徵關稅比耗時花錢的反傾銷對鋼廠更有利（如近期美國對韓、台祭出 20%~28% 反傾銷初裁，一週後美國市價直接漲 20% 轉嫁）。\n\n### Chunk 11 (33:00 - 36:00)：Cascadia 的「4~5 個月高庫存」秘密武器與經營哲學\n- **暴漲暴跌的應對**：在多頭市場 Cascadia 賺得比同業多，一旦空頭反轉，Jim Ritchie 會果斷砍價認賠出清。\n- **庫存水位（4~5 個月）**：不同於上市公司（如 Russel Metals）只看短期資本報酬率（ROI）不敢備貨，私人控股的 Cascadia 常態維持 **4 到 5 個月的高庫存**，在充滿關稅與斷鏈恐慌的市場中為客戶提供「確定性（certainty）」，如同販售「療癒美食（comfort food）」，甚至連其他同業服務中心都需向其調貨。\n\n### Chunk 12 (36:00 - 39:00)：資料中心免稅輸美通道與「中國廢鋁變美國製造」奇聞\n- **資料中心免關稅通道**：美國企業在加拿大用全球進口的鋼材與銅線製造資料中心設備，運進美國完全零關稅（Zero Duty）。\n- **廢鋁（Scrap Aluminum）套利奇聞**：6~8 個月前美國鋁價飆漲，Cascadia 正常鋁賣 $2.75/磅、次級鋁想賣 $2.60/磅，結果廢五金商出價 **$2.95/磅** 全數收購當廢鋁免稅運往美國波特蘭重熔，中國鋁材瞬間變成「Made in the USA」。\n\n### Chunk 13 (39:00 - 42:00)：Johnson Controls 與 IEM（Amazon 供應鏈）深度解析\n- **Johnson Controls（艾德蒙頓 13 座廠、2,000 人）**：製造資料中心大型冷卻風扇機房，Cascadia 每月供貨 **3,000 噸以上**。\n- **IEM（中鋼冷軋 CR 主力終端用戶）**：為 Amazon 製造大如房屋的巨型配電開關箱（switchboxes），消耗大量冷軋。\n- **缺工與缺零件瓶頸**：因缺風扇與缺工，Amazon 將訂單拆給 3~4 家代工廠，Cascadia 同時供應這幾家代工廠。\n\n### Chunk 14 (42:00 - 45:00)：越南回溯關稅官司與美國 Nucor / Big River 霸王條款\n- **午餐安排與越南追溯稅**：Jim Ritchie 不克出席午餐，由 Mark 與 Amy 代表。提及 COVID 期間自越南進口 5 萬噸塗鍍鋼材遭加拿大政府回溯課稅，至今仍在訴訟。\n- **美國鋼廠取消折扣並週週漲價**：中鋼冷軋有報給 Cascadia 美國廠（Danny），但美國廠明年最缺的是鍍鋅（GI）。**Nucor 與 Big River** 通知明年度合約**全面取消折扣（原本為 CRU minus 5.5%，明年改為 0 折扣且無數量緩衝 buffer）**，且 Nucor 與 Dofasco 在會議當天（週一）又再度調漲價格（Dofasco 熱軋漲 $5、冷軋與鍍鋅漲 $10）。\n\n### Chunk 15 (45:00 - 48:00)：本土鋼廠如培養皿細菌、Alberta 新電爐廠計畫與台韓地理優勢\n- **辛辣比喻**：Jim Ritchie 形容貪婪的北美本土鋼廠就像「**培養皿裡的細菌（bacteria in a Petri dish）**」，無止境漲價擴張直到耗盡養分崩潰。\n- **Alberta 新建電爐廠情報**：貿易商透露 Big River Steel 創辦人 **Dave Stickler**（近期剛建 Hybar 鋼筋廠，與 LMS 的 Ron 熟識）正認真考慮在**亞伯達省（Alberta）興建一座年產 50 萬噸的電弧爐（EAF）鋼廠**。\n- **台韓地理優勢**：Jim Ritchie 分析加拿大內陸太大、海岸線少且缺廢鋼，不適合蓋鋼廠；反觀**台灣（海島）與韓國（半島）四面環海，任何靠海處都能建廠，是全球最適合蓋鋼廠的完美地理環境**。\n\n### Chunk 16 (48:00 - 50:32)：批判「國家安全」保護主義、資源交換構想與會議結束\n- **反駁國家安全論**：Jim Ritchie 認為無能的外資本土鋼廠才是國家安全威脅；加拿大擁有鐵礦砂、焦煤、銅、鋅等豐富天然資源，最聰明的做法應該是用原物料與國外交換便宜優質的鋼材（「以噸易噸 ton for ton」，把污染留在國外），讓本土製造業繁榮，等 20~30 年後綠鋼（Green Steel）等新技術成熟再重建鋼廠。\n- **會議結束**：雙方互道感謝，結束約 50.5 分鐘的深度會談。\n", "docx_b64": "UEsDBBQAAAAIAPhQVV0xpqS4/gAAADoCAAATAAAAW0NvbnRlbnRfVHlwZXNdLnhtbK2RzU7DMBCE730Ky9cqceCAEIrTAz9H4FAeYGVvEgv/yeuW5u1xGigSoogDR2vmmxmt283BWbbHRCZ4yS/qhjP0KmjjB8lftg/VNWeUwWuwwaPkExLfdKt2O0UkVmBPko85xxshSI3ogOoQ0RelD8lBLs80iAjqFQYUl01zJVTwGX2u8pzBuxVj7R32sLOZ3R+KsmxJaImz28U710kOMVqjIBdd7L3+VlR9lNSFPHpoNJHWxcDFuZJZPN/xhT6VEyWjkT1Dyo/gilG8haSFDmrnClz/nvTD2tD3RuGJn9NiCgqJyu2drU+KA+PXf5hCebJI/z9kyf1c0Irj13fvUEsDBBQAAAAIAPhQVV0gG4bqsgAAAC4BAAALAAAAX3JlbHMvLnJlbHONz7sOgjAUBuCdp2jOLgUHYwyFxZiwGnyApj2URnpJWy+8vR0cxDg4ntt38jfd08zkjiFqZxnUZQUErXBSW8XgMpw2eyAxcSv57CwyWDBC1xbNGWee8k2ctI8kIzYymFLyB0qjmNDwWDqPNk9GFwxPuQyKei6uXCHdVtWOhk8D2oKQFUt6ySD0sgYyLB7/4d04aoFHJ24Gbfrx5WsjyzwoTAweLkgq3+0ys0BzSrqK2b4AUEsDBBQAAAAIAPhQVV2DSVCfsAAAAB8BAAAcAAAAd29yZC9fcmVscy9kb2N1bWVudC54bWwucmVsc42PzQrCMBCE732KZe82rQcRadqLCL1KfYCQbn8wTUI2in17A14sePA4DPMNX9W8FgNPCjw7K7HMCwSy2vWzHSXeusvuiMBR2V4ZZ0niSoxNnVVXMiqmDU+zZ0gQyxKnGP1JCNYTLYpz58mmZnBhUTHFMAqv9F2NJPZFcRDhm4F1BrDBQttLDG1fInSrp3/wbhhmTWe 區 / 總部）\n- **與會人員**：\n  - **Cascadia Metals**：\n    - **Jim Ritchie**：總裁 / 負責人（主要發言人，熟悉台韓越供應鏈，能聽說韓語但習慣以英語交談，沒有上級老闆、決策直接，經常在媒體與 CITT 公開發聲批評加東保護主義鋼廠）\n    - **Mark**：採購/營運主管（會中共同評估塗油鍍鋅 Oiled GI 應用於車庫門客戶的可行性，並代表出席會後午餐）\n    - **Amy**：採購/業務人員（代表出席會後午餐）\n    - **Philip**：物流/船運相關主管（會中確認台灣 G2 Ocean 海運費為 $80/噸 effective rate）\n    - *提及未在場人員*：**Danny**（Cascadia 美國廠採購負責人，急需鍍鋅 GI）\n  - **中鋼公司 (CSC)**：\n    - **Jim**：主談代表（介紹中鋼集團概況與高雄總部大樓、說明中鋼與台塑河靜及台灣下游盛餘/裕鐵/燁輝之供料關係）\n    - **Vincent**：冷軋（Cold Rolled）銷售代表（負責 Cascadia 冷軋業務）\n    - **Mr. Parker**：駐墨西哥城（Mexico City）辦事處技術代表（因本次技術部門僅派一名代表赴美，為重視 Cascadia 特於會議當天早晨自墨西哥飛抵溫哥華支援）\n    - **女性業務/企劃同仁**：提問 Cascadia 庫存月數（4~5個月）、下游客戶產業結構（Data Centers）、客戶預測模式，並參與討論台灣 GI 反傾銷稅率與 10 Gauge 厚度規格\n    - *提及未在場人員*：**Roland**（中鋼負責熱浸鍍鋅 GI 團隊代表）\n  - **貿易商 / 通路夥伴**：\n    - **Jock（及英國/澳洲口音貿易商代表）**：熟悉美加反傾銷稅率（AD Duty）、塗油鍍鋅豁免條款、外資鋼廠股權結構，並推薦 Big River 創辦人 Dave Stickler 予 Jim Ritchie\n    - **Cellmark 代表**：與 Jim Ritchie 敘舊，提及 10 年前馬來西亞反規避案（Malaysian anti-circumvention case）時曾來推銷鍍鋅\n\n---\n\n## 2. 關鍵量化數據總表 (Key Quantitative Data)\n\n| 類別 | 項目 | 數據 / 規格 | 備註說明 |\n| :--- | :--- | :--- | :--- |\n| **Cascadia 規模** | 加拿大＋美國總月用量 | **40,000 公噸 / 月**（約 48 萬噸/年） | 加西最大鋼捲加工中心與最大進口商 |\n| **Cascadia 規模** | 加拿大月用量 | **30,000 公噸 / 月** | 溫哥華廠約 10,000 噸/月、Brandon 廠近 10,000 噸/月、其餘廠區合計約 10,000 噸/月 |\n| **Cascadia 規模** | 美國月用量 | **10,000 公噸 / 月** | 主要由 Danny 負責採購，明年預計美國本土 GI 供貨不足 |\n| **Cascadia 規模** | 常態庫存水位 | **4 ~ 5 個月** | Cascadia 的「秘密武器（Secret Weapon）」，遠高於上市同業（如 Russel Metals） |\n| **採購量體** | 韓國 KG Dongbu 採購量 | **70,000 公噸 / 年**（塗鍍/烤漆鋼品） | Cascadia 為 KG Dongbu（原東部製鋼）**全球最大客戶** |\n| **採購量體** | 加拿大本土熱軋（HR）配額 | **Stelco 3,000 噸/月**、**Algoma 500 噸/月** | 遭本土鋼廠嚴格配額限制（Allocation） |\n| **採購量體** | COVID 期間越南塗鍍進口量 | **50,000 公噸** | 事後遭加拿大政府追溯課稅（Retroactive duty），目前仍在訴訟中 |\n| **急迫需求** | **10 Gauge 厚板 GI / GA** | **厚度 0.13\"（約 3.3~3.4mm），寬度 48\" 或 60\"** | **不論價格多少都買（\"Doesn't matter what the price is, we'll just buy it\"）**；加國僅 ArcelorMittal 生產且配額管制 |\n| **市場缺口** | **Stelco 停產 GI & CR  Overview）：除鋼鐵業務外，亦涵蓋工業材料（industrial material）、工程（engineering）等，並展示高雄中鋼集團總部大樓（CSCG HQ in Kaohsiung），眾人讚賞建築十分現代化（*very modern*）。\n  - Jim Ritchie 表示喜歡與台灣做生意：「*Well we like doing business with Taiwan. It's good, easy to do business in Taiwan, we like that.*」\n  - 詢問中鋼行程：中鋼團隊昨日剛抵達溫哥華；技術代表 **Mr. Parker** 駐點於墨西哥城（stationed in Mexico City），因發現 Cascadia 極為重要，特別請 Parker 今天早上從墨西哥城飛抵溫哥華支援。\n  - Jim Ritchie 提到多年前曾參訪中鋼一貫化煉鋼廠（*integrated mill*）並在中鋼用午餐；早年常去台灣，曾與燁輝（*PT, Prosperity Tieh*）有大量直接往來。\n\n### Chunk 01 (03:00 - 06:00)\n- **主題**：烤漆鋼板採購（韓國 KG Dongbu）、Cascadia 北美產銷噸數、加東與加西市場差異\n- **詳細內容**：\n  - Jim Ritchie 指出對他們而言，競爭永遠在韓國與台灣之間（*for us it's always Korea or Taiwan*）。\n  - Cascadia 購買大量烤漆鋼板（*pre-painted steel*），韓國是全球最大烤漆鋼板生產國，台灣也很優秀。\n  - 中鋼詢問是否向東國製鋼（Dongkuk）購買？Jim Ritchie 表示是向 **Dongbu（東部製鋼，現改名 KG Dongbu / KG Steel）** 採購：「*We are KG Dongbu's largest global customer... largest in the world.*」每年向其採購約 **70,000 噸塗鍍鋼品（coated steel）**，但也笑稱韓國鋼廠很難控制：「*Still very hard to control them though because they're Korean, they just do whatever they want.*」\n  - **Cascadia 鋼材使用量（每月）**：\n    - 溫哥華廠（this plant）：約 **10,000 公噸/月**；\n    - Brandon 廠：接近 **10,000 公噸/月**；\n    - 加拿大全國合計：約 **30,000 公噸/月**；\n    - 美國廠區合計：另約 **10,000 公噸/月**；\n    - 美加總計：每月約 **40,000 公噸**。\n  - 他們是加西遙遙領先的最大鋼捲加工廠（*biggest coil processor in Western Canada by a long shot*）及最大進口商，同時也採購本土鋼材，只要有市佔率機會就會持續擴張。\n  - 談及加拿大東部（Eastern Canada）：文化與加西截然不同，法裔人口多（*a lot of French*）、本土鋼廠多、競爭激烈，對來自加西的 Cascadia 而言較難經營。\n\n### Chunk 02 (06:00 - 09:00)\n- **主題**：加東老舊鋼廠歷史調侃、冷軋（CR）VIP 夥伴關係、對中鋼與 POSCO 的鮮明對比\n- **詳細內容**：\n  - 加東主要鋼廠為 **Dofasco、Stelco、Algoma**，但設備全都非常老舊，不像中鋼（China Steel）擁有最先進的新設備（*state of the art, new everything*）。\n  - Jim Ritchie 開玩笑說加拿大的大問題就是從沒發生過本土戰爭、沒被炸光過（*never had a war, never got everything bombed*），所以設備都 100 年歷史；不像德國或韓國被摧毀後從零重建（如 POSCO 從頭蓋起），才有世界級鋼廠。中鋼則是 1971 年創立。\n  - 貿易商介紹中鋼負責冷軋（Cold Rolled）的 **Vincent**。Vincent 感謝 Cascadia 作為中鋼在加拿大最大的冷軋客戶。\n  - Jim Ritchie 表示他們喜歡採取策略性採購（*we like to be strategic*）：加拿大市場不大，因此他們盡可能把訂單集中在單一供應商，以成為對供應商有份量的客戶。\n  - 稱讚中鋼在台灣的運作模式：每月與盛餘（SYSCO）、裕鐵（YP）等下游聚會並供應熱軋（hot rolled），大家攜手合作。\n  - **批評 POSCO**：直言「中鋼比 POSCO 好打交道太多了，POSCO 真是讓人頭痛（*You're much easier to deal with than POSCO. POSCO is such a headache to deal with.*）」。雖然 Jim Ritchie 會講韓文（開玩笑說自己故意假裝忘記韓文只講英文），但說韓文也沒用，因為 POSCO 內部非常政治化（*very political, lots of politics*），加上 POSCO International 更是糟糕的組織（*terrible organization*）。\n\n### Chunk 03 (09:00 - 12:00)\n- **主題**：中鋼與 POSCO 報價水準、全尺寸客製化價值、韓國 Swire 海運費秘密優勢\n- **詳細內容**：\n  - 中鋼詢問是指價格嗎？Jim Ritchie 表示中鋼與 POSCO 對加拿大市場的報價一向非常接近（*always very similar*），笑稱雙方可能有溝通或有充足市場情報；但他強調：「你們不該賣加拿大太便宜，我們也不希望太便宜，只要有競爭力且穩定的價格即可（*We don't want it too cheap either. We just want a competitive price and steady.*）。」\n  - **核心價值——全尺寸供應（Make Every Size）**：\n    - 「對我們最重要的是你們生產所有尺寸（*What's actually most important to us is that you make every size. That to us is the most valuable.*）。」\n    - 因為 Cascadia 是服務中心（Service Center）而非製造商，必須備齊所有尺寸；特別喜歡中鋼生產的**薄規格寬幅產品（light, wide gauges）**，例如 **1660（16 gauge, 60\" wide）** 與 **1272（12 gauge, 72\" wide）**。\n    - 反觀 POSCO 一旦忙碌起來就不想做這些尺寸，只叫客戶買 10 gauge 48\" wide。Vincent 回應中鋼重視建立長期客戶關係，絕不會為了賺快錢而放棄客戶。\n  - **海運費（Shipping / Freight）差距**：\n    - Jim Ritchie 指出目前唯一希望能改變的是**海運（shipping）**，因為他們從韓國出貨有極大的運費優勢（由 Cascadia 自行安排船運）：\n    - 船公司 **Swire（太古船務）** 負責載運紙漿與紙張（pulp and paper）赴日本與韓國，回程走定期船班（*liner service*，每兩週一班 *every two weeks*）。\n    - Cascadia 向 Swire **保證貨量（guarantee tons，保證每月包下船上 1~2 個船艙 holds）**，因此獲得遠低於現貨市場（*way below spot market*）的特殊運價。\n\n### Chunk 04 (12:00 - 15:00)\n- **主題**：台灣 Saga 航線壟斷與運價差額、對當前市場景氣的隱憂\n- **詳細內容**：\n  - 台灣航線幾乎被 **Saga** 控制（*Saga controls everything out of Taiwan, and Saga is so strong out of Taiwan*），找不到類似 Swire 的協議。\n  - 詢問台灣目前運費：Philip 與貿易商表示最近一批（G2 Ocean）運費為 **$80/噸**（effective rate，無額外燃油附加費，依貨量計）。\n  - Jim Ritchie 表示他們從韓國出貨的運費比台灣便宜約 **$15 ~ $18 美元/噸**。他透露 Cascadia 創業 30 年來的秘密就是談判好運價（維持每噸比別人便宜 $20 美元的優勢，一年半百萬噸下來如同鐵鎚般極具殺傷力）。\n  - **對景氣的看法**：中鋼 Jim 詢問目前生意應該很好？Jim Ritchie 回答：「生意非常好，但我不開心、非常緊張（*Business is really good, but I'm not happy. Very nervous.*）。」\n  - **五大擔憂原因**：\n    1. 討厭目前的關稅壁壘結構（*all the duties*）；\n    2. 加拿大消費者壓力極大（*Canadian consumer is stressed out*），通膨正在系統內累積（*inflation is building in the system*）；\n    3. 油價太高、鋼價太高（認為**目前鋼價比合理水準高出約 30%，\"about 30% too high\"**）；\n    4. 客戶現在是因為「別處買不到（*cannot find it anywhere else*）」才被迫買，而非貨比三家後選擇 Cascadia，這會導致客戶最終心生不滿。\n\n### Chunk 05 (15:00 - 18:00)\n- **主題**：北美製造業失去出口競爭力、AI 資料中心熱潮的可持續性、全球鋼價排名\n- **詳細內容**：\n  - 擔憂北美失去全球競爭力：美國鋼價這麼高，Caterpillar（卡特彼勒）做的怪手（backhoe）怎麼可能跟中國製造商競爭出口？\n  - 目前榮景全靠為 **AI 資料中心（data centers）** 建造風機與基建支撐，一旦資料中心建設潮結束該怎麼辦？\n  - 質疑行情的「**可持續性（sustainable）**」：一生中從未見過這種高價市場能維持好幾年，必定會出現**黑天鵝（Black Swan）**，例如金融危機或**油價飆到每桶 $140 美元**（歷史上油價只要碰到 $140 必出大事）；與會歐洲夥伴也補充，若 Nvidia 今晚宣布推出算力 10 倍、耗電僅一半的新晶片，整個熱潮就會瞬間終結。\n  - 調侃美國人比台灣人還害怕中國（只要中國出新記憶體晶片，Micron 就大跌，因為中國做電池、鋼鐵、手機都能做得更便宜）。表示若好景氣能維持到 **2027 年** 他就會非常開心了。\n  - **全球鋼價排名**：美國是全球第一高，**加拿大鋼價是全球第二高（second highest prices in the world）**，再來才是歐洲與亞洲。\n\n### Chunk 06 (18:00 - 21:00)\n- **主題**：Stelco 停產鍍鋅與冷軋造成每月 3~3.5 萬噸缺口、台灣 GI 反傾銷稅率與塗油鍍鋅豁免探討\n- **詳細內容**：\n  - 調侃即便加拿大鋼價全球第二高，川普（Donald Trump）依然不開心（除非川普退休他才會開心）。\n  - **重大商情——Stelco 停產鍍鋅與冷軋**：\n    - 短期內進口需求將變得更強（*import is going to get even stronger*），因為 **Stelco 已停止在加拿大生產鍍鋅與冷軋（stopped making galvanized and cold rolled in Canada）**！\n    - 這造成加拿大內銷市場每月減少 **30,000 ~ 35,000 公噸** 供給，現在市場嚴重缺貨，安大略省買家（如 **Optima**）已開始向越南大舉下單採購塗鍍鋼材。\n  - **台灣供應商產能與反傾銷稅率（AD Duty）**：\n    - 中鋼 Jim 建議可向台灣裕鐵（YP）多買 GI，中鋼可支援熱軋底材；但眾人指出 **YP（裕鐵）目前沒產能/缺料（no capacity）**，且 **PT（燁輝）也已賣光（sold out）**。\n    - 討論能否直接向中鋼買鍍鋅（由中鋼另一部門 **Roland** 團隊負責）：貿易商指出中鋼在加拿大屬於「All Others」稅率，高達 **33% ~ 34% AD duty**（相較之下 YP 僅 3.2%、PT 鍍鋁鋅約 10%）。\n    - **塗油鍍鋅（Oiled Galvanized / Galvalume）豁免方案**：貿易商指出「塗油鍍鋅」在加拿大反傾銷稅中是**排除豁免的（excluded from the AD）**！在安大略省已有透過 Taylor 賣給游泳池牆板廠（swimming pool walls）後續烤漆的實績。Jim Ritchie 詢問同事 **Mark** 能否讓車庫門客戶 **Flexi-Force** 或 **Assa Abloy** 使用塗油鍍鋅再脫脂（degrease），但評估目前加西廠區暫無此設備或需求。\n  - **Cascadia 目前 GI 採購來源**：越南（Vietnam）、韓國（Korea）、澳洲（BlueScope Australia）。\n\n### Chunk 07 (21:00 - 24:00)\n- **主題**：10 Gauge 厚板 GI/GA 不計代價急迫採購、最愛採購國排名、鋁材進口\n- **詳細內容**：\n  - 補充若有貨源也會買 POSCO Thailand（浦項泰國廠）。\n  - **最急迫採購需求——10 Gauge GI & GA**：\n    - Jim Ritchie 強調：「我們隨時都在找 **10 Gauge（厚度 0.13 吋 / 約 3.3~3.4 mm，48\" 及 60\" 寬）的 Galvanneal（GA）與 Galvanized（GI）**。如果你們有任何貨源，**不管價格多少我們都買（It doesn't matter what the price is, we'll just buy it）**！」\n    - 原因：加拿大嚴重短缺，本土僅 **ArcelorMittal** 一家能做，且對 Cascadia 實施嚴格配額限制（on allocation）。\n    - （中鋼團隊現場以中文低聲確認：0.13 吋乘 25.4 約 3.3~3.4 mm，屬正常厚板規格，中鋼可做到 3.4 mm）。\n  - **最喜愛採購國家排名**：第 1、2 名是**台灣與韓國**（最容易做生意），第 3 名是**越南**（Formosa Ha Tinh 台塑河靜、Hoa Phat 和發）。評論越南鋼廠非常激進（導致高反傾銷稅），品質雖不如中鋼或 POSCO，但尚可接受（*not as good as China Steel or POSCO, but it's okay*）。\n  - 中鋼 Jim 說明台灣因對中國等課徵反傾銷稅，政府要求中鋼優先滿足台灣國內下游（讓下游有競爭力外銷）。\n  - **其他產品需求**：重申 **Galvanized 與 Galvanneal 是最大需求項目**；烤漆（pre-paint）則會繼續留在韓國。此外也大量進口**鋁材（Aluminum，因加拿大無平軋鋁廠，仍從中國進口並享特定關稅豁免 company-specific remissions）**與**不鏽鋼（Stainless Steel）**。\n\n### Chunk 08 (24:00 - 27:00)\n- **主題**：台灣不鏽鋼採購、本土鋼廠配額現況、與 Stelco 及 ArcelorMittal 的尖銳對立\n- **詳細內容**：\n  - 不鏽鋼採購自台灣 **YUSCO（燁聯）**、唐榮（Tang Eng）、華新麗華（Walsin）等。\n  - **本土鋼廠配額**：目前每月僅從 **Stelco** 拿到 **3,000 噸熱軋（HR）**，從 **Algoma** 拿到 **500 噸**（Algoma 稱新年會增產）。\n  - **與加拿大本土鋼廠的恩怨**：\n    - 加拿大本土鋼廠非常討厭 Cascadia，因為 Cascadia 進口量龐大，且 Jim Ritchie 常接受報紙採訪公開批評本土鋼廠（受保護、老舊、位於加東），其他加拿大服務中心都不敢吭聲，只有他自己當老闆沒上司管（笑稱哪天可能被抓去關塔那摩灣 Guantanamo Bay）。\n    - **Stelco 與 ArcelorMittal 的報復手段**（因 Cascadia 去加拿大國際貿易法庭 CITT 作證反對他們；唯獨 Algoma 態度不同未報復）：\n      1. 故意賣給 Cascadia 下游小型終端客戶比賣給 Cascadia **便宜 $100/噸** 的價格；\n      2. 削減配額時，砍 Cascadia 砍得最重，想方設法傷害 Cascadia。\n\n### Chunk 09 (27:00 - 30:00)\n- **主題**：向客戶回購 ArcelorMittal 鋼材竟更便宜、亞伯達省公投、年繳逾 2,500 萬美元關稅\n- **詳細內容**：\n  - Jim Ritchie 透露：Cascadia 的客戶向 ArcelorMittal 買鋼材再轉賣給 Cascadia，**價格竟然比 Cascadia 直接向 ArcelorMittal 買還便宜**！他當面告訴 ArcelorMittal：「我不喜歡你們，若靠你們供貨我們早就破產了，但儘管你們是最爛的供應商，我們依然做得極好！」\n  - 批評 ArcelorMittal 是外資公司，加拿大聯邦政府卻拿加西納稅人的錢去保護與補貼加東鋼廠（且從漢密爾頓 Hamilton 運到加西的**內陸運費高達 $100 美元/噸以上**），加東鋼廠拿了補貼卻不供應加西市場——這正是加拿大東西部嚴重分裂、甚至**當天（2026年10月19日）亞伯達省（Alberta）舉行公投（referendum）**的原因！\n  - **關稅支出**：Cascadia 今年支付的關稅比誰都多，光是「非預期內」額外繳交的關稅就超過 **2,500 萬美元（more than $25 million in tariffs）**。大家開玩笑說政府收這麼多錢乾脆買下 Stelco，Jim Ritchie 笑說：「**中鋼應該去把 Stelco 買下來（China Steel should buy Stelco），我一定當你們的客戶！**」\n\n### Chunk 10 (30:00 - 33:00)\n- **主題**：盛讚中鋼台灣產業生態系典範 vs. 加拿大外資鋼廠抽血、熱軋反傾銷風險評估\n- **詳細內容**：\n  - **高度肯定中鋼模式**：Jim Ritchie 指出，中鋼在台灣雖享有特殊地位，但作為回報，中鋼具備**世界級競爭力（world-class competitive）**，並全力支持盛餘（SYSCO）、裕鐵（YP）、燁輝（PT）等下游，**讓整個台灣鋼鐵生態系（entire ecosystem）具備世界競爭力**。\n  - **批判加拿大外資鋼廠**：加拿大給予本土鋼廠同等保護，但三大鋼廠全被外資收購且對本土毫無貢獻，把錢全匯出國外給股東、完全不重新投資：\n    - **Stelco**：由美國 **Cleveland-Cliffs** 持有；\n    - **Algoma**：由**美國私募股權/對沖基金（American private equity / hedge fund）**持有；\n    - **ArcelorMittal Dofasco**：由**英國/印度財團（UK-Indian company）**持有。\n  - **太平洋航線與反傾銷（AD）評估**：\n    - 好消息是正因本土鋼廠太差，加拿大永遠需要進口，且**太平洋是全球最便宜的高速公路**。\n    - 中鋼詢問本土鋼廠是否可能對熱軋（HR）等提起反傾銷訴訟？貿易商與 Jim Ritchie 一致認為：**目前完全不可能證明反傾銷產業損害（no injury / no damage）**，因為本土鋼廠正在暴賺、價格極高且市場嚴重缺貨（shortage）。\n    - 此外，全面高關稅（high tariff）比反傾銷對本土鋼廠更有利（反傾銷耗時且花律師費，買家還能換國別買；全面關稅則是墊高所有進口價）。舉例美國近期對韓國 Dongbu（20%）、Dongkuk（28%）及台灣盛餘 SYSCO（20%）祭出初裁稅率，結果大家只慌了一週，美國市場價格隨即直接上漲 20% 轉嫁。\n\n### Chunk 11 (33:00 - 36:00)\n- **主題**：Cascadia「4~5 個月高庫存」秘密武器與私人企業經營哲學\n- **詳細內容**：\n  - 談及市場循環：鋼價下跌永遠比上漲快。Cascadia 因庫存龐大，在多頭市場賺得比多數人多，在空頭市場則會跌得更痛（一旦反轉他就直接砍價認賠、快速出清重來）。\n  - **庫存水位（4 ~ 5 個月）**：\n    - 回應中鋼女性同仁提問：Cascadia 常態維持 **4 到 5 個月（4 to 5 months）** 的庫存與在途訂單。\n    - 這是 Cascadia 的**秘密武器（secret weapon）**：上市公開發行公司（如 **Russel Metals**）只關注資本投資報酬率（ROI，例如拿 1,000 萬美元資本要求 15% 回報賺 150 萬美元即可），不敢抱大庫存；而 Cascadia 不看 ROI，專注於**充分供應市場（supplying the market）**。\n    - 在今年充滿關稅與政策不確定性的市場衝擊下，所有尋求「確定性（certainty）」的客戶都湧向 Cascadia——他形容自己就像在焦慮市場中販售「**療癒美食（comfort food）**」，甚至其他同業服務中心（如 Terra Nova 透露今年其最大客戶就是 Russel Metals）也必須向有現貨的人調貨。\n\n### Chunk 12 (36:00 - 39:00)\n- **主題**：最大下游客戶群（AI 資料中心）、免關稅輸美通道與「中國廢鋁變美國製造」奇聞\n- **詳細內容**：\n  - 回應中鋼女性同仁提問下游客戶產業：目前表現最好、最大的客戶群是「非買鋼不可」的 **AI 資料中心（Data Centers）**！\n  - **資料中心免稅輸美內幕**：許多美國企業在加拿大設廠製造資料中心設備，使用來自全球的鋼材與全球的銅線，但在加拿大製成資料中心設備模組運往美國時，**進入美國完全免關稅（going into the US duty-free, zero duty）**！業界對此都非常低調（「Don't ask」）。\n  - **廢鋁（Scrap Aluminum）免稅輸美趣聞**：\n    - 6~8 個月前美國鋁價飆漲，Cascadia 正常鋁材賣 **$2.75/磅**，手頭有大批中國進口次級鋁材（secondary aluminum）想賣 **$2.60/磅**。\n    - 結果廢五金回收商（scrap dealer）上門以 **$2.95/磅** 收購所有鋁材當廢鋁！因為**廢鋁進美國完全免關稅（duty-free）**，運到美國波特蘭（Portland）熔掉重鑄後，中國鋁材就直接變成「美國製造（Made in the USA）」！Cascadia 當場把所有次級鋁材全數高價賣光。\n\n### Chunk 13 (39:00 - 42:00)\n- **主題**：資料中心兩大主力客戶（Johnson Controls 與 IEM / Amazon）及供應鏈缺工缺料瓶頸\n- **詳細內容**：\n  - **主力客戶一：Johnson Controls（江森自控）**：\n    - 製造資料中心專用的大型冷卻風扇機房（*great big rooms with fans in them that cool air*），內含大量電子設備。\n    - Cascadia 供應其外殼鋼板與地板鋁材（與 **Varsteel** 共享客戶，Varsteel 供應熱軋、鋼管與型鋼）。\n    - Johnson Controls 在**艾德蒙頓（Edmonton）擁有 13 座工廠、約 2,000 名員工**，**Cascadia 每月賣給他們超過 3,000 公噸（more than 3,000 tons a month）**！\n  - **主力客戶二：IEM（Industrial Electric Mfg，中鋼冷軋 CR 的主要去向）**：\n    - **Cascadia 採購的中鋼冷軋（Cold Rolled）有極大比例流向 IEM**！\n    - IEM 製造資料中心的配電開關箱/配電盤（*switchboxes / busbar / switching gear*），目前為 **Amazon** 製造的新型開關箱「**大得像一棟房子（as big as a house）**」。\n  - **預測與供應鏈瓶頸**：\n    - 6 個月前客戶曾喊出業務要翻四倍（quadruple），Cascadia 備妥大量鋼材，但客戶卻買不到風扇（fans）與其他零組件，加上**嚴重缺工（not enough labor）**，導致做好的機房外殼全堆在田裡等零件。\n    - Amazon 因此將原本集中在 1~2 家的訂單拆給多家代工廠（指定風扇與開關設備供應商，但未指定鋼材），目前 Cascadia 同時供應 **3 ~ 4 家** 幫 Amazon 代工相同產品的廠商。\n\n### Chunk 14 (42:00 - 45:00)\n- **主題**：會後午餐安排、越南回溯關稅訴訟、美國 Nucor / Big River / Dofasco 強硬漲價\n- **詳細內容**：\n  - Jim Ritchie 因故無法參加午餐，指派 **Mark** 與 **Amy** 代表出席。\n  - 與 **Cellmark** 代表敘舊（回憶 10 年前馬來西亞反規避案時曾買過一部分鍍鋅，後鋼價大跌 50%），並提及 COVID 期間自越南進口 50,000 噸塗鍍鋼材遭加拿大政府事後回溯課稅（retroactive duty），目前仍在打官司。\n  - **美國市場與鋼廠霸王條款**：\n    - 中鋼熱軋因反傾銷稅未銷美，冷軋則有報給 Cascadia 美國廠的 **Danny**；但 Jim Ritchie 指出 Danny 明年最缺的是**鍍鋅（Galvanized）**。\n    - 美國 **Nucor** 與 **Big River Steel** 提出極為強硬的明年度合約條件：往年合約為 **CRU 指數減 5.5% 折扣（CRU minus 5.5%）**，明年改為 **0 折扣（no CRU minus, no discount）**，且**無數量緩衝（no buffer）**，每月承諾噸數必須一噸不差照買！\n    - Nucor 在會議當天（週一）又再度漲價（幾乎每週一都在漲）；貿易商補充 **Dofasco** 當天也宣布調漲：**熱軋（HR）漲 $5/噸、冷軋（CR）與鍍鋅（GI）漲 $10/噸**。\n\n### Chunk 15 (45:00 - 48:00)\n- **主題**：本土鋼廠如培養皿細菌、Big River 創辦人擬於亞伯達省建電爐廠、台韓設廠地理優勢\n- **詳細內容**：\n  - Jim Ritchie 形容貪婪的本土鋼廠就像「**培養皿裡的細菌（bacteria in a Petri dish）**」，無止境擴張漲價直到把養分吃光，然後徹底崩潰（collapse），直言對加拿大鋼鐵業感到羞恥，笑稱若年輕 20 歲且有幾十億美元真想自己蓋鋼廠。\n  - **重要市場情報——Alberta 新建電爐廠計畫**：\n    - 貿易商向 Jim Ritchie 推薦認識 **Dave Stickler**（美國 **Big River Steel** 創辦人，剛在阿肯色州建了年產 50 萬噸的 Hybar 鋼筋廠，與 LMS 的 Ron 很熟）。\n    - 透露 **Dave Stickler 正認真考慮在亞伯達省（Alberta）興建一座電弧爐（EAF）鋼廠**（初期可能從 50 萬噸鋼筋廠起步，但有 EAF 就能進一步延伸冷軋與鍍鋅）。\n  - **地理環境比較**：Jim Ritchie 分析加拿大內陸太廣、海岸線有限、人口少且缺廢鋼（scrap），其實沒有適合蓋鋼廠的地點；反觀**台灣（島嶼）與韓國（半島）四面環海，任何靠海處都能蓋鋼廠，是全球最完美的鋼廠地理環境**。\n\n### Chunk 16 (48:00 - 50:32)\n- **主題**：駁斥「國家安全」保護主義、原物料「以噸易噸」構想、會議結束\n- **詳細內容**：\n  - 駁斥加拿大政府以「國家安全（national security）」為由保護鋼廠：他認為無能的外資本土鋼廠才是國家安全的威脅；為了國家安全反而應該進口鋼材。\n  - 提出「以噸易噸（ton for ton）」資源交換構想：加拿大擁有鐵礦砂（iron ore）、焦煤（coking coal）、銅、鋅等所有天然資源，若夠聰明應直接要求中國等低成本產鋼國高價購買加拿大原物料，加拿大則買回便宜優質的鋼材（把污染留在國外），讓加拿大本土製造業全面繁榮；等老舊鋼廠自然淘汰、20~30 年後綠鋼（Green Steel）等新技術成熟再重新投資（無奈政客只關心明年的選票）。\n  - 雙方互道感謝（*Thanks for your time, nice meeting you guys*），會議圓滿結束。\n", "docx_b64": "UEsDBBQAAAAIAPhQVV0xpqS4/gAAADoCAAATAAAAW0NvbnRlbnRfVHlwZXNdLnhtbK2RzU7DMBCE730Ky9cqceCAEIrTAz9H4FAeYGVvEgv/yeuW5u1xGigSoogDR2vmmxmt283BWbbHRCZ4yS/qhjP0KmjjB8lftg/VNWeUwWuwwaPkExLfdKt2O0UkVmBPko85xxshSI3ogOoQ0RelD8lBLs80iAjqFQYUl01zJVTwGX2u8pzBuxVj7R32sLOZ3R+KsmxJaImz28U710kOMVqjIBdd7L3+VlR9lNSFPHpoNJHWxcDFuZJZPN/xhT6VEyWjkT1Dyo/gilG8haSFDmrnClz/nvTD2tD3RuGJn9NiCgqJyu2drU+KA+PXf5hCebJI/z9kyf1c0Irj13fvUEsDBBQAAAAIAPhQVV0gG4bqsgAAAC4BAAALAAAAX3JlbHMvLnJlbHONz7sOgjAUBuCdp2jOLgUHYwyFxZiwGnyApj2URnpJWy+8vR0cxDg4ntt38jfd08zkjiFqZxnUZQUErXBSW8XgMpw2eyAxcSv57CwyWDBC1xbNGWee8k2ctI8kIzYymFLyB0qjmNDwWDqPNk9GFwxPuQyKei6uXCHdVtWOhk8D2oKQFUt6ySD0sgYyLB7/4d04aoFHJ24Gbfrx5WsjyzwoTAweLkgq3+0ys0BzSrqK2b4AUEsDBBQAAAAIAPhQVV2DSVCfsAAAAB8BAAAcAAAAd29yZC9fcmVscy9kb2N1bWVudC54bWwucmVsc42PzQrCMBCE732KZe82rQcRadqLCL1KfYCQbn8wTUI2in17A14sePA4DPMNX9W8FgNPCjw7K7HMCwSy2vWzHSXeusvuiMBR2V4ZZ0niSoxNnVVXMiqmDU+zZ0gQyxKnGP1JCNYTLYpz58mmZnBhUTHFMAqv9F2NJPZFcRDhm4F1B t)", "short_title": "01. 結構化重點報告", "badge": "精華推薦", "filename": "20261021_0909_Price_Steel_Meeting_Report", "rel_dir": "20261021_0909_price_steel", "content": "# 2026年10月21日 Price Steel 拜訪會議結構化報告與重點資料庫\n\n> **用途說明**：本檔案為結構化整理之會議重點、量化數據表格、成本與價差拆解、貿易政策情報與行動項目，搭配同目錄下之 `20261021_0909_02_price_steel_audio_report.md`（完整音訊解析報告）與 `20261021_0909_03_price_steel_raw_notes.md`（未刪減逐段對話底稿），可隨時依需求快速轉換或匯出為「中鋼出國訪廠正式報告」、「純英文會議紀要 (Minutes of Meeting)」、「主管簡報摘要」或「議題追蹤表」。\n\n---\n\n## 一、會議基本資料 (Meeting Metadata)\n- **會議日期**：2026 年 10 月 21 日 09:09 – 10:31 MDT（總時長 1 小時 22 分 29 秒）\n- **拜訪對象**：**Price Steel**（加拿大亞伯達省愛德蒙頓 Edmonton 大型獨立鋼材服務中心與庫存分銷商）\n- **客戶代表**：\n  - **Dwayne**（負責人 / 業務與採購決策主管；辦公室駐廠決策迅速，不受上市連鎖同業 3 個月庫存上限束縛）\n  - **Rod**（資深採購主管，到職約 7.5 年，具深厚儲油槽鋼板 Tank Shell Plates 與儲槽銷售背景）\n- **陪同貿易商（Salzgitter Mannesmann International）**：\n  - **Jonty / Jeff / Phillip**（Salzgitter 加拿大代表，熟悉美加反傾銷 Normal Value、TRQ 配額談判內幕、西岸碼頭與內陸物流成本，並參與 APVMA 及渥太華進口商遊說）\n  - **Fiona**（Salzgitter 台北辦公室總經理，團隊 3 人，負責台灣每年逾 **40 萬噸** 鋼材出口業務，使台灣成為 Salzgitter 全球僅次於中國之**第二大採購來源國**）\n- **我方代表（CSC / 中鋼集團）**：\n  - **Jim / Paul**（熱軋部門銷售處長，負責熱軋鋼捲 HRC、熱軋鋼板 HRP 外銷及中龍鋼鐵型鋼業務；其中中鋼鋼板外銷約佔 Salzgitter 台灣採購量之 10% 即 **40,000 噸/年**）\n  - **陳博士（Dr. Chen / Delphic）**（技術部門鋼板專家，負責 44W、Cat 4、350AT Cat 3 橋樑板、A514 直接淬火合金鋼板及本次 API 650 Class 3 規範評估）\n  - **Mr. Parker**（駐墨西哥城辦事處技術銷售代表，負責鋼捲與鋼板技術支援）\n  - **Vicky & Eva**（營業行銷部門貿易法規專家，負責反傾銷 Anti-Dumping、正常價值 Normal Values、TRQ 配額與進口許可證議題，與台灣政府及加拿大 CBSA 密切聯繫）\n\n---\n\n## 二、核心商情與關鍵量化數據總表 (Key Quantitative Data)\n\n| 類別 | 項目 | 數據 / 規格 | 備註說明 |\n| :--- | :--- | :--- | :--- |\n| **核心技術訴求** | **四合一多重認證鋼板 (Quad Grade)** | **CSA G40.21 38W / 44W + ASTM A36 + ASME SA36 + API 650 Class 3** | **全場第一要務 (#1 Takeaway)**：要求直接印於 **MTR 材質證明書**（如 `API 650 Class 3 compliant`）並**噴印 (Stencil)** 於鋼板上，不接受單獨符合性聲明書；Algoma、Oregon Steel、Hyundai 皆免費提供不加價 |\n| **儲槽市場規模** | 加西常壓儲油槽鋼板年需求 | **≥ 30,000 公噸 / 年** | 用於直徑 200 ft、高 30–50 ft（3–5 層 8'–10' 寬鋼板焊接）之大型常壓儲油槽（如 Edmonton 東側 Henday 與 Burnaby 儲槽區） |\n| **重大基建商機** | **「Pacific Link」新 噸 / 年**（中鋼鋼板外銷佔約 **40,000 噸 / 10%**） | 台灣已成為 Salzgitter 全球**第二大採購來源國**（僅次於中國） |\n\n---\n\n## 三、核心議題深度解析\n\n### 1. 第一要務：將 `API 650 Class 3` 納入四合一多重認證鋼板 (Quad Grade)\n- **客戶核心訴求**：\n  - Price Steel 作為大型庫存商，為避免同尺寸備貨多套庫存，要求將常壓儲油槽建造規範 **API 650 Class 3** 納入既有結構鋼板，組成 **「四合一多重認證鋼種 (Quad Grade)」**：**`CSA G40.21 38W / 44W + ASTM A36 + ASME SA36 + API 650 Class 3`**。\n  - 韓國 **Hyundai Steel（現代製鐵）**、加拿大 **Algoma** 與美國 **Oregon Steel** 過去 4–5 年皆已免費提供此四合一認證，不收額外加價。\n- **MTR 標示方式與法規責任解套**：\n  - **拒絕單獨聲明書**：貿易商原提議開立獨立的「符合性聲明書（Letter of Conformance）」，遭客戶當場否決，堅持必須**直接印在 MTR 材質證明書上**並**噴印（Stencil）於鋼板**。\n  - **解套標示法（參考韓國東國製鋼 Dongkuk）**：由於 API 650 屬於下游儲槽建造與焊接規範（類似管線建造規範 CSA Z662 或抗酸規範 NACE MR0175），為避免煉鋼廠承擔下游施工焊接之產品責任（Fit for Purpose / Liability），建議參考東國製鋼作法，無須更改煉鋼化學成分（44W 銅、硫含量完全相容），只需於 MTR 註明 **`\"This steel is compliant with (or suitable for) API 650 Class 3\"`**。\n  - **後續配合**：Price Steel 承諾於會議當日下午提供 **Hyundai 與 Algoma 之 MTR 樣本** 及所需尺寸明細，Salzgitter 亦將提供 API 650 規範文本供中鋼內部評估（Internal Study）。\n\n### 2. 中鋼產品組合差異化優勢（薄寬板 `1/4\" × 10'`、Cat 4、全尺寸整包供應）\n- **1/4\" × 10' (6.35mm × 120\") 薄規格寬板獨佔優勢**：\n  - 大型常壓儲油槽（直徑 200 ft、高 30–50 ft）隨高度遞減厚度，上部壁板、頂板與底板大量使用 **1/4\"、5/16\"、3/8\" × 10 ft (120\") 寬板**。目前多數鋼廠不願軋製 `1/4\" × 10'`，中鋼具備此能力且競爭對手極少。\n- **唯一能供應 Cat 4 的海外鋼廠**：\n  - Dwayne 指出，除加拿大本土鋼廠外，**中鋼是他所知唯一能供應 CSA G40.21 Cat 4（低溫衝擊結構鋼板）的海外鋼廠**；且過去受制於 CBSA 高 Normal Value 的問題現已改善，重獲報價競爭力。\n- **淘汰對手、實現「一站式整包採購 (Whole Package)」**：\n  - 澳洲 **BlueScope** 厚度僅從 **3/8\"** 起跳，**馬來西亞鋼廠** 寬度僅達 **96\"**（無 120\"），韓國 **東國製鋼 (Dongkuk)** 在 A516-70 雖有價格優勢但因扁鋼胚供應商日本 **JFE** 過去 6–8 個月接連發生火災與水災導致薄板溢價極高；韓國 **Hyundai** 則近期鋼板報價極不具競爭力且配額超賣。\n  - 只要中鋼報價與對手差距在 **$1~$3/MT** 內（不超過 3%~5%），Price Steel 傾向不拆單、整包交由中鋼供應。\n\n### 3. 熱軋鋼捲代工開平剪板 (Cut-to-Length) 與花紋鋼板 (Floor Plate) 商機探討\n- **台灣 72\" 鋼捲開平剪板之防潮包裝瓶頸**：\n  - 客戶詢問在台灣將中鋼熱軋鋼捲（最寬 72\"，與墨西哥 Ternium 相同）開平切板出口之可行性。Salzgitter 台北總經理 Fiona 與中鋼團隊指出，台灣本地裁剪廠僅能打捆上木棧板（banded on skids），**缺乏外銷多層防水防潮包覆（wrapping）**，遇颱風季海運極易生鏽；若能解決外銷防水包裝問題則具實際需求。至於 **96\" 寬捲切板** 則可評估歐洲 ArcelorMittal Bremen 或阿爾及利亞/土耳其 Tosyali（Salzgitter 德國同事 Björn 預計 11 月底來訪跟進）。\n- **花紋鋼板 (Floor Plate / Checker Plate)**：\n  - 中鋼本廠不生產；關係企業 **中鴻鋼鐵 (Chung Hung)** 先前停產但正評估重啟（中鋼 Paul 將回台確認中鴻與東鋼狀況）。另 Salzgitter 代理日本 **東京製鐵 (Tokyo Steel)** 花紋鋼捲（最寬 60\"），可評估運至溫哥華交由本地 **Tidy Steel** 開平整平（leveled plate）。\n\n### 4. 渥太華 TRQ 政令內幕、美加鋼市結構與低碳綠鋼 (Green Steel) 展望\n- **渥太華 TRQ 獨家內幕與 1 月 1 日新制預判**：\n  - 貿易商揭露，美加貿易談判破局當天，直通加拿大財政部長辦公室之消息人士（Gabe）已完成原定隔日發布之文稿：加拿大為向美國讓步（換取美國將 50% 關稅降至可管理的 **20%**），準備**全面取消非 FTA 國家（含台灣）之 TRQ 免稅配額，並將 FTA 國家配額由 75% 砍至 50%**。\n  - 雙方一致認為，若 **1 月 1 日** 直接廢除 TRQ 改課全面固定關稅，對所有進口商與服務中心而言反而立足點一致、更好做生意，無須再猜忌競爭對手（如在加西擁有 5 個分部據點的 **Varsteel**）是否握有免稅許可（Permit）。\n- **進口加工鋼結構件 (Fabricated Steel) 雙重防線**：\n  - 目前加拿大對進口加工鋼結構設有 **25% 鋼鐵衍生品附加稅（Steel Derivative Surtax）** 及針對韓、西、英、中之**加工鋼反傾銷稅**，大型預製模組直接進口已大幅減少。\n- **低碳綠鋼 (Green Steel / EAF) 要求現況**：\n  - 回應中鋼提問：目前加西市場對低碳綠鋼**完全無強制法規要求**（僅少數專案要求提供再生廢鋼含量證明信 Recycled content），且因 Algoma 轉型 EAF 產線瓶頸嚴重，未來 **12 個月內絕不會發生**。但長期而言，因加拿大政府已補助數十億加幣協助鋼廠轉型 EAF，未來勢必從聯邦、省級與市政公共工程開始強制要求採用綠鋼（目前進度落後歐洲 CBAM 數年）。\n- **Price Steel 庫存现況與鋼板成長空間**：\n  - 由於老闆 Dwayne 駐廠直接拍板，不受「地面庫存不超過 3 個月」限制，已於 5–6 個月前低價建倉；惟**目前在鋼板（Plate）庫存並未滿載**，搭配兩年前新設之最先進電漿切割機（Plasma Table），鋼板正是其接下來最大的採購成長重點。\n\n---\n\n## 四、後續行動項目 (Action Items)\n1. **Price Steel (Rod & Dwayne)**：於會議當日下午提供 **Hyundai 與 Algoma 之四合一規格 MTR 材質證明書樣本** 及所需鋼板尺寸規格明細。\n2. **Salzgitter (Jonty / Jeff)**：提供 **API 650 Class 3** 規範文件予中鋼團隊，並於 11 月底安排德國同事 Björn 訪加跟進 96\" 剪板方案。\n3. **中鋼技術與業務團隊 (Delphic & Jim/Paul)**：\n   - 針對將 **`API 650 Class 3 compliant`** 納入 `CSA G40.21 38W/44W + A36 + SA36` 四合一 MTR 及鋼板噴印進行內部評估（Internal Study）。\n   - 回台向 **中鴻鋼鐵 (Chung Hung)** 確認花紋鋼板（Floor Plate / Checker Plate）重啟生產進度，並由 Salzgitter 台北辦公室（Fiona）協助評估台灣 72\" 鋼捲開平切板之外銷多層防潮包裝可行性。\n   - **Vicky & Eva（營業行銷部）**：結合本次收集之加西最新出廠價（HRC CAD $85/cwt）與溫哥華至愛德蒙頓內陸接駁成本（CAD $185–$195/MT），評估中鋼各項鋼板（如 Cat 4、44W、A516-70）之 CBSA Normal Value 與到廠價差緩衝（Cushion）競爭力。\n", "docx_b64": "UEsDBBQAAAAIAPhQVV0xpqS4/gAAADoCAAATAAAAW0NvbnRlbnRfVHlwZXNdLnhtbK2RzU7DMBCE730Ky9cqceCAEIrTAz9H4FAeYGVvEgv/yeuW5u
