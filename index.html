n\n\n---\n\n## 與會人員識別 (Speaker Identification)\n\n- **Price Steel 團隊 (買方 / 加拿大西岸大型鋼材服務中心與庫存商，位於亞伯達省愛德蒙頓 Edmonton)**：\n  - **Rod**：Price Steel 資深採購/管理階層（到職約 7.5 年，過去背景為儲槽鋼板 tank shell plates 與儲槽銷售，主動提出 API 650 Class 3 規範需求與 30,000 噸市場規模估算）。\n  - **Dwayne**：Price Steel 採購/業務主管（熟悉儲槽工程應用、愛德蒙頓東側 Henday 與 Sherwood Park 儲槽群，堅持要求鋼廠在 MTR 材質證明書及鋼板噴印 stencil 上直接標註 API 650，反對僅開立符合性聲明書 Letter of Compliance）。\n- **Salzgitter Mannesmann International (貿易商 / 代理商)**：\n  - **Phillip (\"Phil\" / \"Jocky\")**：Salzgitter 加拿大代表，負責主持開場介紹中鋼（CSC）龐大代表團，居中協調中鋼與 Price Steel 針對 API 650 Class 3 與 MTR 標註方式的技術與法規責任討論。\n- **CSC 中國鋼鐵團隊 (賣方 / 台灣中鋼)**：\n  - **Jim**：中鋼熱軋部門銷售處長 / 資深銷售主管（Sales Manager / Senior Sales Director, Hot Rolled Department），日常主要負責熱軋鋼捲（Hot Rolled Coil），此次出訪亦涵蓋熱軋鋼板（Hot Rolled Plate）及中鋼全系列產品。\n  - **Delphic**：中鋼技術部門代表，主要負責鋼板技術規範（Plate Specialist）。\n  - **Vicky & Eva**：中鋼營業行銷部門（CSC Marketing Department）代表，負責所有貿易救濟與關稅議題（Trade Issues：反傾銷 Anti-Dumping、正常價格 Normal Values、配額關稅 TRQ、進口許可證 Permit 等，與台灣政府及加拿大邊境服務署 CBSA 保持密切溝通）。\n  - **Parker**：隨行成員（於開場換名片與排座位時出現）。\n\n---\n\n## Chunk 00 (00:00 – 03:00)：破冰寒暄、交換名片與中鋼代表團成員介紹 (一)\n\n### 1. 開場寒暄、交換名片與座位安排 (00:00 – 01:36)\n- **天氣與服裝破冰**：與會者剛進入會議室，開玩笑談論穿著薄 T 恤與夏威夷衫（Hawaiian shirt / Coolmax），對比其他人穿著厚大衣（big coats）。\n- **交換名片與認人**：\n  - Price Steel 人員與中鋼團隊逐一握手、發放名片（*\"Don't screw up my cards here... Delphic, okay, perfect, nice to meet you as well.\"*）。\n  - 現場一度把 Eva 和 Vicky 的名字搞混（*\"Oh, I got Eva and Vicky confused.\"*），大家笑稱代表團陣容龐大（*\"Big delegation.\"*）。\n  - Phillip 表示等大家坐定後，會說明為何這次中鋼代表團陣容如此龐大（*\"There's good reason, I'll explain the reason why... when you've got everybody in order.\"*）。\n  - 現場調整椅子與空間（*\"Take one out if it doesn't fit... we've got plenty of chairs.\"*），中鋼團隊內部以中文簡短確認座位與投影需求：「都可以啊」、「我們也不用 present 給他們看」。\n  - Phillip 等待 Rod 回到會議室後正式開始介紹（*\"Yeah, I'll wait for Rod to come back in.\"*）。\n\n### 2. 介紹中鋼行銷部門貿易法規專家：Vicky 與 Eva (01:36 – 03:00)\n- **致謝與開場**：Phillip 感謝 Price Steel 容納這麼多人的訪問團（*\"Really appreciate you accommodating us, so many of us... there's good reason why the delegation is so big.\"*）。\n- **Vicky 與 Eva 的職責（貿易救濟、反傾銷 Normal Value 與 TRQ）**：\n  - Phillip 介紹 Vicky 與 Eva 來自中鋼行銷部門（CSC Marketing Department），專門負責所有貿易法規與關稅問題（*\"They're responsible for all the trade issues.\"*）。\n  - **反傾銷與正常價格 (Anti-Dumping & Normal Values)**：Phillip 指出，眾所周知中鋼受到加拿大反傾銷裁定約束，但中鋼擁有專屬的「正常價格」（Normal Values）（*\"As you know, CSC have a normal value, they're subject to the anti-dumping ruling, but they have normal values.\"*）。\n  - **TRQ（關稅配額）與許可證制度**：隨著一年半前加拿大引入 TRQ（Tariff Rate Quota）與繁瑣的進口許可證制度（*\"with the introduction, you know, a year and a half ago of the TRQs and all this permit rubbish\"*），Vicky 與 Eva 持續與台灣政府主管機關及加拿大 CBSA 保持對話。\n  - **來訪目的**：她們此行主要是為了第一線了解加拿大當地市場狀況、本土價格走勢（local pricing），以及中鋼是否需要向 CBSA 申請調整其正常價格（*\"primarily to understand what's going on, what's happening with local pricing, etc., whether they need to be... do they need to be kind of adjusting their normal values, etc.\"*）。\n\n---\n\n## Chunk 01 (03:00 – 06:00)：中鋼代表團介紹 (二)、開發鋼種回顧與 API 650 議題引出\n\n### 1. 介紹中鋼業務處長 Jim 與技術專家 Delphic (03:00 – 04:32)\n- **Jim 的職責與 Salzgitter 全球合作業務**：\n  - Phillip 介紹 Jim 為中鋼熱軋部門銷售處長（Sales Manager / Senior Sales Director from the Hot Rolled Department），日常主要負責熱軋鋼捲（Hot Rolled Coil），但此行也涵蓋熱軋鋼板（Hot Rolled Plate）及中鋼所有產品線。\n  - **全球與北美市場佈局**：Salzgitter 與中鋼擁有全球性業務合作，最大宗出口量在歐洲（主要是南歐，如義大利、西班牙）；在北美市場則維持穩定的常規業務，近期最大噸數集中在熱軋鋼捲（Hot Rolled Coil），同時也穩定經營鋼板（Plate）業務，以及來自中鋼姊妹公司「中龍鋼鐵」（Dragon Steel）的型鋼（Beams）。\n- **Delphic 的職責與中鋼已開發之鋼板規格**：\n  - Phillip 介紹 Delphic 來自中鋼技術部門，是鋼板專家（Plate Specialist）。\n  - 多年來 Salzgitter 與中鋼合作開發了非常廣泛的鋼板材質（wide range of plate grades），包括：\n    - **CSA G40.21 44W**\n    - **Cat 4 (Category 4 衝擊測試鋼板)**\n    - **350AT Category 3 橋樑用鋼板 (Bridge Plate)**\n    - **合金鋼板 (Alloy Plates)**：中鋼擁有直接淬火系統（Direct Quenching system），可生產 **A514 (514)** 等級。\n\n### 2. Price Steel 提出 API 650 儲槽鋼板規格需求 (04:32 – 06:00)\n- **API 650 規格詢問**：\n  - Price Steel (Rod) 立即插話詢問：**\"How about API 650 spec, can they?\"**（那 API 650 規範呢？他們能做嗎？）\n  - Phillip 回應，雙方之前曾討論過此問題，但關鍵在於 **API 650 並不是真正的「鋼板生產規範」（not really a plate spec），而是「儲槽製造規範」（it's a tank, it's a manufacturing spec）**。\n  - Phillip 表示中鋼討論過如何將其納入，但措辭必須非常謹慎（*\"there's a possibility that we can somehow incorporate it, but you know, we need to be careful of the wording\"*）。\n- **競爭對手現代鋼鐵 (Hyundai Steel) 的作法**：\n  - Rod 指出，韓國現代鋼鐵（Hyundai）提供包含 API 650 的鋼板已經有約 5 年時間了（*\"Hyundai has been offering that for probably five years now.\"*），並表示 Price Steel 可以提供現代鋼鐵的典型材質證明書（MTR, Mill Test Report）給中鋼參考（*\"So we can provide you with a typical MTR.\"*）。\n  - Phillip 表示非常歡迎（*\"If you could, that would be great.\"*），並解釋中鋼作風非常保守（*\"CSC is very conservative, which is good, and sometimes not so good, but they're not going to promise something that's not going to happen.\"*）。\n  - Rod 回憶他約 7.5 年前剛到 Price Steel 時，第一件事就是向各方詢問能否提供此規格（*\"When I first arrived here about seven and a half years ago, that was one of the first things I kind of reached out to everybody, like where are we at...\"*）。\n\n---\n\n## Chunk 02 (06:00 – 09:00)：加西儲槽鋼板市場規模、四合一多重認證規格 (Quad Grade) 與韓國競爭分析\n\n### 1. 加拿大西部儲槽鋼板市場規模：30,000 噸與油管建設商機 (06:00 – 07:02)\n- **Rod 的背景與市場估算**：\n  - Rod 說明他過去的專業背景很大一部分在於儲槽鋼板（tank plate / shell plates）與儲槽銷售（tank sales）。\n  - 他在 7.5 年前曾估算過，**加拿大西部（Western Canada）每年的儲槽用板市場規模約有 30,000 噸（30,000 tons）**。\n  - 雖然現在市場環境有所改變，但他認為**目前的時機非常好（\"the timing seems kind of good with all the pipeline activity and everything else that's been announced\"）**，因為近期宣布了多項輸油管線建設與相關擴建計畫。\n  - Rod 表示會找出當年的電子郵件與 Hyundai 的 MTR，透過 Phillip 轉交給 Delphic 與中鋼團隊研究。\n\n### 2. 本土鋼廠的多重規格認證 (Multi-Spec / Quad Grade) 現況 (07:02 – 07:55)\n- **不加價的四合一多重規格 (Quad Grade)**：\n  - Phillip 詢問，API 650 是否直接包含在 44W 的多重認證規格（multi-spec）中？\n  - Rod 與 Dwayne 確認：**是的，加拿大本土鋼廠對此不收額外費用（\"The domestic mills don't charge extra for it.\"）**。\n  - 無論是 **Algoma**，或是他們有時採購的美國 **Oregon Steel**，這兩家鋼廠在 4、5 年前就已經不收加價，直接開立完全的多重規格（totally multi-spec）：\n    - **CSA G40.21 38W / 44W**\n    - **ASME SA36**\n    - **ASTM A36**\n    - **API 650 Class 3**\n\n### 3. Phillip 向 Delphic 說明競爭態勢與 Delphic 對 API 規範的初步回應 (07:55 – 09:00)\n- **韓國鋼廠 (Hyundai) 的競爭優勢與配額超賣問題**：\n  - Phillip 向 Delphic 解釋：API 650 Class 3 是石油儲槽的製造規範（oil storage tank manufacturing specification）。\n  - 在 44W 鋼板市場中，最主要且持續的競爭對手就是韓國現代鋼鐵（Hyundai），因為**韓國沒有反傾銷稅（no AD），且屬於自由貿易協定（FTA）TRQ 配額國家**（雖然韓國鋼廠已經大幅超賣配額 *\"they've oversold dramatically their quota\"*，但那是另一個問題）。\n  - Phillip 總結 Rod 與 Dwayne 的核心訴求：中鋼能否在這個「四合一鋼種」（quad grade / multi-cert grade）的 MTR 及鋼種標示上，把 **API 650 Class 3** 加進去？\n- **Delphic 的回應與澄清**：\n  - Delphic 表示他記得中鋼曾開發過 **API X65**（管線鋼）。\n  - Phillip 與 Price Steel 立即澄清：**這完全不同（\"No, no, this is different.\"）**，API X65 是製管用鋼（pipe grade），而 **API 650 Class 3 是用來製造大型儲油槽的鋼板規範（plate grade for manufacturing tanks）**。\n\n---\n\n## Chunk 03 (09:00 – 12:00)：儲槽實體尺寸說明、MTR 標註 vs. 符合性聲明書之爭、NACE MR0175 先例\n\n### 1. 下游建造規範性質與愛德蒙頓大型儲油槽實例 (09:00 – 10:25)\n- **建造規範 vs. 生產規範**：\n  - Phillip 進一步向中鋼團隊說明，API 650 就像製管業的 CSA Z662（管線建造規範 pipeline construction spec）一樣，它不是煉鋼廠的鋼板生產規範（not a plate manufacturing grade），而是下游的工程建造規範（downstream construction specification）。\n  - Rod 補充，現場施工或焊接人員在將不同鋼板焊接在一起時，只希望看到規範名稱對稱一致（symmetry）。\n- **儲油槽尺寸與地標實例**：\n  - Dwayne 向中鋼團隊具體描繪這種材料的用途：用於液體儲存（liquid containment）的超大型儲油槽，**直徑達 200 英尺（200-foot diameter tanks），由 3、4、5 層（courses）高為 8 到 10 英尺的鋼板焊接而成，總高度可達 30、40、50 英尺**。\n  - Dwayne 舉例：如果在愛德蒙頓東側走 Anthony Henday 環狀高速道路（East side Edmonton and Sherwood Park area），路旁看到的那整片巨大儲油槽群，全部都是用這種鋼板建造的。\n\n### 2. 交鋒：符合性聲明書 (Letter of Compliance) vs. 直接印在 MTR 上 (10:25 – 11:45)\n- **Phillip 提議 Letter of Conformance 遭 Dwayne 當場反駁**：\n  - Phillip 試探性地詢問：是否可以用「符合性聲明書」（Letter of Conformance or Compliance）的方式處理？因為客戶真正尋求的是確認鋼材符合該規範。\n  - **Dwayne 立即強烈反對**：**\"Why are you conceding already? Why can't we ask the mill to provide that MTR before we concede to a letter of compliance? Why can't we go with an MTR that actually states it?\"**（你為什麼現在就先退讓了？在我們退讓接受符合性聲明書之前，為什麼不能直接要求鋼廠提供印有該規範的 MTR？）\n  - Phillip 解釋他並非退讓，而是因為之前已經跟中鋼內部討論過好幾次，且不只 Price Steel 一家客戶在問，他知道中鋼內部的顧慮。\n- **Price Steel 承諾提供多家鋼廠 MTR 樣本**：\n  - Rod 與 Dwayne 表示，除了 Hyundai 之外，他們也可以提供 **Algoma**、**Evraz**、**SSAB**、**Oregon Steel** 等多家北美與進口鋼廠的 MTR 樣本給中鋼看。\n  - Phillip 表示 **Algoma 和 Hyundai 的 MTR 樣本就足夠了**。\n  - Rod 指出，目前美國鋼材（American steel）面臨關稅與貿易障礙（roadblocks），而加拿大本土的 Algoma 又有生產問題（production issues），因此這對中鋼來說是個切入的好機會。\n\n### 3. Phillip 引述韓國東國製鋼 (Dongkuk) 在 NACE MR0175 的作法 (11:45 – 12:00)\n- Phillip 指出，對鋼廠而言，API 650 的問題與壓力容器鋼板（PVQ plate）上的 **NACE MR0175** 規範非常相似，兩者本質上都是下游結構/環境規範。\n\n---\n\n## Chunk 04 (12:00 – 15:00)：東國製鋼 MTR 標註範例、鋼板噴印 (Stencil) 要求與鋼廠產品責任顧慮\n\n### 1. 東國製鋼 (Dongkuk) 在 MTR 上的「Compliant」標註法 (12:00 – 13:05)\n- **Dongkuk 的解套方式**：\n  - Phillip 繼續說明韓國東國製鋼（Dongkuk）處理 NACE MR0175 的方式：他們並未將其列為鋼種生產規範本身，而是**直接印在材質證明書（MTR）的底部，寫明「ISO 某規範及 NACE MR0175 compliant（符合規範）」**（*\"they simply state that it's ISO whatever it is and NACE MR0175 compliant on the test report, right there.\"*）。\n  - 這樣一來，雖然它不是煉鋼規範的一部分（not part of the spec），但客戶查看 MTR 時可以直接在文件上看到這行字，就能安心使用。\n- **Dwayne 的底線要求：必須在 MTR 上，且鋼板必須噴印 (Stencil)**：\n  - Dwayne 表示：**\"Put it on the bottom 'compliant to' on the MTR, not a separate letter of compliance.\"**（把它印在 MTR 底部的「符合…」欄位，而不是另外開一張符合性聲明書。）\n  - Phillip 追問：**\"Do they stencil it on the plate?\"**（那他們會把它噴印在鋼板上嗎？）\n  - Rod 與 Dwayne 肯定回答：**\"I would say so, yeah, absolutely... If memory serves me correctly, yeah, it's part of the spec, it's on the spec line.\"**（當然會，它就是規範的一部分，直接印在鋼板的規範欄上。）\n\n### 2. 深入探討：為何煉鋼廠對 API 650 有產品責任 (Liability) 顧慮？ (13:05 – 15:00)\n- **規範本質的差異**：\n  - Rod 表示不太理解把 API 650 印上去到底有什麼差別，認為這就跟加拿大型鋼規範 CSA G40.21 350W 一樣。\n  - Phillip 詳細解釋煉鋼廠的法務與技術邏輯：如果你去查 ASTM 等鋼鐵生產規範手冊，絕對找不到 API 650，因為 **API 650 是「儲槽建造與組裝說明書」（tank construction specification / fabrication instructions for putting that tank together），而不是「如何煉製鋼鐵的說明書」（not the instruction for making the steel）**。\n- **萬一發生事故的索賠與免責條款 (Liability & Fit for Purpose)**：\n  - Phillip 強調，這對鋼廠來說是**法律責任問題（liability issue）**。\n  - 他敢非常肯定地說，如果今天一座儲油槽發生意外事故（accident），客戶拿著印有 API 650 的 MTR 去向 Algoma 或其他鋼廠求償（claim），在 Algoma 的檔案庫或 MTR 附帶條款中，一定有一條免責聲明寫著：**「本廠不保證最終用途適用性（we don't guarantee fit for purpose），我們生產的鋼材符合該規範的成分要求，但我們不對現場焊接（welding）或儲槽實際組裝方式負責。」**\n  - 因此，Phillip 認為折衷且可行的方式，就是在 MTR 上註明 **「API 650 Class 3 compliant」**。\n\n---\n\n## Chunk 05 (15:00 – 18:00)：化學成分分析、加拿大「Pacific Link」新油管計畫與中鋼爭取訂單的關鍵\n\n### 1. 化學成分完全相容：僅需注意銅/硫含量 (15:00 – 15:52)\n- **技術門檻極低**：\n  - Rod 與 Dwayne 指出，從技術角度來看，API 650 Class 3 只是很簡單的化學成分限制（chemistry thing），主要是終端用戶對**銅含量（copper content）或硫含量（sulfur content）**有所要求，而這些早就完全涵蓋在一般低碳鋼（mild steel / 44W）的標準成分範圍內了（*\"the chemistry is what they're after and it all fits in already with mild steel\"*）。\n  - 北美鋼廠多年來生產的 5 英尺、6 英尺寬熱軋鋼捲切板（coil plate）也都一直是這樣直接涵蓋此規範。\n  - Phillip 同意，認為中鋼在技術上完全可以配合（*\"I think it's something that we can accommodate\"*）。\n\n### 2. 加拿大聯邦與亞伯達省快速推進「Pacific Link」新輸油管線計畫 (15:52 – 17:15)\n- **地緣政治與能源出口轉向亞洲**：\n  - Phillip 向中鋼團隊說明加拿大最新的重大基礎建設背景：由於當前的美加貿易摩擦與不確定性，加拿大聯邦政府（Federal Government）與亞伯達省政府（Provincial Government of Alberta）已經聯合**快速審查通過（fast-tracked）一條從亞伯達省通往西岸溫哥華（Vancouver）的新輸油管線**。\n  - 除了現有的跨山油管（Trans Mountain pipeline）外，這條新油管名為 **「Pacific Link」**，全長約 **1,500 公里（1,500 km）**，預計於 **2030 年左右（2030 something）** 投入營運（in-service）。\n  - Phillip 直言：**「過去我們的石油只有一個客戶，就是美國（USA）；但他們現在不再可靠了（They're no longer reliable），所以我們必須開發其他客戶，像是台灣、日本、韓國。」**\n- **龐大的常壓儲油槽 (Atmospheric Storage Tanks) 需求**：\n  - 隨著新油管開發，沿線與終端將會產生龐大的新增儲油槽需求（need for more storage）。\n  - Phillip 與 Rod 確認，這些全部都是**常壓儲油槽（atmospheric oil storage tanks）**，並非高壓氣體儲槽（not high-pressure gas storage），因此鋼材本身其實沒有任何特殊之處（nothing special）。\n\n### 3. Phillip 對中鋼團隊的直言建議：不標註就會痛失先機 (17:15 – 18:00)\n- **取得第一優先採購機會**：\n  - Phillip 嚴肅地對中鋼團隊說：為了讓 Price Steel 未來考慮向中鋼採購，並給中鋼最大的銷售機會，**中鋼的 MTR 上必須包含對 API 650 規範的某種引述（\"some reference to this specification needs to be included on your MTRs\"）**。\n  - **否則，市場上有其他鋼廠能做到，那些鋼廠就會拿到第一順位的訂單，而中鋼根本排不上號（\"Otherwise, if there are other mills that can do it, and there are, they're going to get first chance. And you won't.\"）**。\n\n---\n\n## Chunk 06 (18:00 – 21:00)：庫存商單一庫存策略、中鋼 1/4\" × 10' 寬板優勢與中鋼內部中文討論\n\n### 1. 鋼材服務中心的「單一庫存多重用途」策略 (18:00 – 19:12)\n- **化學與機械性質皆已達標**：\n  - Phillip 重申，中鋼的化學成分與機械性質（chemistry and mechanical properties）百分之百符合要求，甚至中鋼過去出過的鋼板很可能早就被客戶拿去蓋儲油槽，並由當地第三方檢驗機構（third-party inspector）認證通過了。\n- **為什麼庫存商非要多重認證不可？**\n  - Phillip 與 Dwayne 解釋：像 Price Steel 這樣的庫存分銷商（service centers / stockists），**不可能針對不同用途準備多套庫存（\"they're not going to carry multiple inventory\"）**。\n  - 他們必須只備**同一批庫存（one inventory）**，就能同時賣給所有不同產業與終端應用（結構、橋樑附屬件、儲油槽等），因此「多重規格認證（multi-spec）」能讓中鋼在競爭中大幅領先（*\"gives you a much better chance in the race\"*）。\n\n### 2. 中鋼在薄規格寬板（1/4\" × 10' wide）的獨特競爭優勢 (19:12 – 20:15)\n- **極少鋼廠願意軋製 1/4 英尺 × 10 英尺寬板**：\n  - Rod 指出中鋼另一個極具吸引力的產品範圍優勢：儲槽鋼板最薄會用到 **1/4 英尺厚、10 英尺寬（1/4 inch, 10-foot wide，即 6.35 mm × 3,048 mm）**，而他知道**中鋼有能力生產這個尺寸**。\n  - 目前市場上，**並不是每家鋼廠都還願意往下軋製到 1/4 英尺厚，也不是每家鋼廠都能軋製 10 英尺（120 英尺）寬的薄板**（*\"not everyone wants to go down to quarter inch anymore, not everyone can roll 10-foot wide\"*）。\n  - Dwayne 補充：**「這場比賽裡的馬本來就不多（There's only so many horses in the race），所以在 1/4\" × 10' wide 這個規格上，競爭壓力小非常多！」**\n- **儲槽各部位常用厚度分佈**：\n  - Rod 說明，在儲槽應用中，除了底部較厚的壁板外，往上延伸的各層壁板（随高度遞減厚度 *\"you get thinner as you go up\"*）以及儲槽底板與頂板（floors and roofs），**1/4\" (6.35 mm)、5/16\" (7.94 mm)、3/8\" (9.53 mm)** 且 **10 英尺寬** 的規格是非常、非常熱門的暢銷尺寸（very, very popular）。\n  - 如果中鋼能在 1/4\" × 10' wide 等薄寬板上取得 API 650 標註，將具備極強的市場競爭力。\n- **後續行動**：Rod 承諾會把 5 年前發過的相關郵件與 MTR 範本找出來，重新寄給 Phillip 轉交中鋼。\n\n### 3. 中鋼團隊內部中文討論與規格確認 (20:15 – 21:00)\n- **中鋼內部共識**：\n  - Phillip 對 Delphic 表示，從技術角度來看這應該不難，雙方以前也討論過，應該有辦法在 MTR 上加入對該規範的引述（reference）。\n  - **中鋼團隊內部中文交談**（約 20:38）：中鋼人員低聲以中文確認：**「某個規範… API 650…」**。\n- **確認四合一規格明細**：\n  - Delphic 向 Phillip 與 Rod 再次確認客戶希望綁在一起的規格明細：是否要把 **API 650 Class 3** 放進 **38W / 44W** 裡面？\n  - Phillip 與 Rod 連聲確認：**\"Yeah, yeah, yeah, yes, the quad [grade]...\"**（對，就是那個四合一規格：CSA G40.21 38W/44W、ASTM A36、ASME SA36，再加上 API 650 Class 3）。\n\n---\n\n## 本段重點數據與規格彙整表 (Summary Table: Chunks 00–06)\n\n| 項目 | 內容與數據明細 |\n| :--- | :--- |\n| **中鋼既有開發鋼種** | CSA G40.21 44W、Cat 4、350AT Cat 3 (橋樑鋼板)、A514 (直接淬火 Direct Quenching 合金板)；另有中龍 (Dragon Steel) 型鋼 (Beams) 與中鋼熱軋鋼捲 (HRC) |\n| **客戶要求新增認證** | **API 650 Class 3**（常壓儲油槽建造規範 Atmospheric Oil Storage Tank Construction Spec） |\n| **目標多重認證組合 (Quad Grade)** | **CSA G40.21 38W / 44W + ASTM A36 + ASME SA36 + API 650 Class 3**（本土鋼廠如 Algoma、Oregon Steel 及韓國 Hyundai 皆免費提供 Multi-spec，不收額外加價） |\n| **加西儲槽鋼板市場規模** | 約 **30,000 噸 / 年**（Western Canada，由 Rod 估算） |\n| **重大基建驅動因素** | 加拿大聯邦與亞伯達省快速審批通過 **「Pacific Link」新輸油管線**（亞伯達省 → 溫哥華，全長約 **1,500 km**，預計 **2030 年左右**完工營運），帶動沿線與終端大量常壓儲油槽需求 |\n| **儲油槽典型尺寸** | 直徑約 **200 ft**，高約 **30–50 ft**（由 3–5 層、每層 8–10 ft 寬的鋼板焊接而成） |\n| **中鋼極具優勢之關鍵尺寸** | **厚度 1/4\" (6.35 mm)、5/16\" (7.94 mm)、3/8\" (9.53 mm) × 寬度 10 ft (120\" / 3,048 mm)**（許多鋼廠不願軋製 1/4\" × 10' 寬板，競爭對手極少） |\n| **MTR 與噴印要求** | Price Steel 拒絕單獨的「符合性聲明書 (Letter of Compliance)」，要求直接印在 **MTR 材質證明書**（可參考韓國東國製鋼 Dongkuk 標註 `API 650 Class 3 compliant`）並**噴印 (Stencil)** 於鋼板上 |\n| **貿易與關稅背景** | 中鋼受加拿大反傾銷（Anti-Dumping）規範但擁有 **Normal Values（正常價格）**，另受 **TRQ（關稅配額）** 限制；主要對手韓國 **Hyundai Steel** 無反傾銷稅（No AD，屬 FTA TRQ，惟已大幅超賣配額） |\n\n---\n\n---\n\n## Chunk 07 (21:00 – 24:00)\n**主題：API 650 Class 3 規範於 MTR (Mill Test Report) 上的標示方式、管線與儲槽建造規範之責任界線**\n\n### 1. MTR 上標示 API 650 Class 3 的可行性與表述方式\n- **中鋼團隊 (Paul / Delphic)** 承接前段討論，詢問是否要在我們的 MTR (材質證明書) 上把該規範名稱寫進我們的 Spec 欄位裡（*\"It's on our MTR? ... Like enter our spec name or...\"*）。\n- **Jonty (Salzgitter 貿易商代表)** 解釋：\n  - 理想上是這樣，但他認為中鋼直接把 API 650 當作鋼廠生產規範名稱放進系統可能會有問題，因為雙方以前討論過這個議題：\n    > *\"No, well ideally, but I think you're going to have an issue with that, because we discussed it before. And I think if you state on your MTR that it is compliant — 'This steel is compliant with API 650 Class 3'.\"*\n  - Jonty 詢問中鋼手邊是否有 API 650 Class 3 的規範文件（*\"Do you have the API 650 Class 3? We can get that.\"*），中鋼表示需要該份規範（*\"Yeah, we need that specification.\"*）。\n- **Price Steel (Dwayne & Rod)** 補充說明：\n  - Price Steel 本身也沒有買這份規範，因為它是**製造/建造規範 (fabrication spec)**，而 Price Steel 是鋼鐵服務中心 (service center)，負責轉售符合 ASTM 標準的鋼材，但他們的終端客戶（儲槽製造商）有這份規範：\n    > *\"No, we don't have it because it's a fabrication spec. We deal as service center resale of steel products, the ASTM standard. I know what's your point, that's why I'm saying that... Our customers do, though.\"*\n  - **Jonty** 承諾會將 API 650 規範分享給中鋼，並表示他很確定自己以前買過這份規範（*\"Yeah, we'll share that spec with you. And I'm pretty sure that I bought it at the time.\"*）。\n\n### 2. 建造規範 vs. 鋼廠生產規範之類比（CSA Z662 管線規範 vs. API 650 儲槽規範）\n- **Jonty** 分享 Salzgitter 在管線鋼管 (line pipe) 業務上的類似經驗：\n  - 工程公司經常要求在鋼管上噴印 (stencil) **CSA Z662**，但鋼廠無法這麼做，因為鋼廠不是建造管線的施工方：\n    > *\"We come across this as I say for—we do a lot of line pipe business from our mills, and very often we'll have like engineering companies say, 'Well, you know, we need CSA Z662 stenciled on the pipe.' And we've said, 'Well, we can't do that, because we're not building the pipeline.'\"*\n  - 同理，儲槽製造商 (tank manufacturers) 必須針對最終儲槽認證符合 **API 650 Class 3**，甚至可能噴印在鋼板上。如果鋼廠能在 MTR 上註明符合該規範，對客戶而言會容易得多。\n- **Price Steel (Rod)** 說明終端客戶（End Users / 儲槽廠）的實際痛點：\n  - 終端客戶只是需要有人去核對所有 MTR 上的化學成分與性質，確保完全落在 API 650 規範範圍內。如果能直接從鋼廠源頭（*\"right from the horse's mouth\"*）在 MTR 上看到這句符合聲明，就能消除所有疑慮：\n    > *\"Yeah, for this purpose they, you know, the end users just need somebody to go through all the MTRs and check the chemistry and make sure it fits within... Somebody's got to do it, and obviously if they can get it right from the horse's mouth, it removes a whole bunch of doubt.\"*\n\n### 3. 競爭對手 (Hyundai、Algoma) 的作法與免責聲明 (Disclaimer)\n- **Jonty** 分析 Hyundai (現代製鐵) 與 Algoma 內部如何處理這個問題：\n  - 他不確定 Hyundai 或 Algoma 內部怎麼管理，但他確信如果深入檢視，一定會有某種免責聲明 (disclaimer)，表明鋼廠是依照鋼材規範生產，但無法控制儲槽廠（例如 Edmonton Tank 等製造商）後續如何加工或焊接該鋼材：\n    > *\"I totally get it, and I don't know how Hyundai or Algoma manage it internally, but as I say, I'm pretty sure that if you sort of peel back the layers, you're going to see some sort of disclaimer somewhere that, you know, 'We can't control—we make the steel to this spec, but we can't control what, you know, whoever they are, Edmonton Tank, do with it.'\"*\n- **Price Steel (Rod)** 指出：\n  - MTR 上能放的資訊有限，且鋼廠除了發給客戶的 MTR 之外，也沒辦法在其他地方另外加註引用，所以他如果在 MTR 上看到長篇免責聲明會感到意外，但他理解 Jonty 的意思（*\"I mean there's only so much information on the MTR... They can't reference it anywhere else outside what they're sending to the customer, which is an MTR, so...\"*）。\n\n---\n\n## Chunk 08 (24:00 – 27:00)\n**主題：API 650 市場需求量（30,000 噸以上）、多重認證鋼種 (Quad Grade) 庫存優勢、中鋼產品線完整度優勢**\n\n### 1. 取得樣本 MTR 與 API 650 市場需求規模\n- **Price Steel (Rod / Dwayne)** 再次確認會將競爭對手的 MTR 樣本寄給 Jonty 與中鋼團隊參考（*\"We'll be sending you copies of all that.\"*）。\n- **Fiona (Salzgitter 台北辦公室總經理)** 提問：這個規範的市場需求量有多大？（*\"How's the demand for this spec?\"*）\n- **Jonty 與 Price Steel (Rod / Dwayne)** 回答：\n  - **5 年前預估至少 30,000 噸，現在規模更大**：\n    > **Jonty**: *\"Well, Rod said 5 years ago he estimated it was at least 30,000 tons, but now probably bigger because there's more need again.\"*\n  - **本拿比 (Burnaby) 儲槽區擴建需求**：\n    - **Rod** 補充，隨著 Burnaby 的儲槽區 (tank farm) 擴建，這類需求明顯增加（*\"Yeah, I mean, now with tank farm in Burnaby, you'd see a lot more of that as well, so...\"*）。\n\n### 2. 不需改變煉鋼製程、以「多重認證鋼板 (Quad Grade)」統一庫存的商業價值\n- **Price Steel (Dwayne)** 強調這對中鋼與對 Price Steel 雙方的關鍵商業邏輯：\n  1. **非全新鋼種，無須改變鋼材化學成分**：即使沒有 API 規範，市場本來就需要大量 8 呎 (96\") 與 10 呎 (120\") 寬的全尺寸鋼板。只要在 MTR 上加註符合 API 650，中鋼並不需要為了這個市場去煉製不同的鋼（*\"You're not making different steel to accommodate this market. This market still exists a lot of 8 and 10-foot wide plate in that full range.\"*）。\n  2. **單一庫存滿足多重用途 (Quad Grade)**：正如同 Jonty 先前提到的，Price Steel 不希望在庫存裡同時備有 2、3、4 種不同鋼種，而是希望能備貨這種「四合一認證鋼種 (quad grade)」，將所有庫存統一在這個規格下，通吃所有應用場景：\n    > *\"Instead of us carrying two or three or four different grades, we'd like to carry that quad grade or whatever it ends up being, and have all our product in that, if good, because it's no different—you know, we use it for all of our applications. So it's not a new chemistry or product you have to come up with, it's just to ensure that it's compliant to that specification.\"*\n  3. **增量業務 (Incremental Business) 與進入採購名單 (Buying Arena)**：\n    - **Jonty**: *\"Just gives more options to sell that steel.\"*\n    - **Dwayne**: *\"It's incremental business. And the big thing is it puts you in that buying arena of potential suppliers for that product. Because right now you're not. Right? So when those opportunities come up where there's a big tank farm job, you're not being considered because you can't do the specification on your MTR, or identify it that way.\"*\n\n### 3. 中鋼完整產品線 (Product Offering) 的強大競爭優勢\n- **Jonty** 總結中鋼若加入 API 650 標示，將能提供超越市場上多數鋼廠的完整產品組合：\n  - 薄板 (thin plates)\n  - 寬板 (wide plates)\n  - 部分鋼種厚度可達 **5\" (5 inches thick)**\n  - **Cat 4** 鋼板 (CSA G40.21 Category 4)\n  - **Cat 3** 鋼板\n  - **橋樑耐候鋼 (bridge weathering grade)**\n  - **A516-70** 壓力容器鋼板\n  - **合金鋼板 (alloy plate)**\n  > *\"If you add this to your offering, I think you'll be able to offer way more than many of the mills who are in this market. Okay, there's still a question of price...\"*\n\n---\n\n## Chunk 09 (27:00 – 30:00)\n**主題：與競爭對手 (BlueScope、馬來西亞、Hyundai、Algoma) 之比較、整包採購策略、中鋼團隊內部中文討論**\n\n### 1. 價格差距容忍度與「一站式整包採購 (Whole Package)」優勢\n- **Jonty** 指出，市場上雖然有馬來西亞鋼廠、偶爾出現的澳洲 BlueScope、以及韓國 Hyundai，我們無法控制他們的報價，且中鋼的價格不是最低的（*\"Because your price is not the lowest.\"*）；但若中鋼擁有超廣產品尺寸與規格範圍，就能獲得常規訂單並提升整體回報 (overall return)。\n- **Price Steel (Dwayne & Rod)** 說明採購決策邏輯：\n  - **價差 $1~$3/噸 內優先整包下單**：如果價格只差 1、2、3 塊錢（美金/噸），但中鋼能提供整包方案 (whole package)，Price Steel 不會為了幾塊錢把一張訂單拆散給不同鋼廠，而是傾向集中下給同一家供應商（當然價格還是要有競爭力，不能高出 3%~5%）：\n    > **Dwayne**: *\"Right, so if the price is, you know, a buck or two or three apart, but where you can offer the whole package, we consider that. We look at it and go, we're not going to break up an order if we can help it, we prefer to put it under one offering, but I mean you have to be competitive. Jonty's right, you're not the lowest, but it doesn't mean it opens the door to be 3%, 5% higher, right?\"*\n  - **尺寸限制直接淘汰 BlueScope 與馬來西亞鋼廠**：\n    - **BlueScope**：厚度從 **3/8\"** 才開始做（無法供更薄的儲槽頂板等規格）。\n    - **馬來西亞鋼廠 (Malaysia)**：寬度只做到 **96\" (8 呎)**（無法供 120\" / 10 呎寬板）。\n    - 因此，真正能跟中鋼全面競爭的只有 **Hyundai (現代製鐵)** 與加拿大本土的 **Algoma**；而以目前的市場價格來看，中鋼真正的對手就是 **Hyundai**：\n    > **Rod**: *\"It removes BlueScope because they start at 3/8\". It removes Malaysia because they only do 96\". So really you're competing with Hyundai. You really are. That's your competition, and Algoma. And of course based on today's market pricing, you're competing with Hyundai.\"*\n\n### 2. 合規保證措辭確認與中鋼內部中文討論\n- **Paul (中鋼業務處長)** 向 Jonty 確認責任範圍：中鋼是否只需要保證鋼材本身符合 (meet) 這個規範，而不需要對儲槽出事負責？\n  > **Paul**: *\"Then we only have to guarantee we meet this spec, API 650 Class 3... Yeah, but we don't have to guarantee if anything happens, we just only have to guarantee we meet this spec.\"*\n- **Jonty** 明確糾正用詞：是保證鋼材「符合且適用於 (compliant, i.e., suitable for)」該規範，因為 API 650 不是煉鋼規範，而是儲槽建造規範：\n  > **Jonty**: *\"You need to guarantee that it's compliant, and i.e. suitable for that spec, because that is not a steel production spec, it's a tank construction spec.\"*\n  - **Rod** 補充：他確實看過鋼板上直接噴印 (stenciled) 這個字樣（*\"It's definitely stenciled on the plate, I've seen that before.\"*）。\n  - **Jonty** 總結行動項目：Dwayne 和 Rod 會提供競爭對手的 MTR 樣本（部分之前已提供過），Jonty 則會提供 API 650 規範副本給中鋼檢查，並強調：\n    > *\"The competition is doing it, and if you want to play, you need to do it.\"*\n- **中鋼團隊內部中文討論 (Paul、Delphic 等人)**：\n  - **Paul**: *「我們回去 internal study 一下。啊你一個月前就給了？」*\n  - **Delphic**: *「美國有講過，那時候我們沒有相關的 spec...」*\n  - **Paul**: *「因為技術部門會很擔心出事要保證，但他只是要我們 meet 這個 spec...」*\n  - **Delphic**: *「對，因為我剛剛看那個是焊接的，主要是針對油罐、儲槽的焊接 (welding) 定的，所以我們還是要看一下規範啦，我們先請他們提供規範讓我們確認一下。」*\n  - **Paul**: *「啊反正他們 MTR 會給我們嘛，對啊，看 Hyundai 跟 Algoma 怎麼寫。」*(隨後轉英文向對方確認：*\"Hyundai and Algoma can do it, right?\"*)\n\n---\n\n## Chunk 10 (30:00 – 33:00)\n**主題：對手製程現況 (Hyundai vs. Algoma 轉電爐 EAF 困境)、北美西岸鋼廠格局、介紹 Parker、熱軋鋼捲代工切板 (Cut-to-Length) 與 Ternium 合作狀況**\n\n### 1. Hyundai 與 Algoma 的製程現況與西岸市場缺口\n- **Jonty** 評價兩家競爭對手：\n  - **Hyundai** 是非常優秀的鋼廠（*\"Hyundai is a fantastic steel producer.\"*）。\n  - **Algoma** 則只是差強人意（*\"But you know, really, Algoma? Come on. They're an okay steel producer... If Algoma can do it, trust me, CSC can do it.\"*）。\n  - **Algoma 轉型電弧爐 (EAF) 的問題**：Jonty 指出 Algoma 目前正在轉換至電弧爐 (EAF)，遇到非常嚴重的問題，未來還會面臨高級廢鋼 (high-grade scrap) 來源的問題，現在正忙著把舊高爐拆掉塞進爐子裡：\n    > *\"And especially now with Algoma's switch to EAF, and they're having tremendous issues. And you know, they're going to run into some high-grade scrap issues... they're busy throwing the old blast furnace in the furnace.\"*\n- **Price Steel (Rod)** 補充加拿大西岸的供應鏈結構：\n  - 就算在景氣好、生產順利的時候，Algoma 的重心也在**東岸 (Eastern Canada)** 與**美國市場**。\n  - 整個加拿大西岸 (Western Canada) 沒有本土鋼廠支撐，唯一就近的是美國俄勒岡州的 **Oregon Steel (Evraz Oregon)**，但受限於關稅 (tariffs) 與強勢美元，Oregon Steel 幾乎毫無價格競爭力：\n    > *\"Their focus is Eastern Canada, their focus is the US. There's nobody really supplying or supporting Western Canada other than, you know, there's no steel mill, well other than quite frankly Oregon. Yeah, but it makes it pretty uncompetitive with all these tariffs everywhere, and the US dollar...\"*\n\n### 2. 介紹 Parker（Salzgitter 墨西哥城駐點技術銷售）\n- **Price Steel (Dwayne)** 提醒還沒介紹完在場成員：還沒介紹 **Parker** 與 **Fiona**（*\"We haven't completed the loop yet. We haven't talked about Parker or Fiona.\"*）。\n- **Jonty** 介紹 **Parker**：\n  - Parker 駐點於**墨西哥城 (Mexico City)**，是第一次造訪 Price Steel。\n  - Parker 是負責**鋼捲 (coil)** 業務的技術專家；Jonty 將 **Delphic**（鋼板專家）與 **Parker**（鋼捲專家）定位為技術銷售 (technical sales)。虽然知道 Price Steel 本身沒有開平裁剪線 (decoiling line)，但以前 Parker 在中鋼時也曾負責過鋼板業務。\n\n### 3. 在台灣或墨西哥將鋼捲代工裁剪成鋼板 (Cut-to-Length / Decoiling) 的可行性\n- **Price Steel (Dwayne)** 提問：是否有可能在台灣找合作夥伴，把中鋼的熱軋鋼捲開平裁剪 (cut-to-length / decoil) 後再出口給 Price Steel？\n  > *\"So is there an option for us to partner with someone in Taiwan to cut the material? Decoil it for us?\"*\n- **Jonty 與 Price Steel (Rod / Dwayne)** 討論：\n  - **台灣裁剪經驗 (48\" 與 60\" 寬)**：Jonty 表示過去曾從中鋼在台灣的競爭對手 **尚興 (Shang Shing)** 採購過 **48\"** 與 **60\"** 寬的開平剪板 (cut-to-length)。\n  - **墨西哥 Ternium 的可能性**：\n    - **Rod** 詢問從墨西哥出貨的可行性（*\"What about out of Mexico?\"*）。\n    - **Jonty** 表示 Salzgitter 與墨西哥 **Ternium** 有常規鋼捲業務往來（Price Steel 則僅與 Ternium 談過鋼筋 rebar，沒有鋼板往來）。\n    - Salzgitter 曾與 Ternium 討論過開平剪板 (cut-to-length)，但 Ternium 態度猶豫，而且 Ternium 的寬度上限只有 **72\" wide max**（並非 96\"），而中鋼的熱軋鋼捲同樣最寬也是 **72\" wide max**。\n\n---\n\n## Chunk 11 (33:00 – 36:00)\n**主題：台灣 72\" 鋼捲開平剪板之外銷包裝瓶頸、96\" 鋼捲海外採購來源、花紋鋼板 (Floor Plate / Checker Plate) 供應商討論**\n\n### 1. 台灣 72\" 鋼捲代工剪板的包裝與生鏽問題（含中鋼/Fiona 內部中文討論）\n- **Jonty** 解釋在台灣將 72\" 寬鋼捲開平剪板 (cutting 72\" in Taiwan) 的最大障礙在於**外銷防潮包裝 (wrapping/packaging)**：\n  - 台灣現在正值颱風季，鋼板若沒有防潮包裝直接裝櫃，受潮後海運抵達加拿大時就會生鏽。\n  - 台灣本地裁剪中心 (local service centers) 可以把鋼捲切開並打捆在木墊/棧板 (packaged and banded on skids) 上，但**無法做外銷防潮包覆 (can't wrap it)**；之前試做過幾次，結果遇到生鏽客訴問題 (rust issues)，若要再外包防潮包裝又會墊高成本：\n    > *\"We have looked at cut-to-length before and supplied it, like cutting 72\" in Taiwan, we talked about it on the way here. The issue is that we can't package it. Yeah, if you put it in containers, but there's no guarantee, you know, it's typhoon season now for example in Taiwan, stuff's going to get wet... We can get it cut and packaged on skids, banded on skids, we can't wrap it... We did some before, but we ran into some rust issues.\"*\n- **中鋼與 Fiona 內部中文穿插討論**：\n  - **Fiona**: *「台灣可以切，可是沒有外銷包裝... 對，就是這個問題... 它要 wrapped，好幾層...」*\n  - **Paul**: *「那個剪板廠的外銷包裝比較差... 台灣 coil 很少切板做外銷...」*\n  - **Fiona**: *「很多都沒有做外銷，可以問問看啦... 而且是外銷包裝，不是做防水、好幾層那種，有點麻煩。但是如果可以解決，這個是有需求量的。」*\n  - **Paul**: *「四尺、五尺 (48\"、60\")... 它也沒有做 72 吋 (6 尺) 的。」*\n  - **Fiona**: *「不然它的切板包裝跟我們一般熱軋... 對，可以問看看。」*\n\n### 2. 96\" 寬鋼捲裁剪板 (96\" Cut-to-Length) 的海外來源\n- **Price Steel (Rod)** 提到，72\" 寬只是五種寬度規格中的一種，他們更需要 **96\" 寬** 的裁剪板。\n- **Jonty 與 Rod** 討論全球能做 96\" 鋼捲開平剪板的鋼廠：\n  - **歐洲**：德國 Bremen 的 **ArcelorMittal Bremen** 可以做（*\"Arcelor in Bremen can do it.\"*）。\n  - **北非/地中海**：Rod 聽說摩洛哥 (Moroccan mill) 有一家，Jonty 指出應該是阿爾及利亞/土耳其的 **Tosyali**（*\"Tosyali, I think.\"*）。\n  - **後續跟進 (Björn 十一月底來訪)**：Jonty 提到以前駐溫哥華幾年、現在回德國的同事 **Björn** 預計在 **11 月底 / 12 月初** 造訪溫哥華，屆時他們四個人（3~4 人，符合 Price Steel 會議室人數上限）可以再過來拜訪討論。\n\n### 3. 花紋鋼板 (Floor Plate / Checker Plate) 的供應可能性\n- **Price Steel (Dwayne)** 詢問：中鋼有生產花紋鋼板 (floor plate) 嗎？（*\"And what about floor plate? Does CSC produce floor plate?\"*）\n- **Jonty、Paul 與 Fiona** 回應：\n  - 中鋼過去做過，但現在本身不做花紋鋼板（*\"CSC don't do.\"*）。\n  - 中鋼的關係企業（sister company）**中鴻鋼鐵 (Chung Hung)** 以前有做花紋鋼板 (checker plate)，但先前因為需求不強而停產了（*\"They already stopped... Chung Hung before they stopped because the demand not that strong.\"*）。\n\n---\n\n## Chunk 12 (36:00 – 39:00)\n**主題：花紋鋼板 (Floor Plate) 替代方案（中鴻、東鋼、日本東京製鐵 Tokyo Steel、本地裁剪廠 Tidy Steel）與介紹 Fiona**\n\n### 1. 花紋鋼板 (Floor Plate / Checker Plate) 的台灣與日本供應選項\n- **中鋼團隊內部中文討論（Paul、Delphic、Fiona）**：\n  - **Delphic**: *「中鴻現在還有做嗎？沒有了？」*\n  - **Fiona**: *「之前有嗎？Paul 問一下，如果有的話太好了！」*\n  - **Paul**: *「我回去問一下，我記得好像還有... 還有東鋼 (Tung Ho Steel) 好像有做，但東鋼賣很貴。」*\n- **Jonty 與 Price Steel (Rod / Dwayne)** 討論花紋鋼板規格與替代管道：\n  - **中鴻 (Chung Hung)**：Jonty 說中鴻正在考慮重啟生產，但不確定壓花紋路 (pattern) 是哪一種（*\"Chung Hung, they're considering to restart... Now I don't know what the pattern is going to be. Is it going to be Medium or Inland, or does it matter?\"*）。\n  - **Price Steel 對花紋紋路的要求**：Rod 與 Dwayne 表示現在市場變化很大，客戶對紋路已經不太挑剔（*\"Pretty soft these days. Yeah, there's been so many changes in the market. Inland, but yeah.\"*）。\n  - **日本東京製鐵 (Tokyo Steel) 花紋鋼捲 + 本地代工開平 (Tidy Steel)**：\n    - **Jonty** 表示 Salzgitter 代理日本 **Tokyo Steel (東京製鐵)**，隨時可以提供花紋鋼捲 (checker coil)，最寬可達 **60\" wide max**（非 72\"）。\n    - **Rod** 表示 Price Steel 需要的是已經整平切好的平板 (leveled plate)（*\"But we need it leveled.\"*）。\n    - **Jonty** 指出若要在北美本地找人代工開平，就得找競爭對手 Rosaki 等廠，代價會很高；或者找本地的 **Tidy Steel**，但這很磨損刀片 (ruins the knives)，而且日本也沒辦法代切這款花紋捲。\n    - **Rod & Dwayne** 討論 **Tidy Steel**：Tidy Steel 以前幫他們代工切過花紋捲，設備還是同一套戶外開平線 (outdoor decoiler)，雖然不確定現在還願不願意切花紋板，但 Tidy Steel 最近有表示願意再幫 Price Steel 代工處理鋼捲（*\"They'll look at doing coil for us again... whether it's checker plate or whatever, we just haven't gone down that road.\"*）。\n  - **Fiona 中文補充**：*「不是切板，它是捲 (coil)，看他們有沒有買。」*\n\n### 2. 介紹 Fiona（Salzgitter 台北辦公室總經理）與台灣採購地位\n- **Jonty** 壓軸介紹 **Fiona**：\n  - Fiona 是 Salzgitter 台北貿易辦公室的總經理（*\"General Manager of our trading office in Taipei, in Taiwan\"*），負責所有從台灣出口的業務。\n  - **台灣已成為 Salzgitter 全球第二大採購來源國（僅次於中國）**：\n    - 過去幾年來，對整個 Salzgitter 貿易集團而言，台灣已經成為僅次於中國的第二大鋼材採購來源國（*\"For the last few years, Taiwan has probably become, second to China, the second biggest source country of all of our materials.\"*）。\n    - 以前 Salzgitter 從俄羅斯和烏克蘭採購非常大量的鋼材（包含從俄烏銷售扁鋼胚 slabs 到台灣），但烏俄戰爭爆發後已全面停止。\n\n---\n\n## Chunk 13 (39:00 – 42:00)\n**主題：Salzgitter 台灣年出口量（40 萬噸以上，其中鋼板佔 4 萬噸）、Price Steel 公司採購結構剖析（70%~80% 海外採購 vs. 本土採購）與設備成長潛力**\n\n### 1. Salzgitter 台北辦公室年出口量與中鋼鋼板佔比\n- **Jonty** 詢問 Fiona 去年台灣辦公室的總出口量是多少？是否接近 50 萬噸？（*\"What was your volume last year for export? Half a million tons?\"*）\n- **Fiona** 回答：\n  - 每年總計約 **40 多萬噸 (400-something thousand tons)**。\n  - **Price Steel (Dwayne)** 幽默回應：*「我們不需要那麼多啦！」*（*\"We don't need that much.\"* 全場大笑）。\n  - **Jonty** 補充：台北辦公室規模雖小，只有 **3 個人**（Fiona 笑稱是因為有中鋼的大力支持與豐富產品線：*\"Because of CSC's support, so many product lines, have this volume.\"*）。\n- **Paul (中鋼業務處長)** 補充說明中鋼鋼板在其中的佔比：\n  - 他負責的鋼板外銷業務大約佔其中的 **4 萬噸（40,000 tons，約佔 10%）**：\n    > **Paul**: *\"My team in charge of plate export business only 10%... Four, 40,000 [tons].\"*（剛開始口誤說 1%，隨即與 Fiona 確認修正為 4 萬噸 / 10%）。\n\n### 2. Price Steel 的採購結構剖析：70%~80% 海外進口 (Offshore Purchasing)\n- **Paul (中鋼業務處長)** 主動提問，希望了解 Price Steel 的公司背景與採購結構：\n  - 主要供應商有哪些？從加拿大本土鋼廠 (local mill) 採購的百分比是多少？從海外進口 (import) 的比例又是多少？\n    > *\"Sorry, because I have to do some homework, may I know your company profile? For example, who is your main supplier, and how many you buy from local mill, probably the percentage, how many you buy from import in normal time?\"*\n- **Price Steel (Rod)** 詳細說明公司的歷史採購結構與原因：\n  1. **海外採購佔比高達 70% ~ 80%（甚至至少 80%）**：\n     > *\"Yeah, I mean, I guess our history has been, you know, probably 70 or 80% offshore purchasing... But traditionally we've been, you know, again, at least 80% probably offshore.\"*\n  2. **為什麼不買加拿大東部本土鋼廠（如 Algoma）？**\n     - 距離太遙遠，在幾年前根本完全不與海外進口鋼材競爭。\n     - **「景氣好的時候沒競爭力，景氣差的時候也沒競爭力」**：\n       > *\"Traditionally, you know, in the good times they're not competitive, in the bad times they're not competitive. So unless it's project specific or quick lead times, domestic supply has really not been there to support us.\"*\n  3. **唯一會向本土鋼廠採購的例外情境（儲槽專案 Tank Projects）**：\n     - 當遇到特殊鋼種、特殊尺寸，或者客戶不願意等待 5~6 個月的海外交期（需要極短交期 quick lead times）時，才會使用本土鋼廠。\n  4. **Price Steel 在鋼板業務的成長空間與新設備投資**：\n     - 鋼板目前還不是 Price Steel 最大的產品線，但具有極大的成長空間（*\"Plate's not our biggest product line... but we've got room to grow.\"*）。\n     - **兩年前剛安裝全新的最先進電漿切割機台 (State-of-the-art Plasma Table)**：\n       > *\"We've got a brand new plasma table from two years ago that was installed, kind of state-of-the-art. So it's definitely a product, you know, Dwayne's responsible for the sales side so I should let him talk, but you know, it's definitely that product class is where there's room for us to grow.\"*\n\n### 3. 徵詢對中鋼的建議\n- **Paul (中鋼業務處長)** 在片段結尾進一步詢問 Price Steel：對中鋼是否有任何建議？（*\"And is there any recommendation you want to...\"*，接續至下一片段）。\n\n---\n\n---\n\n## Chunk 14 (42:00 – 45:00)\n**主題：中鋼（CSC）差異化優勢（Cat 4 與尺寸範圍）、正常價值（Normal Value / CBSA）、A516-70 壓力容器板（PVQ）與東國製鋼（Dongkuk）/ JFE 扁鋼胚供應問題、離岸與內陸價差（Spread）起點**\n\n### 1. 開場寒暄：品質、交期與價格\n- **CSC 代表（Jim）**：笑稱想更精確了解（\"precisely... with this multi-standard spec\"），並詢問中鋼的品質、交期與價格表現（\"How about our quality, delivery... how about our quality, delivery, price?\"）。\n- **Price Steel（Dwayne / Rod）**：\n  - \"Well, I mean, you know, price moves and changes, so yeah, we want you to be competitive.\"\n  - 價格是動態變化的，當然希望中鋼保持價格競爭力。\n\n### 2. 中鋼（CSC）的差異化優勢：尺寸範圍（Size Range）與 Cat 4（Category 4）\n- **Price Steel（Dwayne）**：\n  - \"We've already mentioned how, you （Joffrey）解釋東國製鋼薄板溢價原因**：\n  - \"It was probably a premium because they... their main slab source is JFE. And JFE have had tremendous issues over the last six to eight months. Production-wise, they had a fire, they had flooding, you know, real bad flooding in Japan, and it knocked out... in their steel plant, so it knocked out a bunch of their production, and basically they just want more for...\"\n  - 東國製鋼的主要扁鋼胚（slab）來源是日本 **JFE**。過去 6 到 8 個月 JFE 遭遇嚴重的生產問題（火災 fire、日本嚴重水災 flooding），導致鋼廠大量產能停擺，因此對扁鋼胚索取更高價格。\n- **Price Steel（Dwayne）**：\n  - \"The throughput. You know, there's lesser throughput on the thin gauge. Like everything, when things are in panic mode, you want your prime, you want your main bread and butter going through.\"\n  - 補充鋼廠在產能吃緊或恐慌模式（panic mode）下，薄規格（thin gauge）產出率（throughput）較低，鋼廠只希望軋製主力常規產品（main bread and butter）。\n\n### 4. 買方視角：離岸價（Offshore）與內陸價（Domestic）的風險價差（Spread）\n- **Price Steel（Dwayne）**：\n  - \"Returning back to price, Jim, I guess, you know, from a buyer's perspective, you know, when we compare offshore pricing with domestic, the risk involved with offshore delivery and, you know, kind of what I touched on in the end, there's a gap, there's a spread between offshore and domestic that I think we're comfortable with, but it's...\"\n  - 回到價格議題，從買方角度比較海外進口（offshore）與本土採購（domestic），考量到海外交期的風險，兩者之間必須維持一個讓買方感到安全的**價差（gap / spread）**（轉入 Chunk 15）。\n\n---\n\n## Chunk 15 (45:00 – 48:00)\n**主題：離岸與本土的目標價差（15%–20%）、5–6 個月長交期拆解、本土交期、墨西哥免關稅採購與供應來源三分法、TRQ 進口配額抽籤困境**\n\n### 1. 傳統目標價差：低於本土價格 15% 至 20%\n- **Price Steel（Dwayne）**：\n  - \"...quite honestly, you know, in that 15 to 20% range, traditionally, below what we can get it for domestically. Just to, you know, again, longer lead time, you know, you're kind of stuck with, you're committed to a price, you know, six months potentially in advance of when it arrives. Markets can change, as you know.\"\n  - 傳統上，進口鋼板必須比本土採購價格**低 15% 到 20%（15 to 20% range below domestic）**。因為海外採購交期極長，買方必須在到貨前最長達 **6 個月**就鎖定並承諾價格（committed to a price），期間市場可能劇烈變化。\n\n### 2. 海外進口交期（5–6 個月）與本土交期（2–3 個月）詳細拆解\n- **CSC 代表（Jim）**：驚訝詢問 \"Six months?\"（六個月？我們交期應該沒那麼長）。\n- **貿易商（Joffrey）與 Price Steel（Dwayne / Rod）實例拆解**：\n  - \"Worst case scenario, right? Could be four, could be six.\"\n  - **Joffrey**：\"Well, as we use an example now, if we place an order now with you [October], it's January shipment. So, end of January. So by the time they could use it would be March. That's five months.\"\n  - **Dwayne / Rod**：\"February to Vancouver... It takes a month by the time it docks in Vancouver, it takes a month for us to get it from the ship, de-stuffed, brought out to the prairies.\"\n  - **時程拆解**：\n    1. **10 月下旬（現在）下單** → **1 月底（End of January）裝船出貨（January shipment）**。\n    2. **2 月（February）抵達溫哥華港（docks in Vancouver）**。\n    3. 從船上卸貨、拆櫃（de-stuffed）、內陸運輸到加拿大草原三省（Prairies / Edmonton），**還需要整整 1 個月** → **3 月（March）才能真正投入使用**。\n    4. 總計從下單到可用約 **5 個月（最長 4–6 個月）**。\n  - **Price Steel 的庫存定位**：\n    - \"And we're very comfortable with that. I mean, we're like, we've dealt with offshore lead times since I've been here, and so we're very comfortable with the fact that, yeah, we're not going to see it for five months, six months. We buy with that in mind.\"\n    - \"You know, plate's mostly for inventory anyways. Once again, if our customers are willing to wait for a project, then that's fine, but they're typically not. They want domestic delivery and they want offshore pricing.\"\n    - Price Steel 已經非常習慣 5–6 個月的海外交期，採購中厚板主要是作為**庫存（inventory）**；因為終端工程客戶通常不願意等，客戶總是「既想要本土的短交期，又想要海外的低價格（They want domestic delivery and they want offshore pricing）」。\n- **本土鋼廠（如 Algoma）交期比較**：\n  - **CSC 代表（Jim）**：\"If domestic delivery is normally how long? Like if you order today from Algoma?\"\n  - **Price Steel（Dwayne & Rod）**：\n    - \"Today is a problem... Normal situations, you know, two to three months would be domestic delivery from purchase order date. Five years ago, six years ago, when things were normal.\"\n    - 正常情況下（例如五、六年前市場正常時），本土鋼廠從下採購單（PO date）到交貨約 **2 到 3 個月（2 to 3 months）**；但「今天（目前）是個問題」（因為 Algoma 產線轉換與排程混亂）。\n\n### 3. 墨西哥免關稅（Tariff-Free）與採購來源「三大分類法」\n- **Price Steel（Rod）補充關鍵採購現況**：\n  - \"Also, I wanted to add something before we get off track, but you know, he was saying about 80% offshore buying or 70–80%. Mexico is duty—tariff-free in Canada, right? So we are buying product from Mexico.\"\n  - **CSC 代表（Jim）**：\"From Ternium?\"\n  - **Price Steel（Rod）**：\n    - \"No, no, it's not necessarily plate product. I'm talking—you said in general, right? So general products, we do buy product from Mexico which isn't subject to any tariffs today. So we've definitely stopped buying from the US.\"\n    - \"And material from Canada and Mexico are lumped into the same group of non-tariffable items. And then there's offshore, right? So we've got the US in one pile, we've got Mexico and Canada in another, and then we've got true offshore, which is, you know, the pond in between us, the body of water in between us, right?\"\n  - **重點整理**：\n    - 針對整體鋼材採購（非僅限於中厚板，還包含一般鋼品），**墨西哥進入加拿大是免關稅的（tariff-free，受 CUSMA 保障）**。\n    - Price Steel 已經**完全停止從美國採購（definitely stopped buying from the US）**。\n    - 他們現在將供應來源分為**三大類（Three Piles）**：\n      1. **美國（US）**：第一類（因 50% 報復性關稅而停買）。\n      2. **加拿大與墨西哥（Canada & Mexico）**：第二類，歸為同一個「免關稅品項群組（non-tariffable items）」。\n      3. **真正的海外進口（True Offshore）**：第三類，隔著大洋（the pond / body of water in between us）的亞洲等地鋼廠。\n\n### 4. TRQ（關稅配額）與進口許可證（Import Permit）機率驟降\n- **貿易商（Joffrey）**：\n  - \"Because the TRQ, we talked about this a lot, because it's so low, you know, we have a duty toward the customer to try and get an import permit. But the chances have become less and less and less. Since this was—when the TRQ system was first introduced...\"（接 Chunk 16）\n\n---\n\n## Chunk 16 (48:00 – 51:00)\n**主題：TRQ 額度耗盡現況、溫哥華碼頭裝卸費（Terminal Handling）與內陸卡車運費（Trucking）精確成本數據、價差縮小（Spread Narrowed）**\n\n### 1. TRQ 配額管理失效：無法再靠船期控管免稅額度\n- **貿易商（Joffrey）**：\n  - \"...everybody, and for the most part we were successful, you could manage, time your arrival, and now that's all gone. Everybody's just bringing stuff. Sure, the market price on some products has moved up to sort of accommodate that.\"\n  - 當初 TRQ（關稅配額）剛推出時，大家還能透過精準控管到港時間（time your arrival）成功搶到免稅配額；**但現在因為配額被砍得太低，這招已經完全行不通了（\"now, that's all gone\"）**，大家只能直接把貨運進來（承擔配額外關稅風險），部分產品的市場價格也因此被迫墊高來吸收成本。\n\n### 2. 溫哥華港口裝卸費（Terminal Handling）與內陸卡車運費（Trucking）精確拆解\n- **貿易商（Joffrey）與 Price Steel（Dwayne / Rod）說明從 FOB 到內陸交貨（Delivered）的巨額附加成本**：\n  - \"When these guys say they ideally need an advantage, 15 to 20% advantage... you've got to consider the tariff, then the trucking—it costs a lot of money, it's a long way from Vancouver to here. You've got to consider first the tariff on the FOB price, all the handling and stuff at the coast, which is very expensive. These union guys at the dock, they get paid a lot of money handling steel.\"\n  - **CSC 代表（Jim）詢問具體裝卸費用**：\"Roughly how much handling fee?\"\n  - **貿易商（Joffrey）給出精確港口處理費（Terminal Handling Fee）**：\n    - **中厚板（Plate）**：**CAD $65 / MT**（\"We have to pay **65 dollars Canadian a metric ton**, just for the terminal handling... 65 for plate.\"）\n    - **鋼捲（Coil）**：**CAD $45 / MT**（\"And for coil it's **45**.\"）\n    - **原因**：美加西岸從阿拉斯加（Alaska）到聖地牙哥（San Diego，靠近墨西哥邊境）全部由**同一個碼頭工會（same union, ILWU）**壟斷，是全球最昂貴的碼頭裝卸費。\n  - **溫哥華至 Edmonton 內陸卡車運費（Trucking Rate）**：\n    - **Joffrey**：\"And then the trucking, and trucking rates have increased tremendously. What do you have to pay, five, six bucks?\"\n    - **Price Steel（Rod / Dwayne）**：\"**Five, six bucks** [per cwt, 即 $5–$6/cwt].\"\n    - **Joffrey 換算為每公噸加幣**：\"So they're paying **120 dollars Canadian per ton, 130**... to get it here.\"\n    - **CSC 代表（Jim）確認**：\"**130**.\" / **Joffrey**：\"Yeah, 130.\"\n  - **物流與關稅成本總結**：\n    1. **關稅（Tariff）**：先課徵於 FOB 價格上。\n    2. **溫哥華碼頭裝卸費（Terminal Handling）**：中厚板 **CAD $65/MT**，鋼捲 **CAD $45/MT**。\n    3. **溫哥華到 Edmonton 內陸卡車運費（Trucking）**：約 **$5–$6 CAD/cwt**，折合 **CAD $120–$130/MT**。\n    4. **合計溫哥華到廠內陸接駁成本（Handling + Trucking）**：光從溫哥華碼頭卸貨拉到 Edmonton 倉庫，每公噸就要加上 **CAD $185–$195/MT**！\n\n### 3. 當前市場下 15%–20% 價差要求的修正\n- **貿易商（Joffrey）**：\n  - 回憶以前去台灣中鋼開會時，在白板上幫中鋼計算過從台灣運到加拿大內陸加上客戶所需優勢（advantage）的公式（中鋼團隊手機裡還有拍下當時白板的照片），這就是 Rod 和 Dwayne 所說的價差優勢。\n  - **CSC 代表（Jim）**：\"Now maybe even higher.\"\n  - **貿易商（Joffrey）修正**：\n    - \"Well, I think, to be honest, and stop me if I'm wrong though, because of the current situation, the spread, if you like, has narrowed a bit. It still—you still need to be cheaper than Algoma, right, because they're still offering... But maybe, you know, it goes under normal circumstances 15 to 20%, ideally 15 to 20%...\"（接 Chunk 17）\n\n---\n\n## Chunk 17 (51:00 – 54:00)\n**主題：交貨價基準（Delivered Basis vs. CIF/FOB）、本土熱軋鋼捲（HRC）每月瘋狂漲價（CAD $0.85/lb）、本土鋼廠榨取最後利潤與崩盤風險**\n\n### 1. 價差計算基準：必須以「交貨到廠價（Delivered Basis）」計算\n- **貿易商（Joffrey）**：\n  - \"...on a **delivered basis**. That's delivered, it's not CIF or FOB. But in today's market, it's probably closed a wee bit, but still needs to be cheaper than domestic, because people can still buy domestic.\"\n  - 強調 **15%–20% 的價差優勢是以「最終交貨到廠價（Delivered basis，即含關稅、碼頭費、內陸運費的 DDP/Delivered 價）」為基準**，絕非 CIF 或 FOB 基準！雖然在當前特殊市況下，這個價差空間稍微縮小了一點（closed a wee bit），但最終到廠價依然必須比加拿大本土鋼廠便宜。\n\n### 2. 加拿大本土鋼捲（Domestic Coil / HRC）價格劇烈波動與暴漲數據\n- **Price Steel（Dwayne）**：\n  - \"And the volatility of domestic pricing is out there as well, right? I mean... with coil, domestic coil, we've seen it—we're paying attention because of the end use, because of the products that are made from coil out of Canadian suppliers, whether it's toll processors with sheet or whether it's Canadian tube mills, so we're watching the Canadian coil pricing. And it's going up **5% a month**, you know, for the last year, it's been incrementally **2% this month, 5% this month**...\"\n  - 雖然 Price Steel 透過代工裁剪廠（toll processors with sheet）或加拿大製管廠（Canadian tube mills）間接受到本土鋼捲影響，但他們密切追蹤加拿大本土鋼捲價格：過去一年來**每個月都在調漲（這個月漲 2%、下個月漲 5%）**。\n- **貿易商（Joffrey）補充最新漲價數據**：\n  - \"Just went up **five bucks on Monday**, coil price.\"（週一鋼捲價格才剛又漲了 **$5/cwt**，即每百磅漲 5 加幣 / 每短噸漲 100 加幣！）\n  - **Price Steel（Dwayne）**：\"Well, there you go. So that's more than 5%.\"（這漲幅超過 5% 了。）\n  - **貿易商（Joffrey）給出本土熱軋鋼捲（HRC）最新出廠價**：\n    - \"Yeah, it's like **hot rolled coil, ex-mill, is 85 cents Canadian**.\"\n    - 目前加拿大本土熱軋鋼捲（HRC）出廠價（Ex-mill）已高達 **CAD $0.85/lb（即 CAD $85/cwt，或約 CAD $1,874/MT）**！\n\n### 3. 本土鋼廠「末日狂歡」式漲價與市場崩盤預警\n- **貿易商（Joffrey）深度分析北美鋼廠心態**：\n  - \"You know, it's going to end. It has an expiry date. And now, people are—because the increases are coming more often, and you see it, they're even pushing it a bit more. I think some alarm bells are ringing because they realize, the mills realize now that they have a limited time to wring out as much money as they can.\"\n  - \"And so you see it in the US, you see it in Canada. They realize that, okay, this is going to end, we better try and make as much money as quickly as we can, and push the price up and up and up. And they're killing their own customers, they're slowly drowning their own customers with the price, because at some point in time, the customers such as Price Steel or the other service centers, they're not going to be able to pass it on. The market can only tolerate so much. And then when it stops, that's when the price comes crashing down.\"\n  - **核心觀點**：\n    - 這種高價是有「有效期限（expiry date）」的。現在美加本土鋼廠漲價越來越頻繁、幅度越來越大，反而敲響了警鐘（alarm bells are ringing）。\n    - 鋼廠心知肚明好日子有限，正試圖在行情結束前**榨乾最後一分錢（wring out as much money as they can）**。\n    - 這種做法正在「慢性淹死自己的客戶（slowly drowning their own customers）」，一旦像 Price Steel 這樣的服務中心（service centers）無法再將高價轉嫁給下游，市場承受力達到極限時，**價格就會瞬間崩盤（crashing down）**。\n- **Price Steel（Dwayne）總結價差作為「安全緩衝墊（Cushion）」的必要性**：\n  - \"And that brings into, you know, the importance to us of that spread. Because we have to, over a five-month travel, from a five-month cycle between placing an order and receiving it, we have to be able to navigate that volatility in our own Canadian market... When we lock in with a price, we're stuck with it. We understand that. And we've got to be comfortable with that for five months.\"\n  - **Joffrey**：\"So it's a **cushion**.\"\n  - 正因為存在本土價格隨時見頂崩盤的風險，15%–20% 的價差對 Price Steel 來說是跨越 5 個月交期週期的**安全緩衝墊（cushion）**。\n\n---\n\n## Chunk 18 (54:00 – 57:00)\n**主題：本土鋼廠狙擊進口貨的手段（$50 vs $40/cwt 實例）、加拿大四大鋼廠外資背景剖析（Algoma、Stelco、Evraz/Interpro/Oregon Steel、Dofasco）**\n\n### 1. 本土鋼廠如何刻意殺價狙擊在途進口貨\n- **Price Steel（Rod）舉例說明五個月交期內價格倒掛的風險**：\n  - \"Yeah, and the risk with that too, like you said, is the cushion that Joffrey refers to is we don't know what's going to happen in five months in the Canadian market... So we're buying something offshore for a five-month delivery at, you know, **$50 a hundredweight [$50/cwt]**, and all of a sudden in four months, Algoma's at **$40 a hundredweight [$40/cwt]**. So we're like, 'Oh shit, now all the material we got coming in is over cost.'\"\n  - \"And the Canadian mills know what's going on. They pay attention to what's coming in, they have a good understanding. So quite often we see, if it's too close of a spread, we're not going to play because they—the mills will play that card. And we've seen it in tubing, we've seen it in merchant bars, where, 'Okay, here comes that material, okay, guess what, your price is now this.' Well, oh, now what, right?\"\n  - **Dwayne**：\"Yeah, **5 or 8% swings per month**, I mean that's fucking crazy to me. 15 years ago that never happened.\"\n  - **重點解析**：\n    - 假設海運期貨買在 **$50/cwt**（5 個月交期），結果 4 個月後 Algoma 把價格殺到 **$40/cwt**，在途進口貨立刻變成高成本套牢庫存（over cost）。\n    - 加拿大本土鋼廠非常清楚有哪些進口貨正在海上漂，如果進口價差（spread）太小，本土鋼廠就會在進口貨快到港時「出牌（play that card）」故意降價狙擊（他們在鋼管 tubing 和商用條鋼 merchant bars 已經多次見識過這種手段）。\n    - 現在每個月價格波動高達 **5% 到 8%（5 or 8% swings per month）**，這在 15–20 年前是聞所未聞的（CSC 代表 Jim 感嘆：\"They should raise the price gradually, slowly...\"，Joffrey 回應：\"Yeah, but they don't, they never learn.\"）。\n\n### 2. 加拿大本土鋼廠全數為外資控股（Foreign-Owned）的結構性問題\n- **貿易商（Joffrey）與 Price Steel 團隊盤點加拿大鋼廠背後的金主與動機**：\n  - \"But now, Jim, the difference is now that actually **all of the companies in Canada, the steel companies, are owned by foreign companies**.\"\n  1. **Algoma Steel**：\n     - **Joffrey**：\"Algoma is owned by an **American private equity company, like a hedge fund**. They have one goal, and that's to create value for their investors and give dividends to the investors. So they are trying very hard, and they had tremendous issues when they switched to **EAF** [電弧爐]. And they weren't producing plate... when they did an upgrade of the plate mill, they were gone for what, **two years** or more? So they're desperately trying to recover market share and get a high price to give their investors some money.\"\n     - Algoma 由**美國私募股權基金 / 對沖基金（American private equity / hedge fund）**控股，唯一目標就是為投資人創造價值並發放股息（dividends）。他們在升級中厚板廠（plate mill upgrade）時離開市場長達 **2 年以上**，且轉換至 **EAF（電弧爐）**時遇到極大問題，因此現在急於搶回市佔率並維持高價來回報股東。\n  2. **Stelco**：\n     - **Joffrey & CSC 代表（Jim）**：\"Stelco is American — **Cleveland-Cliffs**. You know, they're playing a political game at the moment, I think.\"\n     - **Price Steel（Dwayne / Rod）**：\"Think? Even we know!\" / \"Yeah, I mean it's clear, it's just posturing.\"\n     - Stelco 被美國 **Cleveland-Cliffs** 收購，目前正在玩政治把戲、擺姿態（political game / posturing）。\n  3. **Evraz North America（Interpro / IPSCO Regina & Oregon Steel）**：\n     - **CSC 代表（Jim）**：\"And Oregon Steel is... Interpro?\"\n     - **Joffrey & Dwayne**：\"It's **Interpro, Evraz**.\" / \"Interpro was Russian—it was **Abramovich**—now it's **American**.\"（原為俄羅斯富豪阿布拉莫維奇 Abramovich 控股的 Evraz，現已由美國資本收購，即 Atlas Holdings）。\n     - **Dwayne 拆解 Evraz 北美三大部門**：\n       - \"Evraz / Oregon I think split into three different divisions: **Interpro [IPSCO] in Regina**, **Oregon Steel in Portland**, and then what, the pipe and...\"（接 Chunk 19：科羅拉多州 Pueblo）。\n\n---\n\n## Chunk 19 (57:00 – 01:00:00)\n**主題：Oregon Steel 與 Dofasco 背景、美加雙向 50% 關稅與美國高鋼價、Joffrey 揭露加拿大政府原擬在貿易談判破局前夕發布的「TRQ 砍半 / 取消」內幕消息、CSC 團隊內部中文討論**\n\n### 1. Evraz 科羅拉多廠、Dofasco 背景與最理想的合作夥伴 Oregon Steel\n- **Price Steel（Dwayne）& Joffrey**：\n  - Evraz 第三個部門在美國科羅拉多州 **Pueblo, Colorado**，生產鋼管、鐵軌與鋼筋（pipe, rail, and rebar）。\n  - **Dofasco**：由印度 / 英國跨國集團 **ArcelorMittal（安賽樂米塔爾）**控股（\"Dofasco is Indian-UK company, it's ArcelorMittal\"）。\n- **Price Steel（Dwayne）高度評價美國 Oregon Steel（波特蘭廠）**：\n  - \"So yeah, I mean it's unfortunate because **Oregon Steel** to me anyways was probably our **best ally** domestically. Close, smaller, nimble, they could do everything that we needed them to—they can't normalize 10-foot wide, but that's a small part of what we needed—project work, you could truck, you could rail, they were very good, very nimble.\"\n  - **CSC 代表（Jim）詢問運輸方式**：\"So you buy their material, they ship here by train or by truck?\"\n  - **Dwayne**：\"**Both. Both, yeah.**\"（火車與卡車皆可，Jim 感嘆加拿大的火車非常長，比台灣長很多）。\n  - 總結：Oregon Steel（位於美國奧勒岡州波特蘭）距離近、規模較小但極具彈性（nimble），除了無法做 10 呎寬常規化熱處理板（can't normalize 10-foot wide）外，幾乎能滿足所有專案需求，且可透過鐵路或卡車直達，曾是 Price Steel 最佳盟友，可惜因關稅壁壘被迫中斷。\n\n### 2. 美加雙向 50% 關稅與美國世界最貴鋼價（Beam > $2.00/lb）\n- **CSC 代表（Jim）確認關稅稅率**：\n  - \"Rod, is Oregon Steel 50% tariff from US? From US to Canada you have to pay 50%?\"\n- **Price Steel（Dwayne & Rod）**：\n  - \"Yeah, **50%**. And they're talking about 50% in January 1st, I don't actually know what that would be... Yes, it's still in place.\"\n  - \"You know, **American steel is the most expensive in the world**... Again, when you talk about beam, you know, American—Joe-Blow beam, you get railcars shipped into Western Canada, it's **over two bucks a pound [> $2.00/lb]**! Compared to, you know, you buy **80 [cents]** from offshore, it's still half the price. It stops making sense. So yeah, US is just gone, not an option. And I don't know when it will be.\"\n  - **重點數據**：\n    - 美國進口到加拿大同樣要課徵 **50% 報復性關稅**。\n    - 美國鋼價已是全世界最貴，再加上 50% 關稅後完全是天價（sky-high）：例如一般美國型鋼（H型鋼 / Beam）用鐵路運到加西，每磅超過 **$2.00（over two bucks a pound）**，而從海外進口只要 **$0.80/lb** 左右（加上關稅仍僅約一半價格），因此美國鋼材已完全出局（not an option）。\n\n### 3. 【CSC 團隊內部中文小聲討論】（約 58:15 – 59:45 背景音）\n> 在外方代表談論美國關稅與貿易談判的同時，中鋼團隊成員（女聲與男聲）在背景小聲以中文核對客戶庫存/規格單據上的厚度與牌價加價（Extras）：\n- **CSC 團隊內部對話摘錄**：\n  - 「他昨天給的那個……對啊，我昨天還給你看，我們就怪怪的……」\n  - 「這一張可以做，啊這一張……到那個的話，跟它同一個厚度……」\n  - 「**0.43** 然後這個……我看一下這個……**43.1**……**2.8**……**0.118**……」\n  - 「喔 **0.11** 不行，要 **0.119**……那這個 **0.126** 開始……對，**10、12、16**……可以的、可以的，那也是……它這個是 **2 inch**……」\n  - 「其他的……後面我用那個……」\n  - （註：中鋼團隊正在現場對照手頭的規格表與中鋼可接單之薄板/厚板尺寸下限，例如 `0.118\"` / `0.119\"` / `0.126\"` 及 `2\"` 等厚度限制與對應加價表。）\n\n### 4. Joffrey 揭露渥太華（Ottawa）獨家內幕：加拿大政府原已擬好再度大砍 TRQ 的公告\n- **貿易商（Joffrey）分享獨家政商情報**：\n  - \"I thought naively that Trump might, you know, be open to making a deal before the midterms, because there's no way the Canadian government is doing anything to help them out before the midterms.\"\n  - \"I was privy to this... there's a guy called **Gabe**... in Toronto. Somebody sent me an article that he had written for publication the following morning. And he's got really good connections in Ottawa... I think directly to the **Minister of Finance's office**.\"\n  - \"And it was the day the trade talks fell apart. And it was due to be published the following morning, and it said that **the Canadian government has cancelled the...**\"（接 Chunk 20）\n\n---\n\n## Chunk 20 (01:00:00 – 01:03:00)\n**主題：加拿大政府擬取消非 FTA 國家 TRQ 並將 FTA 國家 TRQ 從 75% 降至 50% 之內幕、加拿大對美出口量腰斬（600 萬噸 → 300 萬噸）、Enbridge 60 萬噸管線採購、加國鋼廠產能利用率（< 70% vs 美國 > 80%）與未來產能過剩崩盤危機**\n\n### 1. 渥太華未發布的政令內幕：取消非 FTA 配額、FTA 配額由 75% 砍至 50%\n- **貿易商（Joffrey）延續 Chunk 19 的內幕消息**：\n  - \"...**[cancelled the] non-free trade TRQs**, and they have **further reduced the free trade TRQs to 50% from the current 75%**.\"\n  - \"It was all ready to go. And it went on to say that these were concessions, you know, in the trade talks. I'm pretty sure that that's **still on the table**... Because to do something like that, or cancel them outright and just apply a 50% tariff, as far as I can see, that's the only way Canada's going to get any relief from the US on this 50% tariff.\"\n  - **Price Steel（Dwayne）確認**：\"So you're suggesting—he's suggesting that those would have been put in place to appease the US?\"\n  - **貿易商（Joffrey）**：\"It wasn't a suggestion, it was **stated as a fact**. And so that was part of the...\"\n  - **情報核心重點**：\n    - 在美加貿易談判破裂當天，多倫多一位與渥太華財政部長辦公室（Minister of Finance's office）關係密切的人士（Gabe）已經寫好隔天一早要發布的專文。\n    - 內容明確作為「事實（stated as a fact）」指出：作為對美國貿易談判的讓步（concessions to appease the US），**加拿大政府準備直接取消「非自由貿易協定國（non-FTA，如台灣、中國等）」的 TRQ 免稅配額，並將「自由貿易協定國（FTA，如韓國、歐盟等）」的 TRQ 配額從現行的 75% 進一步削減至 50%！**\n    - 雖然因為當天談判破裂而暫緩發布，但 Joffrey 確信**這項方案目前仍在談判桌上（still on the table）**，因為全面築起 50% 關稅高牆、封堵第三國鋼材進入北美，是加拿大向美國換取豁免 50% 關稅的唯一籌碼。\n\n### 2. 加拿大鋼廠對美出口量腰斬（600 萬噸 → 300 萬噸）與產能利用率真相\n- **Price Steel（Dwayne）**：\n  - \"Look, they're [Canadian mills] profitable shipping into the US even paying the 50% premiums.\"\n  - 認為美國鋼價夠高，加拿大鋼廠就算付 50% 關稅賣去美國還是有利潤。\n- **貿易商（Joffrey）用宏觀數據反駁**：\n  - **對美出口量腰斬**：\n    - \"Yeah, but when you look at the volumes, right: in **2024**, they sold **6 million tons** into the US, the Canadian mills. **This year, it'll probably be 3 [million tons]**.\"\n    - 2024 年加拿大鋼廠賣了 **600 萬噸（6 million tons）**鋼材到美國，今年（受關稅衝擊）預計腰斬只剩 **300 萬噸（3 million tons）**！\n  - **各廠並非滿載（Not flat out），而是產能受阻或作秀**：\n    - **Dwayne**：\"But they're all still flat out.\"\n    - **Joffrey**：\"Well, they're not flat out, they just can't produce, right?\"\n      1. **Stelco / Cleveland-Cliffs**：之前在賣扁鋼胚（selling slabs），現在執行長 Lourenco Goncalves 威脅要關閉冷軋與鍍鋅產線（shut down cold rolled and galvanized）並裁員 **500–600 人（get rid of 500–600 jobs）**，這是在向政府施壓作秀（posturing）。\n      2. **Algoma**：因為轉換 **EAF（電弧爐）**遭遇一連串生產問題，根本產不出來。\n      3. **Interpro（Evraz Regina）**：忙於生產輸油氣鋼管（pipe），部分銷往美國，且加拿大能源巨頭 **Enbridge** 今年超級忙碌，向 Interpro 採購了高達 **60 萬噸（600,000 tons）**的鋼管用於各項管線工程（\"Enbridge are super busy, they've got like 600,000 tons of pipe they bought this year from Interpro for all their various projects\"）。\n  - **美加鋼廠產能利用率（Capacity Utilization）對比**：\n    - **Joffrey**：\n      - \"If you look at the capacity utilization in **Canada**, I bet you it's **not above 70%**. Guarantee it's not above 70%, it's **somewhere in the 60s [60%–69%]**.\"\n      - \"If you look at the utilization rate in the **US**, it's **high 80s [85%–89%]** at the moment. And that's where it needs to be.\"\n    - 加拿大鋼廠整體產能利用率保證**不到 70%（僅在 60% 多）**，反觀美國鋼廠產能利用率目前高達 **80% 後段（high 80s）**。\n\n### 3. 未來預警：一旦加拿大本土產能恢復，若無美國市場吸納，加國鋼價必將崩盤\n- **貿易商（Joffrey）總結加拿大市場的最大隱憂**：\n  - \"And so when the capacity comes back on in Canada—and it will—they need to have access to the US, otherwise **Canadian prices are going to tank**.\"\n  - \"Because if they've got to sell an extra **3 million tons** in Canada, you know, there's going to be more protectionism, lower prices on everything except beam... So they're desperately trying to do that.\"\n  - **關鍵結論**：一旦加拿大鋼廠（如 Algoma EAF 與中厚板廠）產能恢復正常，如果還無法重新打開美國市場，這多出來的 **300 萬噸（extra 3 million tons）**鋼材將被迫倒灌回狹小的加拿大本土市場。屆時加拿大國內除了型鋼（beam，加拿大無生產）以外的所有鋼品價格都將**暴跌崩盤（tank）**，同時也會引發加拿大政府更激烈的貿易保護主義（more protectionism）。\n\n---\n\n## 出席人員與講者識別說明\n- **Price Steel 代表（客戶端，溫哥華/愛德蒙頓地區單據點鋼鐵服務中心）**：主要發言人（男性，曾與車主/老闆 Dwayne 共事，負責採購與銷售策略，會議中被稱為代表 Price Steel 的主管；老闆為 Dwayne，辦公室就在隔壁）。\n- **Jeff（貿易商 / 代理商代表，具英國口音）**：非常熟悉加拿大與美國關稅、TRQ（關稅配額）、反傾銷（Anti-dumping）、進口商遊說組織（APVMA）與歐美市場動態（其公司亦在休斯頓設有據點，且銷售德國與義大利產線產品至加東）。\n- **CSC（中鋼）團隊**：包含男性主管/業務代表與女性業務代表（曾於開場片頭以中文低聲確認會議與提問，並在會中針對庫存水位、Algoma 電弧爐 EAF 低碳鋼/綠鋼法規、以及 Hyundai 交期與採購量進行提問）。\n\n---\n\n## Chunk 21 (01:03:00 - 01:06:00)\n\n### 1. 開場背景與美加關稅（50% 降至 20% 條件）及廢除 TRQ 之推演\n- **01:03:00 - 01:03:04 [CSC 團隊內部背景音與過場]**：\n  - 片頭極短暫出現中鋼團隊女聲背景微音（似小聲說：「還有嗎？好…住…」），隨即切入 Jeff 接續前一段關於美加關稅談判的發言。\n- **01:03:04 - 01:03:45 [Jeff]**：\n  - 闡述美國給予加拿大關稅減免的唯一可能途徑：\n  - **原話引述**：*\"I'll tell you one thing. The only way the Americans are going to give some relief on the tariff—and I don't think it will go away, but it might get dropped to 20%, and 20% would be manageable—is if the Cana       sessionStorage.removeItem(STORAGE_KEY);
      document.getElementById("pwd-input").value = "";
      document.getElementById("app-container").style.display = "none";
      document.getElementById("auth-overlay").style.display = "flex";
    }

    document.getElementById("auth-form").addEventListener("submit", function (e) {
      e.preventDefault();
      const val = document.getElementById("pwd-input").value.trim();
      if (val === PASSCODE) {
        sessionStorage.setItem(STORAGE_KEY, "1");
        document.getElementById("auth-error").style.display = "none";
        unlockPortal();
      } else {
        const err = document.getElementById("auth-error");
        err.style.display = "block";
        document.getElementById("pwd-input").select();
      }
    });

    // Portal UI Initialization
    function initPortal() {
      const custSelect = document.getElementById("customer-select");
      custSelect.innerHTML = "";
      meetingsData.forEach((m, idx) => {
        const opt = document.createElement("option");
        opt.value = idx;
        opt.textContent = `[${m.order}] ${m.date} (${m.time.split(" ")[0]}) — ${m.customer}`;
        custSelect.appendChild(opt);
      });

      renderSidebarCustomers();
      selectMeeting(currentMeetingIndex, 0);
    }

    function renderSidebarCustomers() {
      const container = document.getElementById("customer-cards-list");
      container.innerHTML = "";
      meetingsData.forEach((m, idx) => {
        const card = document.createElement("div");
        card.className = "customer-card" + (idx === currentMeetingIndex ? " active" : "");
        card.onclick = () => selectMeeting(idx, 0);
        card.innerHTML = `
          <div class="customer-card-header">
            <span>${m.order} ・ ${m.date}</span>
            <span>${m.time.split(" ")[0]}</span>
          </div>
          <div class="customer-card-name">${m.customer}</div>
          <div class="customer-card-meta">📍 ${m.location}</div>
        `;
        container.appendChild(card);
      });
    }

    function selectMeeting(mIdx, dIdx = 0) {
      currentMeetingIndex = Number(mIdx);
      currentDocIndex = Number(dIdx);

      document.getElementById("customer-select").value = currentMeetingIndex;
      renderSidebarCustomers();

      const meeting = meetingsData[currentMeetingIndex];
      const docSelect = document.getElementById("doc-select");
      docSelect.innerHTML = "";
      meeting.docs.forEach((d, idx) => {
        const opt = document.createElement("option");
        opt.value = idx;
        opt.textContent = `${d.title}`;
        docSelect.appendChild(opt);
      });
      docSelect.value = currentDocIndex;

      renderDocTabs();
      renderCurrentDocument();
    }

    function renderDocTabs() {
      const meeting = meetingsData[currentMeetingIndex];
      const tabsContainer = document.getElementById("doc-tabs-list");
      tabsContainer.innerHTML = "";
      meeting.docs.forEach((d, idx) => {
        const btn = document.createElement("button");
        btn.className = "doc-tab-btn" + (idx === currentDocIndex ? " active" : "");
        btn.onclick = () => selectDoc(idx);
        btn.innerHTML = `
          <span>${d.short_title}</span>
          <span class="doc-badge">${d.badge}</span>
        `;
        tabsContainer.appendChild(btn);
      });
    }

    function selectDoc(dIdx) {
      currentDocIndex = Number(dIdx);
      document.getElementById("doc-select").value = currentDocIndex;
      renderDocTabs();
      renderCurrentDocument();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function onCustomerSelectChange(val) {
      selectMeeting(Number(val), 0);
    }

    function onDocSelectChange(val) {
      selectDoc(Number(val));
    }

    // Format GitHub Alert blocks (> [!IMPORTANT] etc.) nicely
    function preprocessMarkdown(md) {
      return md.replace(/^> \[!([A-Z]+)\]\s*$/gm, "> **[$1]**");
    }

    // Simple fallback Markdown parser if CDN is blocked
    function basicMarkdownParse(md) {
      let html = md
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/^### (.*)$/gm, "<h3>$1</h3>")
        .replace(/^## (.*)$/gm, "<h2>$1</h2>")
        .replace(/^# (.*)$/gm, "<h1>$1</h1>")
        .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\n\n/g, "<br/><br/>");
      return html;
    }

    function renderCurrentDocument() {
      const meeting = meetingsData[currentMeetingIndex];
      const doc = meeting.docs[currentDocIndex];

      // Update Banner
      const banner = document.getElementById("meeting-banner");
      banner.innerHTML = `
        <div class="banner-top">
          <div class="banner-badges">
            <span class="badge-pill">${meeting.order}｜${meeting.date} (${meeting.time})</span>
            <span class="badge-pill badge-tag">${meeting.tag}</span>
          </div>
          <span style="font-size:13px; color:#64748b;">⏱️ 錄音時長：${meeting.duration}</span>
        </div>
        <h2 class="banner-title">${meeting.customer} — ${doc.short_title}</h2>
        <div class="banner-meta">
          <strong>📍 拜訪地點：</strong>${meeting.location} &nbsp;|&nbsp;
          <strong>👥 與會代表：</strong>${meeting.attendees}
        </div>
        <div class="banner-summary">
          <strong>💡 場次核心摘要：</strong>${meeting.summary}
        </div>
      `;

      // Render Markdown Content
      const rawMd = preprocessMarkdown(doc.content);
      const viewer = document.getElementById("markdown-viewer");
      if (window.marked && typeof marked.parse === "function") {
        viewer.innerHTML = marked.parse(rawMd);
      } else {
        viewer.innerHTML = basicMarkdownParse(rawMd);
      }
    }

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.style.display = "block";
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => {
        t.style.display = "none";
      }, 3500);
    }

    // 1. Export as Plain Text (.txt)
    function exportTXT() {
      const meeting = meetingsData[currentMeetingIndex];
      const doc = meeting.docs[currentDocIndex];

      let txt = "====================================================================\r\n";
      txt += `【2026 加拿大客戶拜訪會議記錄】${meeting.customer}\r\n`;
      txt += `日期時間：${meeting.date} (${meeting.time}) | 地點：${meeting.location}\r\n`;
      txt += `報告名稱：${doc.title}\r\n`;
      txt += "====================================================================\r\n\r\n";

      let body = doc.content
        .replace(/<br\s*\/?>/gi, " / ")
        .replace(/\*\*(.*?)\*\*/g, "$1")
        .replace(/^> \[!([A-Z]+)\]/gm, "[$1]")
        .replace(/\r?\n/g, "\r\n");

      txt += body;

      const blob = new Blob(["\uFEFF" + txt], { type: "text/plain;charset=utf-8" });
      triggerDownload(blob, `${doc.filename}.txt`);
      showToast("✅ 已匯出 TXT 文字檔：" + doc.filename + ".txt");
    }

    // 2. Export as genuine Microsoft Word OpenXML (.docx)
    function exportDOCX() {
      const meeting = meetingsData[currentMeetingIndex];
      const doc = meeting.docs[currentDocIndex];

      const binStr = atob(doc.docx_b64);
      const len = binStr.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) {
        bytes[i] = binStr.charCodeAt(i);
      }

      const blob = new Blob([bytes], {
        type: "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
      });
      triggerDownload(blob, `${doc.filename}.docx`);
      showToast("✅ 已匯出標準 Word 檔案：" + doc.filename + ".docx");
    }

    // 3. Export as PDF
    function exportPDF() {
      const meeting = meetingsData[currentMeetingIndex];
      const doc = meeting.docs[currentDocIndex];
      const element = document.getElementById("printable-area");

      if (window.html2pdf) {
        showToast("⏳ 正在產生 PDF 檔案，請稍候...");
        const opt = {
          margin:       [10, 10, 10, 10],
          filename:     `${doc.filename}.pdf`,
          image:        { type: "jpeg", quality: 0.98 },
          html2canvas:  { scale: 2, useCORS: true, scrollY: 0 },
          jsPDF:        { unit: "mm", format: "a4", orientation: "portrait" },
          pagebreak:    { mode: ["avoid-all", "css", "legacy"] }
        };
        html2pdf().set(opt).from(element).save().then(() => {
          showToast("✅ 已完成匯出 PDF：" + doc.filename + ".pdf");
        }).catch(() => {
          window.print();
        });
      } else {
        window.print();
      }
    }

    function triggerDownload(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => {
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }, 200);
    }

    checkAuth();
  </script>
</body>
</html>
